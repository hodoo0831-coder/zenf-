# ZEN Manufacturing Platform — Netlify 배포 설정
# 빌드 과정 없이 정적 파일을 그대로 서빙 (단일 HTML)
[build]
  publish = "."
  command = ""

# 세이프보이스 접수 API(netlify/functions/report.mjs)가 쓰는 @netlify/blobs를
# 번들링할 수 있도록 함수 디렉터리·번들러를 명시 (package.json 의존성 설치는
# Netlify가 빌드 시 자동 수행)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 루트("/")는 index.html(= ZEN_Manufacturing_Platform_11.0.html 동일본)로 서빙됨.
# 구주소 호환: 파일명으로 접근해도 동작하도록 rewrite 보조.
[[redirects]]
  from = "/platform"
  to = "/ZEN_Manufacturing_Platform_11.0.html"
  status = 200

# 구파일명으로 들어와도 최신본을 서빙
[[redirects]]
  from = "/ZEN_Manufacturing_Platform.html"
  to = "/ZEN_Manufacturing_Platform_11.0.html"
  status = 301

# 세이프보이스(현장 위험 신고·개선 제안): /report는 QR용 짧은 주소
[[redirects]]
  from = "/report"
  to = "/ZEN_SafeVoice.html"
  status = 200

[[redirects]]
  from = "/r"
  to = "/ZEN_SafeVoice.html"
  status = 200

[[redirects]]
  from = "/safevoice"
  to = "/ZEN_SafeVoice.html"
  status = 200

# 관리자 전용 주소 (같은 앱, 경로로 화면 분기)
[[redirects]]
  from = "/admin"
  to = "/ZEN_SafeVoice.html"
  status = 200

# 보안 헤더 (임베드/클릭재킹 완화, 데모 프로토타입 기준)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
