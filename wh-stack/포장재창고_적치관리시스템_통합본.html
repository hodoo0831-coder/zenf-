function dec(b64){
  var bin=atob(b64), n=bin.length, bytes=new Uint8Array(n);
  for(var i=0;i<n;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
var fr=document.getElementById("fr"), bw=document.getElementById("bw"), ba=document.getElementById("ba"), cur="";
function show(which){
  if(cur===which) return; cur=which;
  bw.classList.toggle("on", which==="worker");
  ba.classList.toggle("on", which==="admin");
  fr.srcdoc = dec(APP[which]);
  try{ localStorage.setItem("zen_wh_all_role", which); }catch(e){}
}
bw.onclick=function(){ show("worker"); };
ba.onclick=function(){ show("admin"); };
var start="worker";
try{ var v=localStorage.getItem("zen_wh_all_role"); if(v==="admin"||v==="worker") start=v; }catch(e){}
show(start);
</script>
