<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEN Manufacturing Platform · AP 대전공장</title>
<meta name="theme-color" content="#0a1626">
<style>
  :root{
    --bg:#eef2f7;--bg2:#e6ecf4;--panel:#ffffff;--panel2:#ffffff;
    --line:#e6ebf2;--line2:#d3dde9;--ink:#1f3a5c;--muted:#5f6f86;--muted2:#7d8ba0;
    --blue:#3f74b5;--navy:#1e3a5f;--green:#22a05f;--red:#dc4b4b;--amber:#d98a2b;--purple:#a855f7;--teal:#14b8a6;
    --shadow:0 3px 12px rgba(30,58,95,.08);--radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:linear-gradient(180deg,#f2f5fa,#e9eef5) fixed,var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}

  /* ===== Login (브랜드 네이비 유지) ===== */
  .login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(900px 600px at 50% 5%,#2c4a68 0,#1b3350 55%,#152a44 100%)}
  .login .box{width:390px;max-width:92vw;border:1px solid #2f4d6e;border-radius:22px;padding:32px;background:linear-gradient(180deg,#22405f,#1a3350);box-shadow:0 24px 60px rgba(0,0,0,.4);color:#eaf1fb}
  .login .brand{font-size:25px;font-weight:800;text-align:center}
  .login .brand span{color:#7fc3ad}
  .login .sub{text-align:center;color:#9fb6d1;font-size:12.5px;margin:5px 0 22px}
  .login label{font-size:12px;color:#9fb6d1;font-weight:700;display:block;margin:14px 0 7px}
  .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .roles button{border:1px solid #345677;background:#1d3a58;color:#eaf1fb;border-radius:13px;padding:12px 4px;cursor:pointer;font-weight:700;font-size:13px;transition:.14s}
  .roles button .e{display:block;font-size:20px;margin-bottom:4px}
  .roles button.on{border-color:#7fc3ad;background:#255079;box-shadow:0 0 0 2px #7fc3ad33}
  .login input,.login select{width:100%;border:1px solid #345677;background:#15304c;color:#eaf1fb;border-radius:13px;padding:12px 13px;font-size:14px}
  .login .go{width:100%;margin-top:18px;border:none;border-radius:13px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;color:#12263c;background:linear-gradient(180deg,#63d7a2,#33bd86)}
  .login .go:hover{filter:brightness(1.05)}
  .login .note{text-align:center;color:#7f97b4;font-size:11px;margin-top:14px}

  .app{display:none;grid-template-columns:230px 1fr;min-height:100vh}
  .app.show{display:grid}

  /* ===== Sidebar (네이비) ===== */
  .nav{background:linear-gradient(180deg,#1e3a5c,#17324f);border-right:1px solid #16304c;padding:16px 12px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow:auto}
  .nav .logo{padding:6px 8px 12px}
  .nav .logo .t{font-size:17px;font-weight:800;color:#fff}.nav .logo .t span{color:#7fc3ad}
  .nav .logo .s{font-size:11px;color:#9fb6d1;margin-top:2px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;color:#cdddf0;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid transparent;transition:.13s}
  .nav a .ic{font-size:16px;width:20px;text-align:center}
  .nav a .badge{margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px}
  .nav a:hover{background:#244a6f}
  .nav a.on{background:#2b558014;background:linear-gradient(180deg,#2f5c88,#274d74);border-color:#3f6fa0;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .nav .sec{font-size:10.5px;color:#7f9abb;font-weight:800;letter-spacing:.5px;padding:12px 10px 5px;text-transform:uppercase}
  .nav .spacer{flex:1}
  .nav .user{border:1px solid #33547a;border-radius:12px;padding:10px 11px;background:#20406097;font-size:12px;display:flex;align-items:center;gap:9px;color:#eaf1fb}
  .nav .user .av{width:30px;height:30px;border-radius:9px;background:#2f5c88;display:flex;align-items:center;justify-content:center;font-size:15px}
  .nav .user .nm{font-weight:800}.nav .user .rl{color:#9fb6d1;font-size:11px}
  .nav .user .out{margin-left:auto;color:#9fb6d1;cursor:pointer;font-size:15px}

  .stage{padding:20px 24px 32px;min-width:0}
  .bar{display:flex;align-items:center;gap:16px;margin-bottom:18px}
  .bar h1{font-size:23px;font-weight:800;margin:0;color:var(--navy)}
  .bar .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .bar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .bar .clock{text-align:right;font-size:12.5px;color:var(--navy)}.bar .clock .d{font-weight:700}
  .bar .clock .r{color:var(--green);display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:3px;font-size:11px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .src{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid var(--line2);background:#fff;color:var(--muted)}
  .src.live{color:#22a05f;border-color:#b8e6cc;background:#eafaf1}
  .btn{border:1px solid var(--line2);background:#fff;color:var(--navy);padding:9px 14px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:.14s;box-shadow:0 1px 2px rgba(30,58,95,.05)}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.p{border:none;background:linear-gradient(180deg,#3f74b5,#255fd6);color:#fff;box-shadow:0 3px 10px rgba(47,111,237,.28)}
  .btn.p:hover{color:#fff;filter:brightness(1.05)}
  .btn.o{border:none;background:linear-gradient(180deg,#f6a623,#ef9310);color:#fff;box-shadow:0 3px 10px rgba(240,150,20,.3)}

  .card{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);padding:17px}
  .card h3{margin:0 0 15px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;justify-content:space-between;color:var(--navy)}
  .card h3 .hint{font-size:11.5px;color:var(--muted);font-weight:600}
  .grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .kpi{border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);padding:17px 18px;position:relative;overflow:hidden}
  .kpi .ic{display:none}
  /* AI LIVE CONTROL 히어로 */
  .livebar{border-radius:16px;padding:18px 22px;margin-bottom:16px;color:#eaf1fb;background:linear-gradient(120deg,#1e3a5c,#22506f 62%,#1b4a62);box-shadow:0 10px 28px rgba(30,58,95,.22);display:grid;grid-template-columns:186px 1fr 320px;gap:22px;align-items:center;position:relative;overflow:hidden}
  .livekpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;z-index:1}
  .hk{padding:0 15px;border-left:1px solid rgba(255,255,255,.13)}
  .hk:first-child{border-left:none;padding-left:0}
  .hk .l{font-size:11.5px;color:#a8c0da;font-weight:600}
  .hk .v{font-size:24px;font-weight:800;color:#fff;margin-top:3px;line-height:1.1}
  .hk .v small{font-size:12px;color:#9fb6d1;font-weight:600}
  .hk .sub{font-size:10.5px;color:#9fb6d1;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hk .sp{margin-top:7px;opacity:.92}
  .livebar::before{content:"";position:absolute;right:-40px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(89,211,160,.15),transparent 70%);pointer-events:none}
  .livebar .lh .tag{font-size:11px;letter-spacing:2.5px;color:#8fd8b9;font-weight:800}
  .livebar .lh .t{font-size:22px;font-weight:800;margin-top:5px}
  .livebar .lh .s{font-size:12px;color:#a8c0da;margin-top:5px}
  .livebar .feed{position:relative;z-index:1}
  .livebar .fh{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:4px;color:#cfe0f2}
  .livebar .fitem{display:flex;gap:11px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.1)}
  .livebar .fitem:last-child{border:none}
  .livebar .fic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;background:rgba(255,255,255,.08);flex:0 0 auto}
  .livebar .ft{flex:1;min-width:0}.livebar .ft .r{font-weight:700;font-size:13px}.livebar .ft .s{font-size:11.5px;color:#a8c0da;margin-top:1px}
  .livebar .ftime{font-size:11px;color:#9fb6d1;flex:0 0 auto}
  @media(max-width:1100px){.livebar{grid-template-columns:1fr}.livekpis{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:640px){.livekpis{grid-template-columns:repeat(2,1fr);gap:12px}.hk{border-left:none;padding:0}}
  .kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600}
  .kpi .val{font-size:27px;font-weight:800;margin-top:6px;color:var(--navy)}.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
  .kpi .delta{font-size:11.5px;font-weight:700;margin-top:4px}
  .pos{color:#22a05f}.neg{color:#dc4b4b}.zero{color:var(--muted)}
  .tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;display:inline-block}
  .t-red{background:#fdecec;color:#dc4b4b;border:1px solid #f5c2c2}.t-amber{background:#fff6e5;color:#c77700;border:1px solid #f3d9a0}
  .t-green{background:#e8f6ee;color:#22a05f;border:1px solid #b8e6cc}.t-blue{background:#e9f1fd;color:#3f74b5;border:1px solid #c3d9f7}
  .sdot{display:inline-block;width:11px;height:11px;border-radius:50%}
  .s-red{background:var(--red);box-shadow:0 0 0 3px #dc4b4b22}.s-green{background:var(--green);box-shadow:0 0 0 3px #22a05f22}
  .s-amber{background:var(--amber);box-shadow:0 0 0 3px #d98a2b22}.s-blue{background:var(--blue)}
  table.tb{width:100%;border-collapse:collapse;font-size:13px}
  table.tb th{color:var(--muted);font-weight:700;text-align:right;padding:9px 8px;border-bottom:2px solid var(--line2)}
  table.tb th:first-child{text-align:left}
  table.tb td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);font-weight:700;color:var(--navy)}
  table.tb td:first-child{text-align:left}table.tb tr:last-child td{border-bottom:none}
  table.tb tbody tr:hover{background:#f6f9fd}
  .pbar{height:9px;border-radius:6px;background:#e6ecf4;overflow:hidden}.pbar>i{display:block;height:100%;border-radius:6px}
  .barrow{display:grid;grid-template-columns:96px 1fr 74px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .barrow:last-child{border-bottom:none}.barrow .nm{font-weight:700;color:var(--navy)}.barrow .vv{text-align:right;font-weight:800;color:var(--navy)}
  .donut{width:130px;height:130px;position:relative;flex:0 0 auto;border-radius:50%}
  .donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut .mid .t{font-size:11px;color:var(--muted)}.donut .mid .n{font-size:20px;font-weight:800;color:var(--navy)}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;flex:1;color:var(--navy)}.legend .li{display:flex;align-items:center;gap:8px}.legend .sw{width:11px;height:11px;border-radius:3px}.legend .li b{margin-left:auto}
  .lines-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .lbox{border-radius:14px;padding:13px 14px;border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 16px rgba(30,58,95,.16),inset 0 1px 0 rgba(255,255,255,.22)}
  .lbox .lh{display:flex;align-items:center;gap:9px}.lbox .lname{font-size:14.5px;font-weight:800;color:#fff}
  .lbox .cnt{font-size:19px;font-weight:800;color:#fff;margin-top:3px}.lbox .cnt small{font-size:12px;opacity:.9}
  .pill{margin-left:auto;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px;color:#fff;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.4)}
  .ppl{margin-top:9px;display:flex;flex-wrap:wrap;gap:4px}.pi{flex:0 0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
  .pi.on{color:#fff}.pi.leave{color:#ffe08a}.pi.absent{color:#ffb3b3}.pi.edu{color:#bfe4ff}.pi.empty{color:rgba(255,255,255,.42)}
  .l-tube{background:linear-gradient(150deg,#3a9a52,#2b7d43)}.l-fill{background:linear-gradient(150deg,#3577c9,#2a5fa8)}
  .l-once{background:linear-gradient(150deg,#c79a2f,#a67c1e)}.l-cham{background:linear-gradient(150deg,#1aa596,#128678)}
  .l-hnb{background:linear-gradient(150deg,#8f57c0,#6d3ba0)}.l-fnc{background:linear-gradient(150deg,#b09a2f,#8f7a1e)}
  .list .it{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}.list .it:last-child{border-bottom:none}
  .rank{width:27px;height:27px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:#eaf1fb;border:1px solid var(--line2);color:var(--navy);flex:0 0 auto}
  .rank.top{background:#fdecec;border-color:#f5c2c2;color:#dc4b4b}
  .muted{color:var(--muted)}.mut2{color:var(--muted2)}.big{font-size:24px;font-weight:800;color:var(--navy)}.mini{font-size:11.5px;color:var(--muted)}
  .chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;background:#eef2f8;border:1px solid var(--line);color:var(--muted)}
  .reco{display:flex;gap:11px;align-items:flex-start;background:#f5f8fc;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
  .reco .ic{width:33px;height:33px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#eaf1fb;border:1px solid var(--line2);flex:0 0 auto;font-size:16px}
  .reco.warn{background:#fdfaf1;border-color:#ecdec2}.reco.warn .ic{background:#fdeecb;border-color:#f0d090}
  .reco.bad{background:#fdf4f4;border-color:#f0d8d8}.reco.bad .ic{background:#fbdada;border-color:#f0b8b8}
  .reco .tx .r{font-weight:800;font-size:14px;color:var(--navy)}.reco .tx .s{font-size:12px;color:var(--muted);margin-top:2px}
  .report-doc{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:20px 22px;font-size:13.5px;line-height:1.9;color:var(--navy)}
  .report-doc h4{margin:0 0 4px;font-size:16px;color:var(--navy)}.report-doc .kv{color:var(--muted)}.report-doc ul{margin:8px 0;padding-left:18px}.report-doc li{margin:3px 0}
  a.cardlink{text-decoration:none;color:inherit;display:block;transition:.16s;cursor:pointer}
  a.cardlink:hover .card{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 12px 26px rgba(47,111,237,.14)}
  .agentcard .top{display:flex;align-items:center;gap:11px}
  .agentcard .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#eaf1fb;border:1px solid var(--line2)}
  .agentcard .nm{font-weight:800;font-size:15px;color:var(--navy)}.agentcard .ds{font-size:11.5px;color:var(--muted);margin-top:1px}
  .agentcard .metric{margin-top:12px;display:flex;align-items:flex-end;justify-content:space-between}.agentcard .metric .m{font-size:23px;font-weight:800;color:var(--navy)}
  table.edit{width:100%;border-collapse:collapse;font-size:12.5px}
  table.edit th{color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:2px solid var(--line2);text-align:center;white-space:nowrap}
  table.edit th:first-child{text-align:left}
  table.edit td{padding:6px;border-bottom:1px solid var(--line);text-align:center}
  table.edit td:first-child{text-align:left;font-weight:700;color:var(--navy)}
  table.edit input{width:64px;background:#fff;border:1px solid var(--line2);color:var(--navy);border-radius:8px;padding:7px 8px;font-size:12.5px;text-align:right;font-weight:700}
  table.edit input:focus{outline:none;border-color:var(--blue);background:#f2f7ff}
  .drop{border:1.5px dashed var(--line2);border-radius:14px;padding:24px;text-align:center;color:var(--muted);background:#f6f9fd;cursor:pointer;transition:.14s}
  .drop:hover{border-color:var(--blue);color:var(--navy);background:#eef5ff}
  .drop.hi{border-color:var(--green);background:#eafaf1}
  iframe.safe{width:100%;height:calc(100vh - 150px);border:1px solid var(--line);border-radius:14px;background:#fff}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#eafaf1;border:1px solid #b8e6cc;color:#22a05f;padding:12px 20px;border-radius:14px;font-weight:800;font-size:13px;z-index:200;box-shadow:0 12px 30px rgba(30,58,95,.16);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  /* 섹션 헤더 · 에이전트 컴팩트 타일 */
  .sechead{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin:6px 2px 12px;text-transform:uppercase}
  .astat{border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;gap:13px;transition:.14s;height:100%}
  a.cardlink:hover .astat{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 20px rgba(47,111,237,.12)}
  .astat .aico{width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:19px;background:#eef4fb;border:1px solid var(--line2)}
  .astat .amid{flex:1;min-width:0}
  .astat .anm{font-weight:800;font-size:14px;color:var(--navy)}
  .astat .asub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .astat .aright{text-align:right;flex:0 0 auto}
  .astat .am{font-size:18px;font-weight:800;color:var(--navy);line-height:1.1}
  /* 관제 센터 대시보드 */
  .dash{display:grid;grid-template-columns:1.1fr 1fr 1.12fr;gap:16px;align-items:start;margin-bottom:16px}
  .dash .col{gap:16px}
  .astat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .astat .t{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line2);border-radius:10px;background:#f7fafd}
  .astat .t .ei{width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#eef4fb;font-size:14px;border:1px solid var(--line2)}
  .astat .t .nm{font-size:12px;color:var(--muted);font-weight:600}
  .astat .t .vv{margin-left:auto;font-weight:800;font-size:13px}
  .gquad{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .mgauge{display:flex;flex-direction:column;align-items:center}
  .mgauge .mv{font-size:18px;font-weight:800;color:var(--navy);margin-top:-16px}
  .mgauge .ml{font-size:11px;color:var(--muted);margin-top:4px}
  .alist .ai{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line)}
  .alist .ai:last-child{border-bottom:none}
  .alist .aic{width:31px;height:31px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;background:#eef4fb;border:1px solid var(--line2)}
  .alist .at{flex:1;min-width:0}.alist .at .r{font-weight:700;font-size:13px;color:var(--navy)}.alist .at .s{font-size:11.5px;color:var(--muted);margin-top:2px}
  .alist .atime{font-size:11px;color:var(--muted2);white-space:nowrap;flex:0 0 auto}
  .statrow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .statrow .st .v{font-size:19px;font-weight:800;color:var(--navy)}.statrow .st .l{font-size:11.5px;color:var(--muted);margin-top:3px}
  .mtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  @media(max-width:1200px){.dash{grid-template-columns:1fr 1fr}}
  @media(max-width:820px){.dash{grid-template-columns:1fr}.gquad{grid-template-columns:1fr 1fr}.statrow{grid-template-columns:1fr 1fr}}
  @media (max-width:1080px){
    .app.show{grid-template-columns:1fr}
    .nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.nav .logo,.nav .spacer,.nav .user,.nav .sec{display:none}.nav a{flex:0 0 auto}
    .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.lines-grid{grid-template-columns:1fr}
  }
  /* ===== 히어로 배너 · 시각화 ===== */
  .hero{border-radius:18px;padding:22px 26px;margin-bottom:16px;color:#eaf1fb;position:relative;overflow:hidden;
    background:linear-gradient(120deg,#1e3a5c 0,#22506f 55%,#1b4a62 100%);
    box-shadow:0 12px 34px rgba(30,58,95,.24);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .hero::before{content:"";position:absolute;right:-40px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(89,211,160,.20),transparent 70%);pointer-events:none}
  .hero::after{content:"";position:absolute;left:34%;bottom:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(47,111,237,.18),transparent 70%);pointer-events:none}
  .hero .hbrand{font-size:11.5px;letter-spacing:2.5px;color:#8fd8b9;font-weight:800;text-transform:uppercase}
  .hero .htitle{font-size:27px;font-weight:800;margin-top:5px}
  .hero .hsub{font-size:12.5px;color:#b9cbe0;margin-top:6px}
  .hero .hstats{margin-left:auto;display:flex;gap:0;flex-wrap:wrap;position:relative;z-index:1}
  .hero .hstat{text-align:center;min-width:72px;padding:2px 22px}
  .hero .hstat+.hstat{border-left:1px solid rgba(255,255,255,.16)}
  .hero .hstat .hn{font-size:24px;font-weight:800;line-height:1}
  .hero .hstat .hl{font-size:11px;color:#a8c0da;margin-top:7px;letter-spacing:.3px}
  .kpi .spark{margin-top:9px;opacity:.95}
  .viz{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.2fr;gap:15px;margin-bottom:16px}
  .gaugewrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:4px}
  .gaugewrap .gv{font-size:30px;font-weight:800;margin-top:-10px}
  .gaugewrap .gl{font-size:11.5px;color:var(--muted);margin-top:3px}
  @media (max-width:1080px){.viz{grid-template-columns:1fr 1fr}.hero .hstats{margin-left:0;width:100%}}
</style>

</head>
<body>

<!-- ===== LOGIN ===== -->
<div class="login" id="login">
  <div class="box">
    <div class="brand"><span>ZEN</span> Manufacturing</div>
    <div class="sub">AP 대전공장 · 제조현장 통합 관리 플랫폼</div>
    <label>역할 선택</label>
    <div class="roles" id="roles">
      <button data-role="field"><span class="e">🧑‍🏭</span>현장</button>
      <button data-role="admin"><span class="e">👔</span>관리자</button>
      <button data-role="center" class="on"><span class="e">🛰️</span>센터</button>
    </div>
    <label id="scopeLbl">담당 구역</label>
    <select id="scopeSel" style="width:100%;border:1px solid var(--line2);background:#0b1a2e;color:var(--ink);border-radius:11px;padding:12px 13px;font-size:14px"></select>
    <label>사번 / 비밀번호</label>
    <input id="pw" type="password" placeholder="데모: 아무 값이나 입력 후 로그인" value="1234">
    <button class="go" onclick="doLogin()">로그인</button>
    <div class="note">데모 로그인 — 인증은 클라이언트에서만 처리됩니다(실인증 아님)</div>
  </div>
</div>

<!-- ===== APP ===== -->
<div class="app" id="app">
  <aside class="nav" id="nav"></aside>
  <main class="stage">
    <div class="bar">
      <div>
        <h1 id="vTitle">통합 관제</h1>
        <div class="sub" id="vSub">AP 대전공장 · 8 Agent 통합 대시보드</div>
      </div>
      <div class="right">
        <button class="btn" id="bigBtn" onclick="toggleBig()" title="벽 모니터·전광판용 큰 화면">🖥 큰화면</button>
        <span class="src" id="srcTag">데이터: 데모</span>
        <div class="clock">
          <div class="d">2025.05.10 (금) 09:30</div>
          <div class="r"><span class="dot"></span> 자동 갱신 중</div>
        </div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

/* ============ COMPUTED ============ */
const G={
  cur:l=>l.on+l.leave+l.edu,
  achieve:l=>Math.round(l.actual/l.target*100),
  load:l=>Math.round(l.target/l.capa*100),
  oeeQ:l=>+(100-l.defect).toFixed(1),
  oee:l=>+((l.oeeA/100)*(l.oeeP/100)*((100-l.defect)/100)*100).toFixed(1),
  // 세척 우선순위: 색상/제품전환 40% + 주기경과 35%(기준 8h) + 생산부하 25%
  cleanScore:l=>{const cyc=Math.min(1,l.clElapsed/8);const load=Math.min(1,l.actual/l.capa);
    return Math.round((0.40*l.clTransfer+0.35*cyc+0.25*load)*100);},
  // 재고: 소진일수·재주문점·발주량(MOQ 반영)
  stock:s=>{const days=+(s.onhand/s.dailyUse).toFixed(1);const rop=+(s.lead*s.dailyUse*1.3).toFixed(0);
    const need=s.onhand<=rop;const qty=Math.max(s.moq,Math.ceil(s.targetDays*s.dailyUse-s.onhand));
    return {days,rop,need,qty};},
};
function totProd(){const L=myLines();const t=L.reduce((a,l)=>a+l.target,0),a=L.reduce((x,l)=>x+l.actual,0);return{t,a,ach:t?Math.round(a/t*100):0};}
function shortSum(){return myLines().reduce((a,l)=>a+Math.max(0,l.need-G.cur(l)),0);}
function avgOEE(){const L=myLines();return +(L.reduce((a,l)=>a+G.oee(l),0)/L.length).toFixed(1);}
function avgDefect(){const L=myLines();return +(L.reduce((a,l)=>a+l.defect,0)/L.length).toFixed(1);}
function headNeed(){return scoped()?myLines().reduce((a,l)=>a+l.need,0):DB.headcount.need;}
function headCur(){return scoped()?myLines().reduce((a,l)=>a+G.cur(l),0):DB.headcount.cur;}

const GROUP_RULES=[
  [/^튜브/,'튜브 라인'],[/^치약충전|^치약수/,'치약충전 라인'],[/^세정자동화/,'세정자동화 라인'],
  [/^직선/,'직선 라인'],[/^멀티셀|^멀티/,'멀티셀 라인'],[/염모|산화/,'염모·산화 라인'],
  [/세럼충전|^세럼/,'세럼충전 라인'],[/턴테이블/,'턴테이블 라인'],[/^팜플/,'팜플 라인'],[/^리필/,'리필 라인'],[/^로션|^크림/,'로션·크림 라인'],

function lineGroupOf(name){for(const[re,g]of GROUP_RULES)if(re.test(name))return g;return '기타 라인';}

function planHasActual(){return !!(DB.plan&&DB.plan.hasActual);}
function eachOrder(cb){if(!DB.plan)return;DB.plan.weeks.forEach((w,wi)=>w.resources.forEach(r=>r.orders.forEach(o=>cb(o,r,w,wi))));}
function groupActual(wk){const m={};wk.resources.forEach(r=>{const gn=lineGroupOf(r.name);r.orders.forEach(o=>{if(o.actual!=null)m[gn]=(m[gn]||0)+o.actual;});});return m;}
function delayedOrders(wk){return wk.resources.flatMap(r=>r.orders.filter(o=>o.actual!=null&&o.actual<o.qty).map(o=>({...o,res:r.name,group:lineGroupOf(r.name),short:o.qty-o.actual,ach:Math.round(o.actual/o.qty*100)}))).sort((a,b)=>b.short-a.short);}
function simulateActual(){
  if(!DB.plan)return toast('먼저 생산계획을 업로드하세요');
  const hash=o=>{let h=0;const s=String(o.orderNo);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;};
  eachOrder(o=>{const hh=hash(o)%100;
    const rate=hh<10?0.40+(hh/10)*0.30:hh<25?0.70+((hh-10)/15)*0.20:0.92+((hh-25)/75)*0.13;
    o.actual=Math.round(o.qty*rate);});

const ACT_ORDER_KEYS=['오더번호','오더','오더no','orderno','order'];
const ACT_QTY_KEYS=['실적','실적수량','생산수량','양품수량','완료수량','생산실적'];
function importActual(file){
  if(!DB.plan)return toast('먼저 생산계획을 업로드하세요');
  const name=file.name.toLowerCase();const rd=new FileReader();
  rd.onload=e=>{try{
    let rows;
    if(name.endsWith('.csv'))rows=csvToRows(e.target.result);
    else{const wb=XLSX.read(e.target.result,{type:'binary'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});}
    const idx={};eachOrder(o=>{idx[String(o.orderNo)]=o;});
    let n=0;rows.forEach(r=>{let on,q;Object.keys(r).forEach(h=>{const hn=String(h).trim().toLowerCase();if(ACT_ORDER_KEYS.includes(hn))on=String(r[h]).trim();if(ACT_QTY_KEYS.includes(String(h).trim()))q=+r[h];});
      if(on&&idx[on]&&!isNaN(q)){idx[on].actual=q;n++;}});
    if(n>0){DB.plan.hasActual=true;if(!/실적/.test(dataSource))dataSource+=' + 실적';saveDB();toast(n+'건 오더 실적 반영');rerender();go('delay');}
    else toast('매칭되는 오더번호가 없습니다 (오더번호/실적수량 헤더 확인)');
  }catch(err){toast('실적 파싱 실패: '+err.message);}};
  if(name.endsWith('.csv'))rd.readAsText(file);else rd.readAsBinaryString(file);
}
function buildGroups(resources){
  const gm={};
  resources.forEach(r=>{const g=lineGroupOf(r.name);if(!gm[g])gm[g]={name:g,resCount:0,orderCount:0,weekTotal:0,daily:{},resources:[]};
    const G=gm[g];G.resCount++;G.orderCount+=r.orders.length;G.weekTotal+=r.weekTotal;G.resources.push(r.name);
    Object.entries(r.daily).forEach(([d,q])=>G.daily[d]=(G.daily[d]||0)+q);});
  return Object.values(gm).sort((a,b)=>b.weekTotal-a.weekTotal);
}
function parsePlan(wb){
  const weeks=wb.SheetNames.map(sn=>{
    const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
    const hdr=a[0]||[];const dateCols=[];
    for(let i=3;i<hdr.length;i++){const v=String(hdr[i]).trim();if(/^\d{4}\.\d{2}\.\d{2}$/.test(v))dateCols.push({i,date:v});}
    const rm={};
    for(let r=1;r<a.length;r++){const row=a[r];const rname=String(row[2]||'').trim();
      if(!rname||rname.endsWith('합계'))continue;
      if(!rm[rname])rm[rname]={code:String(row[1]||'').trim(),name:rname,daily:{},orders:[],weekTotal:0};
      const res=rm[rname];
      if(String(row[3]||'').includes('오더')){
        dateCols.forEach(dc=>{const qty=+row[dc.i+2];const on=row[dc.i+1];
          if(qty&&!isNaN(qty)){const prod=a[r+1]?String(a[r+1][dc.i+1]||'').trim():'';
            res.orders.push({date:dc.date,orderNo:String(on),qty,product:prod});
            res.daily[dc.date]=(res.daily[dc.date]||0)+qty;res.weekTotal+=qty;}});
      }}
    const resources=Object.values(rm).filter(r=>r.weekTotal>0).sort((x,y)=>y.weekTotal-x.weekTotal);
    return {name:sn,dates:dateCols.map(d=>d.date),resources,groups:buildGroups(resources)};
  }).filter(w=>w.resources.length);
  return {weeks};
}

function isWhWB(wb){try{const a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});return /적치|포장재창고|적재\s*CAPA/.test(a.slice(0,5).map(r=>r.join('')).join(''));}catch(e){return false;}}
function parseWarehouse(wb){
  const weeks=wb.SheetNames.map(sn=>{
    const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
    const zones=[];let total=null,cg='';
    for(let r=5;r<a.length;r++){const row=a[r];const g=String(row[0]||'').trim();const area=String(row[1]||'').replace(/[\r\n]+/g,' ').trim();
      if(g==='계'){total={capa:+row[2],max:+row[3],count:+row[4]};break;}

function resetDB(){DB=JSON.parse(JSON.stringify(DEFAULT_DB));dataSource='데모';planWeek=0;try{localStorage.removeItem(LS_KEY);}catch(e){}toast('데모값으로 복원했습니다 (저장 데이터 삭제)');rerender();}
const IMPORT_MAP={'라인':'key','필요':'need','출근':'on','연차':'leave','교육':'edu','목표':'target','실적':'actual','capa':'capa','CAPA':'capa','불량%':'defect','불량':'defect','세척경과h':'clElapsed','세척경과':'clElapsed','전환0~1':'clTransfer','전환':'clTransfer'};
function applyRows(rows){
  // rows: array of objects keyed by header
  let n=0;
  rows.forEach(r=>{
    const keyName=r['라인']||r['key']||r['구역'];if(!keyName)return;
    const line=DB.lines.find(l=>l.key===String(keyName).trim());if(!line)return;
    Object.keys(r).forEach(h=>{const f=IMPORT_MAP[String(h).trim()];if(f&&f!=='key'){const val=+r[h];if(!isNaN(val))line[f]=val;}});
    n++;
  });
  return n;
}
function importFile(file){
  if(!file)return;const name=file.name.toLowerCase();const rd=new FileReader();
  rd.onload=e=>{
    try{
      if(name.endsWith('.csv')){
        const n=applyRows(csvToRows(e.target.result));
        if(n>0){dataSource=file.name;saveDB();toast(n+'개 라인 데이터를 반영했습니다');rerender();}
        else toast('매칭되는 라인이 없습니다 (헤더/라인명 확인)');
        return;
      }
      const wb=XLSX.read(e.target.result,{type:'binary'});
      if(isWhWB(wb)){
        DB.wh=parseWarehouse(wb);whWeek=0;dataSource=file.name;saveDB();
        const w=DB.wh.weeks[0];
        toast('창고 적치 점검 인식: '+DB.wh.weeks.length+'주 · '+w.zones.length+'구역 · 전체 적치율 '+whTotRate(w)+'%');
        rerender();go('stock');return;
      }
      if(isPlanWB(wb)){
        DB.plan=parsePlan(wb);planWeek=0;dataSource=file.name;saveDB();
        const w=DB.plan.weeks[0];
        toast('주간 생산계획 인식: '+DB.plan.weeks.length+'주 · '+w.resources.length+'개 리소스 · 총 '+w.resources.reduce((a,r)=>a+r.weekTotal,0).toLocaleString()+'개');
        rerender();go('plan');return;
      }
      const n=applyRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}));
      if(n>0){dataSource=file.name;saveDB();toast(n+'개 라인 데이터를 반영했습니다');rerender();}
      else toast('인식 가능한 데이터가 없습니다. 템플릿 형식 또는 주간계획 형식을 확인하세요.');
    }catch(err){toast('파일 파싱 실패: '+err.message);}
  };
  if(name.endsWith('.csv'))rd.readAsText(file);else rd.readAsBinaryString(file);
}
function csvToRows(text){
  const lines=text.split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];
  const head=splitCSV(lines[0]);
  return lines.slice(1).map(ln=>{const c=splitCSV(ln);const o={};head.forEach((h,i)=>o[h.trim()]=c[i]);return o;});
}
function splitCSV(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){q=!q;}else if(ch===','&&!q){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out;}
function dbToAOA(){
  const head=['라인',...EDIT_COLS.map(c=>c.t)];
  const rows=DB.lines.map(l=>[l.key,...EDIT_COLS.map(c=>l[c.k])]);
  return [head,...rows];
}
function exportXLSX(){const ws=XLSX.utils.aoa_to_sheet(dbToAOA());const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'라인데이터');XLSX.writeFile(wb,'ZEN_라인데이터_템플릿.xlsx');toast('엑셀 템플릿을 내려받았습니다');}
function exportCSV(){const aoa=dbToAOA();const csv=aoa.map(r=>r.join(',')).join('\n');dl('ZEN_라인데이터.csv','﻿'+csv,'text/csv');toast('CSV를 내려받았습니다');}

    ${items.map(a=>`<a data-id="${a.id}" class="${a.id===cur?'on':''}" onclick="go('${a.id}')"><span class="ic">${a.icon}</span><span>${a.name}</span>${badges[a.id]?`<span class="badge ${badges[a.id].c}">${badges[a.id].t}</span>`:''}</a>`).join('')}
    <div class="sec">시스템</div>
    ${extra.map(a=>{let bd='';if(a.id==='plan'&&DB.plan)bd=`<span class="badge t-blue">${DB.plan.weeks.length}주</span>`;if(a.id==='delay'&&planHasActual()){const d=delayedOrders(DB.plan.weeks[planWeek]||DB.plan.weeks[0]).length;if(d)bd=`<span class="badge t-red">${d}</span>`;}return `<a data-id="${a.id}" class="${a.id===cur?'on':''}" onclick="go('${a.id}')"><span class="ic">${a.icon}</span><span>${a.name}</span>${bd}</a>`;}).join('')}
    <div class="spacer"></div>
    <div class="user"><div class="av">${R.emoji}</div><div><div class="nm">홍길동 ${R.name}</div><div class="rl">${R.name} · ${scopeLabel()}</div></div><div class="out" onclick="logout()" title="로그아웃">⎋</div></div>`;
}
function go(id){
  if(!ROLES[role].allow.includes(id)&&!['data','safeapp'].includes(id))id='home';
  if(id==='data'&&!ROLES[role].allow.includes('data'))id='home';
  cur=id;
  const meta=AGENTS.find(a=>a.id===id)||{name:{data:'데이터 관리',safeapp:'안전 관리 (ZENF)',plan:'생산계획 (주간)',delay:'지연오더',opl:'OPL 생성기'}[id],sub:{data:'엑셀/CSV 업로드 · 직접 편집으로 대시보드 구동',safeapp:'기존 안전 앱 통합 화면',plan:'주간 생산계획 엑셀 실데이터 · 리소스·오더·수량',delay:'계획 대비 실적 · 지연/미달 오더 분석',opl:'점검·이슈 내용 → 원포인트레슨(적발→준수기준+서명부) 자동 생성'}[id]};
  document.getElementById('vTitle').textContent=meta.name;
  document.getElementById('vSub').textContent=meta.sub;
  let html=(V[id]||(()=>'<div class="card">준비 중</div>'))();
  if(['clean','safe','stock'].includes(id))html+=renderSysLinks(id);
  document.getElementById('view').innerHTML=html;
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  if(id==='data')setTimeout(setupDrop,0);
  window.scrollTo({top:0});
}
function setupDrop(){const d=document.getElementById('drop');if(!d)return;
  ['dragover','dragenter'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('hi');}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('hi');}));
  d.addEventListener('drop',e=>{if(e.dataTransfer.files[0])importFile(e.dataTransfer.files[0]);});
}
// login — 역할별 스코프 옵션
function fillScope(r){
  const sel=document.getElementById('scopeSel'),lbl=document.getElementById('scopeLbl');
  let opts=[];
  if(r==='field'){lbl.textContent='담당 라인 (현장)';opts=DEFAULT_DB.lines.map(l=>({v:l.key,t:l.key+' 라인'}));}
  else if(r==='admin'){lbl.textContent='담당 구역 (관리자)';opts=[{v:'전체',t:'전체 라인'}].concat(Object.keys(ZONES).map(z=>({v:z,t:z+' ('+ZONES[z].join('·')+')'})));}
  else{lbl.textContent='관제 범위 (센터)';opts=[{v:'전체',t:'전체 라인 (통합 관제 · 전권)'}];}
  sel.innerHTML=opts.map(o=>`<option value="${o.v}">${o.t}</option>`).join('');
  sel.disabled=(r==='center');
}
document.querySelectorAll('#roles button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#roles button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fillScope(b.dataset.role);});
function doLogin(){
  role=document.querySelector('#roles button.on').dataset.role;
  const v=document.getElementById('scopeSel').value;
  if(role==='field'){scope=[v];scopeName=v+' 라인';}
  else if(role==='admin'){if(v==='전체'){scope=null;scopeName='전체';}else{scope=ZONES[v]||null;scopeName=v;}}
  else{scope=null;scopeName='전체';}
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('show');
  cur=(DB.plan&&ROLES[role].allow.includes('plan'))?'plan':'home';
  buildNav();go(cur);applyBig();
  document.getElementById('srcTag').textContent='데이터: '+dataSource;
  document.getElementById('srcTag').classList.toggle('live',dataSource!=='데모');
}
let bigMode=false;
function applyBig(){const st=document.querySelector('.stage');if(st)st.style.zoom=bigMode?'1.18':'';const bb=document.getElementById('bigBtn');if(bb)bb.classList.toggle('p',bigMode);}
function toggleBig(){bigMode=!bigMode;applyBig();try{localStorage.setItem('zen_big',bigMode?'1':'0');}catch(e){}}
try{bigMode=localStorage.getItem('zen_big')==='1';}catch(e){}
function logout(){document.getElementById('app').classList.remove('show');document.getElementById('login').style.display='flex';}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
// startup: restore saved data + default scope UI
loadDB();
fillScope('center');
</script>
