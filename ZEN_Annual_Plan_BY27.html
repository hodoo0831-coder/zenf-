<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEN Annual Plan · BY27 연간 운영계획</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1626" media="(prefers-color-scheme: dark)">
<script>

       if(_t==='light'||_t==='dark') document.documentElement.setAttribute('data-theme',_t); }catch(e){}
</script>
<style>
  /* ── 라이트(기본) 팔레트 ─────────────────────────── */
  :root{
    --bg:#eef2f8; --bg-g1:#dce6f7; --bg-g2:#e4ecf9;
    --panel:#ffffff; --panel2:#eef3fa; --panel3:#e3ebf7;
    --line:#d6e0ee; --line2:#bfcde2;
    --ink:#10203a; --muted:#53688a; --muted2:#7488a6;
    --blue:#2563eb; --blue-d:#1d4ed8; --blue-ink:#ffffff;
    --green:#15803d; --red:#dc2626; --amber:#b45309; --purple:#7e22ce; --teal:#0f766e;
    --p1:#2563eb; --p2:#15803d; --p3:#dc2626; --p4:#b45309; --p5:#7e22ce;
    --pill-ink:#ffffff;
    --in-bg:#ffffff; --in-k-bg:#f0f8f2; --in-k-line:#a9d5b8;
    --ok-bg:#dcfce7; --ok-ink:#14532d; --bad-bg:#fee2e2; --bad-ink:#991b1b;
    --zebra:#f7fafd; --hover:#0000000a; --tab-on:#e0eaff;
    --shadow:0 2px 10px rgba(20,40,80,.07), 0 8px 24px rgba(20,40,80,.05);
    --radius:14px;
  }
  /* ── 다크 팔레트 (시스템 설정 · data-theme=light 로 덮어쓸 수 있음) ── */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a1626; --bg-g1:#14284480; --bg-g2:#12203a80;
      --panel:#111f34; --panel2:#0f1b2e; --panel3:#16273f;
      --line:#1c3350; --line2:#24405f;
      --ink:#e8f0fb; --muted:#8aa0bd; --muted2:#6d84a3;
      --blue:#3b82f6; --blue-d:#1d4ed8; --blue-ink:#ffffff;
      --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --purple:#a855f7; --teal:#14b8a6;
      --p1:#3b82f6; --p2:#22c55e; --p3:#ef4444; --p4:#f59e0b; --p5:#a855f7;
      --pill-ink:#0a1626;
      --in-bg:#0f1b2e; --in-k-bg:#16281c; --in-k-line:#2c5a38;
      --ok-bg:#14532d; --ok-ink:#bbf7d0; --bad-bg:#7f1d1d; --bad-ink:#fecaca;
      --zebra:#0d1a2c; --hover:#ffffff08; --tab-on:#16283f;
      --shadow:0 8px 28px rgba(0,0,0,.45);
    }
  }
  /* ── 다크 강제 ─────────────────────────────────── */
  :root[data-theme="dark"]{
    --bg:#0a1626; --bg-g1:#14284480; --bg-g2:#12203a80;
    --panel:#111f34; --panel2:#0f1b2e; --panel3:#16273f;
    --line:#1c3350; --line2:#24405f;
    --ink:#e8f0fb; --muted:#8aa0bd; --muted2:#6d84a3;
    --blue:#3b82f6; --blue-d:#1d4ed8; --blue-ink:#ffffff;
    --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --purple:#a855f7; --teal:#14b8a6;
    --p1:#3b82f6; --p2:#22c55e; --p3:#ef4444; --p4:#f59e0b; --p5:#a855f7;
    --pill-ink:#0a1626;
    --in-bg:#0f1b2e; --in-k-bg:#16281c; --in-k-line:#2c5a38;
    --ok-bg:#14532d; --ok-ink:#bbf7d0; --bad-bg:#7f1d1d; --bad-ink:#fecaca;
    --zebra:#0d1a2c; --hover:#ffffff08; --tab-on:#16283f;
    --shadow:0 8px 28px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 700px at 78% -10%, var(--bg-g1) 0%, transparent 60%),
      radial-gradient(1000px 600px at 8% 110%, var(--bg-g2) 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    transition:background-color .18s ease, color .18s ease;
  }
  .wrap{max-width:1560px;margin:0 auto;padding:18px 20px 44px}
  a{color:var(--blue)}

  /* ── 헤더 ─────────────────────────────────────── */
  header.top{display:flex;align-items:flex-start;gap:16px;padding:6px 2px 14px;flex-wrap:wrap}
  .brand .logo{font-size:23px;font-weight:800;letter-spacing:.2px}
  .brand .logo b{color:var(--ink)}
  .brand .logo span{color:var(--blue)}
  .brand .sub{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.5}
  .top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--panel);border:1px solid var(--line2);color:var(--ink);
    padding:8px 13px;border-radius:10px;font-size:12.5px;cursor:pointer;font-weight:600;
    font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--panel3);border-color:var(--blue)}
  .btn.pri{background:var(--blue-d);border-color:var(--blue);color:#fff}
  .btn .ic{font-size:14px;line-height:1}
  .saveinfo{font-size:11.5px;color:var(--muted2);white-space:nowrap}

  /* ── 탭 ───────────────────────────────────────── */
  nav.tabs{display:flex;gap:4px;margin:6px 0 18px;border-bottom:1px solid var(--line);
    overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  nav.tabs::-webkit-scrollbar{height:4px}
  nav.tabs::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;
    color:var(--muted);padding:11px 15px;font-size:13.5px;font-weight:700;cursor:pointer;
    font-family:inherit;border-radius:8px 8px 0 0;white-space:nowrap;flex:0 0 auto}
  nav.tabs button:hover{color:var(--ink);background:var(--hover)}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--blue);background:var(--tab-on)}
  section.page{display:none} section.page.on{display:block}

  /* ── 그리드 ───────────────────────────────────── */
  .grid{display:grid;gap:14px;align-items:start}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:1240px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:900px){.g2{grid-template-columns:1fr}}
  @media(max-width:820px){.g3{grid-template-columns:1fr}}
  @media(max-width:620px){.g4{grid-template-columns:1fr}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 4px;font-size:14px;letter-spacing:.2px}
  .card .cap{color:var(--muted);font-size:11.5px;line-height:1.55}
  .stat .num{font-size:34px;font-weight:800;line-height:1.1;word-break:keep-all}
  .stat .lbl{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5}

  .sec-title{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--muted2);
    margin:26px 2px 10px;text-transform:uppercase}
  .sec-title:first-child{margin-top:6px}

  /* ── 표 ───────────────────────────────────────── */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{background:var(--panel2);color:var(--ink);font-weight:700;text-align:left;padding:9px 10px;
    border:1px solid var(--line);position:sticky;top:0;z-index:2;font-size:11.5px}
  td{padding:8px 10px;border:1px solid var(--line);vertical-align:middle;background:var(--panel)}
  tbody tr:nth-child(even) td{background:var(--zebra)}
  .tbl-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);background:var(--panel)}
  .num-c{text-align:right;font-variant-numeric:tabular-nums}
  .ctr{text-align:center}

  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:800;
    color:var(--pill-ink)}
  .chip{display:inline-block;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;
    border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
  .diff-Low{color:var(--green)} .diff-Mid{color:var(--amber)} .diff-High{color:var(--red)}
  .lv-高{color:var(--red);font-weight:800} .lv-中{color:var(--amber);font-weight:800}
  .lv-低{color:var(--green);font-weight:800}

  input[type=number],input[type=text],select,textarea{
    background:var(--in-bg);border:1px solid var(--line2);color:var(--ink);border-radius:8px;
    padding:6px 8px;font-size:12.5px;font-family:inherit;width:100%;min-width:0}
  input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
  input.k{background:var(--in-k-bg);border-color:var(--in-k-line)}
  label.fld{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600;line-height:1.5}
  .fld-row{margin-bottom:12px}

  .gantt{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;min-width:150px}
  .gantt i{height:16px;border-radius:3px;background:var(--panel3);display:block}
  .bar{height:8px;background:var(--panel3);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar>span{display:block;height:100%;background:var(--blue);border-radius:99px}

  .mon{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    box-shadow:var(--shadow)}
  .mon.now{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset, var(--shadow)}
  .mon .mh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel2);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .mon .mh b{font-size:15px} .mon .mh .q{font-size:10.5px;color:var(--muted2);font-weight:700}
  .mon .mh .fx{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--pill-ink);
    background:var(--amber);padding:2px 8px;border-radius:999px}
  .mon .row{display:flex;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:11.5px}
  .mon .row:last-child{border-bottom:0}
  .mon .row i{width:3px;border-radius:2px;flex:0 0 3px}
  .mon .row span{color:var(--ink);line-height:1.45}

  .kpi-in{width:100%;min-width:50px}
  .ach-ok{color:var(--green);font-weight:800}
  .ach-mid{color:var(--amber);font-weight:800}
  .ach-bad{color:var(--red);font-weight:800}

  .note{font-size:11.5px;color:var(--muted2);line-height:1.65;margin-top:10px}
  .warn{border-left:3px solid var(--red);padding-left:12px}
  .ok{border-left:3px solid var(--green);padding-left:12px}
  .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;word-break:keep-all}
  .flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .sp{margin-left:auto}
  .scroll-hint{display:none;font-size:11px;color:var(--muted2);margin:0 0 6px 2px}

  /* ── 좁은 화면: 레코드형 표를 카드로 접는다 ─────────── */
  @media(max-width:860px){
    .wrap{padding:14px 12px 40px}
    .brand .logo{font-size:20px}
    .stat .num{font-size:28px}
    .big{font-size:22px}
    nav.tabs button{padding:10px 12px;font-size:12.5px}

    table.stack{font-size:12.5px}
    table.stack thead{display:none}
    table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
    table.stack tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;
      overflow:hidden;background:var(--panel)}
    table.stack tbody tr:nth-child(even) td{background:var(--panel)}
    table.stack td{border:0;border-bottom:1px solid var(--line);padding:9px 12px;
      display:flex;gap:10px;align-items:flex-start;text-align:left!important}
    table.stack td:last-child{border-bottom:0}
    table.stack td:empty{display:none}
    table.stack td::before{content:attr(data-l);flex:0 0 78px;color:var(--muted);
      font-size:11px;font-weight:700;padding-top:2px;line-height:1.5}
    table.stack td>*{flex:1 1 auto;min-width:0}
    table.stack td.hd{background:var(--panel2);font-size:13px}
    table.stack td.hd::before{display:none}
    .tbl-wrap.stacked{border:0;background:transparent;box-shadow:none;overflow:visible}

    /* 매트릭스형(KPI) 표는 가로 스크롤 + 첫 두 열 고정 */
    .tbl-wrap.sticky2 table{min-width:1180px}
    .tbl-wrap.sticky2 th:nth-child(1),.tbl-wrap.sticky2 td:nth-child(1){position:sticky;left:0;z-index:3}
    .tbl-wrap.sticky2 th:nth-child(3),.tbl-wrap.sticky2 td:nth-child(3){position:sticky;left:44px;z-index:3;
      box-shadow:1px 0 0 var(--line2)}
    .tbl-wrap.sticky2 th:nth-child(2),.tbl-wrap.sticky2 td:nth-child(2){display:none}
    .tbl-wrap.sticky2 thead th{z-index:4}
    .scroll-hint{display:block}
  }
  .nw{display:none}
  @media(max-width:860px){ .nw{display:inline} table.stack td.wo{display:none!important} }

  @media(max-width:520px){
    .top-right{width:100%;margin-left:0}
    .top-right .btn{flex:1 1 auto;justify-content:center}
    .saveinfo{width:100%;order:99;text-align:right}
    table.stack td::before{flex-basis:66px;font-size:10.5px}
  }

  /* ── 인쇄: 항상 라이트, 전 탭 펼침 ─────────────────── */
  @media print{
    :root,:root[data-theme="dark"]{
      --bg:#fff; --bg-g1:transparent; --bg-g2:transparent;
      --panel:#fff; --panel2:#f2f5fa; --panel3:#e8eef7;
      --line:#c9d4e3; --line2:#b3c1d6; --ink:#101c30; --muted:#4a5c76; --muted2:#6b7d96;
      --p1:#1d4ed8; --p2:#15803d; --p3:#b91c1c; --p4:#b45309; --p5:#6b21a8;
      --pill-ink:#fff; --shadow:none; --zebra:#f5f8fc; --tab-on:#e8eef7; --in-bg:#fff; --in-k-bg:#fff;
    }
    body{background:#fff}
    nav.tabs,.top-right{display:none}
    section.page{display:block!important;break-inside:auto}
    .card,.mon,.tbl-wrap{box-shadow:none}
    .sec-title{break-after:avoid}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="brand">
    <div class="logo"><b>ZEN</b> <span>Annual Plan</span></div>
    <div class="sub" id="subline"></div>
  </div>
  <div class="top-right">
    <span class="saveinfo" id="saveinfo">—</span>
    <button class="btn" id="themeBtn" onclick="cycleTheme()" title="테마 전환 (시스템 → 라이트 → 다크)"></button>

    <input type="file" id="imp" accept="application/json" style="display:none" onchange="doImport(this)">

<section class="page" id="p-sim"></section>
<section class="page" id="p-risk"></section>
<section class="page" id="p-routine"></section>

</div>

const THEMES = [['system','◐','시스템'],['light','☀','라이트'],['dark','☾','다크']];
let theme = 'system';
function applyTheme(t){
  theme = t;
  const root = document.documentElement;
  if(t==='system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', t);
  const cur = THEMES.find(x=>x[0]===t) || THEMES[0];
  const btn = document.getElementById('themeBtn');
  if(btn){ btn.innerHTML = `<span class="ic">${cur[1]}</span>${cur[2]}`; }
  try{ localStorage.setItem(TKEY, t); }catch(e){}
}
function cycleTheme(){
  const i = THEMES.findIndex(x=>x[0]===theme);
  applyTheme(THEMES[(i+1)%THEMES.length][0]);
}
(function initTheme(){
  let t='system';
  try{ const v=localStorage.getItem(TKEY); if(v==='light'||v==='dark'||v==='system') t=v; }catch(e){}
  applyTheme(t);
})();

/* ── 파생 계산 ───────────────────────────────────── */
function calc(){
  const mh = B('월 기준공수(1인)'), months = B('연 가동월수');
  const lossR = B('BY26 LOSS율'), ownR = B('BY26 원청귀책 LOSS 비중');
  const tgtE = B('BY27 목표효율'), actE = B('BY26 실효율');
  const cut  = B('도급귀책 LOSS 저감 목표율');
  const rows = D.contracts.map((c,i)=>{
    const hc = Number(S.heads['h'+i])||0, rate = Number(S.rates['c'+i])||0;
    const total = hc*mh, lossH = total*lossR, ownH = lossH*ownR, subH = lossH-ownH;
    const subCost = subH*rate;
    const gapP = tgtE-actE, gapH = total*gapP, gapCost = gapH*rate;
    return {cust:c.cust, type:c.type, hc, rate, total, lossH, ownH, subH,
            subCost, monthly:total*rate, gapP, gapH, gapCost,
            saveM:subCost*cut, saveY:subCost*cut*months,
            subY:subCost*months, gapY:gapCost*months};
  });
  const sum = k => rows.reduce((a,r)=>a+r[k],0);
  return {rows, months, cut, mh,
    tot:{hc:sum('hc'), total:sum('total'), lossH:sum('lossH'), ownH:sum('ownH'),
         subH:sum('subH'), subCost:sum('subCost'), subY:sum('subY'),
         saveY:sum('saveY'), gapH:sum('gapH'), gapCost:sum('gapCost'), gapY:sum('gapY'),
         monthly:sum('monthly')}};
}
function kpiTarget(k){
  const base = k.basisLabel ? B(k.basisLabel) : (k.id==='K02' ? calc().tot.subH : null);
  if(k.kind==='ratio'||k.kind==='calc') return base===null?null:base*k.coef;
  if(k.kind==='add')  return base===null?null:base+k.coef;
  return k.coef;
}
function kpiBase(k){
  if(k.basisLabel) return B(k.basisLabel);
  if(k.id==='K02') return calc().tot.subH;
  return null;
}
function kpiAvg(k){
  const v = (S.kpiAct[k.id]||[]).filter(x=>x!==''&&x!==null&&x!==undefined&&isFinite(Number(x))).map(Number);
  if(!v.length) return null;
  const sumMode = ['K08','K09','K10'].includes(k.id);
  return sumMode ? v.reduce((a,b)=>a+b,0) : v.reduce((a,b)=>a+b,0)/v.length;
}
function kpiAch(k){
  const act = kpiAvg(k); if(act===null) return null;
  const tgt = kpiTarget(k); if(tgt===null) return null;
  if(k.id==='K08') return act===0?1:0;
  if(LOWER_BETTER.includes(k.id)) return act===0?1:tgt/act;
  return tgt===0?null:act/tgt;
}
const fmtK = (k,v)=> v===null||v===undefined||!isFinite(v) ? '—'
  : (isPctKpi(k) ? pct(v) : nf(v));

  document.getElementById('tabs').innerHTML = TABS.map((t,i)=>
    `<button class="${i===0?'on':''}" data-t="${t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
}
function go(id){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const on = b.dataset.t===id; b.classList.toggle('on', on);
    if(on) b.scrollIntoView({block:'nearest',inline:'nearest'});
  });
  document.querySelectorAll('section.page').forEach(s=>s.classList.toggle('on', s.id==='p-'+id));
  window.scrollTo({top:0,behavior:'smooth'});
}

  for(let m=1;m<=12;m++) h += `<th class="ctr" style="width:58px">${m}월</th>`;

  D.kpis.forEach(k=>{
    const base=kpiBase(k), tgt=kpiTarget(k), avg=kpiAvg(k), ach=kpiAch(k);
    const acts=S.kpiAct[k.id]||[];
    const isP = isPctKpi(k);
    let cells='';
    for(let m=0;m<12;m++){
      const raw = acts[m];
      const v = (raw===undefined||raw===null||raw==='') ? '' : (isP ? +(raw*100).toFixed(2) : raw);
      cells += `<td><input type="number" step="${isP?'0.1':'1'}" class="kpi-in k" value="${v}"
        oninput="setKpi('${k.id}',${m},this.value)" title="${isP?'% 단위로 입력 (예: 5.1)':'건/일/공수'}"></td>`;
    }
    const acl = ach===null?'':(ach>=1?'ach-ok':(ach>=0.9?'ach-mid':'ach-bad'));
    h += `<tr>
      <td class="ctr" style="font-weight:800;color:${PC[k.pillar]}">${k.id}</td>
      <td class="ctr" style="font-weight:800;color:${PC[k.pillar]}">${k.pillar}</td>
      <td><b>${esc(k.name)}</b><div class="cap">${esc(k.formula)}</div></td>
      <td class="num-c">${fmtK(k,base)}</td>
      <td class="num-c" style="font-weight:800">${fmtK(k,tgt)}<div class="cap">${esc(k.rationale)}</div></td>
      ${cells}
      <td class="num-c" style="font-weight:800">${fmtK(k,avg)}</td>
      <td class="ctr ${acl}">${ach===null?'—':(ach*100).toFixed(0)+'%'}</td>
    </tr>`;
  });
  h += `</tbody></table></div>
  <div class="card" style="margin-top:14px">
    <b>입력 규칙</b>
    <div class="note">비율 KPI는 <b>% 단위 숫자</b>로 입력한다(5.1 → 5.1%). 건수 KPI(중대재해·산재·클레임)는 연간 <b>합계</b>, 나머지는 <b>연평균</b>으로 집계된다.
    달성률은 낮을수록 좋은 KPI(LOSS율·결원율·이직률·산재·클레임·마감일)는 목표÷실적, 높을수록 좋은 KPI는 실적÷목표로 계산한다. 100% 이상이면 목표 달성.
    중대재해는 0건일 때만 100%다.</div>
    <div class="note warn" style="margin-top:10px">BY26 기준값 중 LOSS율·실효율·결원율·이직률·다능공·산재·클레임·마감 리드타임은 아직 가정값이다.
    목표는 기준값에 연동된 수식이므로, <b>시뮬레이터 탭에서 기준값을 실적으로 바꾸면 이 표의 목표도 함께 바뀐다.</b></div>
  </div>`;
  document.getElementById('p-kpi').innerHTML = h;
}
function setKpi(id,m,v){
  if(!S.kpiAct[id]) S.kpiAct[id]=new Array(12).fill('');
  const k=D.kpis.find(x=>x.id===id);
  const isP = isPctKpi(k);
  S.kpiAct[id][m] = v===''?'':(isP? Number(v)/100 : Number(v));
  save();
  const row=[...document.querySelectorAll('#p-kpi tbody tr')].find(tr=>tr.cells[0].textContent===id);
  if(row){
    const avg=kpiAvg(k), ach=kpiAch(k);
    row.cells[17].textContent = fmtK(k,avg);
    const c=row.cells[18];
    c.textContent = ach===null?'—':(ach*100).toFixed(0)+'%';
    c.className='ctr '+(ach===null?'':(ach>=1?'ach-ok':(ach>=0.9?'ach-mid':'ach-bad')));
  }
}

  <div class="cap">임률이 서로 다른 계약이므로 합계 금액은 대외 제시용으로 쓰지 않는다.</div>
  <div class="tbl-wrap stacked" style="margin-top:12px"><table class="stack"><thead><tr>
    <th>구분</th><th class="ctr" style="width:88px">인원(명)</th><th class="ctr" style="width:110px">임률(원/M·H)</th>
    <th class="ctr" style="width:100px">월 총공수</th></tr></thead><tbody>`;
  D.contracts.forEach((ct,i)=>{
    h += `<tr><td class="hd" data-l="구분"><div><b>${esc(ct.cust)}</b> ${esc(ct.type)}<div class="cap">${esc(ct.note)}</div></div></td>
      <td data-l="인원"><input type="number" value="${S.heads['h'+i]}" oninput="setHead(${i},this.value)"></td>
      <td data-l="임률"><input type="number" value="${S.rates['c'+i]||''}" placeholder="미확보" oninput="setRate(${i},this.value)"></td>
      <td class="num-c" data-l="월 총공수">${nf(c.rows[i].total)}</td></tr>`;
  });
  h += `<tr><td class="hd" data-l="구분"><b>합계</b></td><td class="num-c" data-l="인원"><b>${nf(c.tot.hc)}</b></td>
    <td class="ctr" data-l="임률">—</td><td class="num-c" data-l="월 총공수"><b>${nf(c.tot.total)}</b></td></tr>
    </tbody></table></div></div>`;

  h += `<div class="card"><h3>운영 기준값 · 가정</h3>
    <div class="cap">붉은 항목은 BY26 실적 미확보 — 실적으로 교체할 것.</div>
    <div style="margin-top:12px">`;
  D.basis.forEach(b=>{
    const isP = b.fmt.indexOf('%')>=0;
    const v = S.basis[b.label];
    const warn = b.src.indexOf('가정')===0;
    h += `<div class="fld-row"><label class="fld" style="${warn?'color:var(--red)':''}">${esc(b.label)}
      <span style="color:var(--muted2);font-weight:400"> · ${esc(b.src)}</span></label>
      <div class="flex"><input type="number" step="${isP?'0.1':'1'}" value="${isP?(v*100).toFixed(b.fmt.indexOf('0.00')>=0?2:1):v}"
        oninput="setBasis('${esc(b.label)}',this.value,${isP})" style="max-width:150px">
      <span class="chip">${esc(b.unit)}</span></div></div>`;
  });
  h += `</div></div></div>`;

  h += `<div class="sec-title">[1] LOSS 비용 — 실제 비조업 공수 기준 (정산·협상 근거)</div>
  <div class="tbl-wrap stacked"><table class="stack"><thead><tr>
    <th>구분</th><th class="ctr">인원</th><th class="ctr">월 총공수</th><th class="ctr">월 LOSS공수</th>
    <th class="ctr">원청귀책H</th><th class="ctr">도급귀책H</th><th class="ctr">도급귀책 비용/월</th>
    <th class="ctr">연 도급귀책 비용</th><th class="ctr">연 절감액(${pct(c.cut)})</th></tr></thead><tbody>`;
  const simRow = (name, r, bold) => {
    const B_ = v => bold ? `<b>${v}</b>` : v;
    return `<tr><td class="hd" data-l="구분">${B_(esc(name))}</td>
      <td class="num-c" data-l="인원">${B_(nf(r.hc))}</td>
      <td class="num-c" data-l="월 총공수">${B_(nf(r.total))}</td>
      <td class="num-c" data-l="월 LOSS공수">${B_(nf(r.lossH))}</td>
      <td class="num-c" data-l="원청귀책H" style="color:var(--amber)">${B_(nf(r.ownH))}</td>
      <td class="num-c" data-l="도급귀책H" style="color:var(--red)">${B_(nf(r.subH))}</td>
      <td class="num-c" data-l="비용/월">${B_(r.rate||bold?won(r.subCost):'—')}</td>
      <td class="num-c" data-l="연 비용">${B_(r.rate||bold?won(r.subY):'—')}</td>
      <td class="num-c" data-l="연 절감액" style="font-weight:800;color:var(--green)">${B_(r.rate||bold?won(r.saveY):'—')}</td></tr>`;
  };
  c.rows.forEach(r=>{ h += simRow(r.cust+' '+r.type, r, false); });
  h += simRow('합계', {...c.tot, rate:1}, true);
  h += `</tbody></table></div>
    <div class="note warn">임률 미입력 계약(코스비전 2축)은 0으로 계산된다. AP 임률을 코스비전에 그대로 적용하지 말 것 — 실적·임률은 별도 관리 대상이다.</div>`;

  h += `<div class="sec-title">[2] 효율 GAP 환산 — KPI 미달의 기회비용 (추정)</div>
  <div class="grid g3">
    <div class="card"><div class="cap">목표효율 − 실효율</div>
      <div class="big" style="color:var(--amber)">${pct(B('BY27 목표효율')-B('BY26 실효율'))}</div>
      <div class="note">${pct(B('BY27 목표효율'))} − ${pct(B('BY26 실효율'))}</div></div>
    <div class="card"><div class="cap">월 GAP 공수</div>
      <div class="big">${nf(c.tot.gapH)} <span style="font-size:14px;color:var(--muted)">M·H</span></div>
      <div class="note">월 총공수 ${nf(c.tot.total)} M·H × GAP</div></div>
    <div class="card"><div class="cap">연 환산액</div>
      <div class="big" style="color:var(--amber)">${won(c.tot.gapY)}</div>
      <div class="note">월 ${won(c.tot.gapCost)} × ${c.months}개월</div></div>
  </div>
  <div class="note">[1] LOSS 비용은 실제 비조업 공수 기준으로 정산·협상 근거가 되고, [2] 효율 GAP은 KPI 미달의 기회비용 추정치다.
  성격이 다르므로 합산하지 않는다. 임원 보고 시 함께 제시해 「LOSS 외에 운영 효율 자체가 떨어져 있다」는 메시지를 전달한다.</div>`;

  const S1=c.tot.subY*S.cut.a, S2=c.tot.subY*S.cut.b, S3=c.tot.subY*S.cut.c;
  const mx=Math.max(S1,S2,S3,1);
  h += `<div class="sec-title">[3] 도급귀책 LOSS 저감 시나리오</div><div class="grid g3">`;
  [['보수','a','3대 항목 중 1개만 정착'],['기준','b','BY27 목표 — 과제 A-02'],['도전','c','라인 효율관리(A-03) 동반 성공 시']]
   .forEach((sc,i)=>{
    const val=[S1,S2,S3][i], cl=['var(--muted)','var(--blue)','var(--green)'][i];
    h += `<div class="card"><div class="flex"><b>${sc[0]}</b>
      <span class="sp"><input type="number" step="1" style="width:78px;display:inline-block"
        value="${(S.cut[sc[1]]*100).toFixed(0)}" oninput="setCut('${sc[1]}',this.value)"> </span>
      <span class="chip">%</span></div>
      <div class="big" style="color:${cl};margin-top:10px">${won(val)}</div>
      <div class="bar" style="margin:10px 0 6px"><span style="width:${val/mx*100}%;background:${cl}"></span></div>
      <div class="cap">${sc[2]}</div></div>`;
  });
  h += `</div>`;
  document.getElementById('p-sim').innerHTML = h;
}
function setHead(i,v){ S.heads['h'+i]=Number(v)||0; save(); renderSimSoft(); renderKpi(); renderOverview(); }
function setRate(i,v){ S.rates['c'+i]=Number(v)||0; save(); renderSimSoft(); renderKpi(); renderOverview(); }
function setBasis(l,v,isP){ S.basis[l]= isP ? (Number(v)||0)/100 : (Number(v)||0); save();
  renderSimSoft(); renderKpi(); renderOverview(); }
function setCut(k,v){ S.cut[k]=(Number(v)||0)/100; save(); renderSimSoft(); }
let simTimer=null;
function renderSimSoft(){ clearTimeout(simTimer); simTimer=setTimeout(()=>{
  const a=document.activeElement; const id=a&&a.getAttribute&&a.getAttribute('oninput');
  renderSim();
  if(id){ const t=[...document.querySelectorAll('#p-sim input')].find(x=>x.getAttribute('oninput')===id);
    if(t){ t.focus(); try{ t.setSelectionRange(t.value.length,t.value.length);}catch(e){} } }
},420); }

/* ── 리스크 ─────────────────────────────────────── */
function renderRisk(){
  const rank = {'高':3,'中':2,'低':1};
  const sorted=[...D.risks].sort((a,b)=>(rank[b.impact]*2+rank[b.prob])-(rank[a.impact]*2+rank[a.prob]));
  let h = `<div class="sec-title">리스크 등록부 ${D.risks.length}건 · 영향×발생 우선순위</div>
  <div class="tbl-wrap stacked"><table class="stack"><thead><tr>
    <th style="width:46px">ID</th><th style="width:58px">구분</th><th style="min-width:230px">리스크</th>
    <th style="width:52px" class="ctr">영향</th><th style="width:58px" class="ctr">발생</th>
    <th style="min-width:280px">대응 방안</th><th style="width:80px" class="ctr">담당</th>
    <th style="width:70px" class="ctr">점검</th><th style="width:96px">상태</th></tr></thead><tbody>`;
  sorted.forEach(r=>{
    const st=S.riskStatus[r.id]||'미착수';
    h += `<tr><td class="ctr hd" data-l="ID" style="font-weight:800;color:var(--red)">${r.id}<span class="nw"> · ${esc(r.cat)}</span></td>
      <td class="ctr wo" data-l="구분"><span class="chip">${esc(r.cat)}</span></td>
      <td data-l="리스크"><b>${esc(r.risk)}</b></td>
      <td class="ctr lv-${r.impact}" data-l="영향">${r.impact}</td>
      <td class="ctr lv-${r.prob}" data-l="발생">${r.prob}</td>
      <td data-l="대응">${esc(r.action)}</td>
      <td class="ctr" data-l="담당" style="color:var(--muted)">${esc(r.owner)}</td>
      <td class="ctr" data-l="점검" style="color:var(--muted)">${esc(r.cycle)}</td>
      <td data-l="상태"><select onchange="setRisk('${r.id}',this.value)">
        ${['미착수','진행중','완료','보류'].map(o=>`<option ${o===st?'selected':''}>${o}</option>`).join('')}
      </select></td></tr>`;
  });
  h += `</tbody></table></div>
  <div class="card warn" style="margin-top:14px"><b>지휘 원칙 — 리스크 R1의 유일한 예방책</b>
    <div class="note">현장 작업자에 대한 지시는 반드시 도급사 관리라인(조장·반장)을 경유한다.
    354명은 직접 지휘 대상이 아니라 관리라인을 통한 간접 통솔 대상이며, 직접 지휘·근태 직접관리는 불법파견(위장도급) 판정의 직접 근거가 된다.
    한 건의 예외가 다음 협상과 노무 분쟁의 선례가 된다.</div>
  </div>
  <div class="card" style="margin-top:12px"><b>최우선 배분</b>
    <div class="note">R1(불법파견)·R5(BY28 단가)는 발생 시 계약과 손익에 직접 타격한다. 나머지 과제보다 먼저 자원을 배분하고, 진행 상태를 월 보고에 고정 항목으로 넣는다.</div>
  </div>`;
  document.getElementById('p-risk').innerHTML = h;
}
function setRisk(id,v){ S.riskStatus[id]=v; save(); renderOverview(); }

/* ── 운영 루틴 ──────────────────────────────────── */
function renderRoutine(){
  let h = `<div class="sec-title">센터장 정기 운영 루틴 — 연간계획을 굴리는 반복 업무</div><div class="grid g2">`;
  D.routine.forEach((r,i)=>{
    const cl=['var(--blue)','var(--green)','var(--amber)','var(--purple)','var(--teal)','var(--red)'][i%6];
    h += `<div class="card"><div class="flex"><span class="pill" style="background:${cl}">${esc(r.cycle)}</span></div>
      <div style="margin-top:10px;font-size:13px;line-height:1.7">${esc(r.desc)}</div></div>`;
  });
  h += `</div>
  <div class="sec-title">본사·원청 결정 요청 사항</div>
  <div class="tbl-wrap stacked"><table class="stack"><thead><tr>
    <th style="width:40px" class="ctr">#</th><th style="min-width:220px">요청 사항</th>
    <th style="min-width:320px">사유</th><th style="width:76px" class="ctr">기한</th>
    <th style="width:110px" class="ctr">대상</th></tr></thead><tbody>`;
  [['01','BY27 계약유형별 확정 임률 공유','AP 업무도급·코스비전 2축 임률이 없어 시뮬레이션이 AP 생산도급 중심으로만 산출된다.','1월 내','본사 / 계약'],
   ['02','코스비전 세탁실 별도정산 기준 승인','비용 분리 산정기준·증빙 양식을 확정해야 분리청구 누락을 0으로 만들 수 있다.','2월 내','본사 / 코스비전'],
   ['03','LOSS 사유코드·귀책룰 원청(AP) 합의','공통 LOSS를 사유별로 귀속하는 룰에 원청 합의가 없으면 BY28 협상에서 다시 뒤집힌다.','1Q 내','원청 AP'],
   ['04','상시 채용 파이프라인 본사 지원','결원율 3.0% 목표는 채용 리드타임 단축 없이는 달성 불가. 현장 단독 해결 범위를 넘는다.','1Q 내','본사 HR'],
   ['05','불법파견 자체진단 에스컬레이션 라인 확정','고위험 항목 발견 시 본사 HR 보고·조치 경로를 사전에 정해 둔다.','2Q 내','본사 HR']
  ].forEach(a=>{
    h += `<tr><td class="ctr hd" data-l="#" style="font-weight:800;color:var(--amber)">${a[0]}<span class="nw">. ${esc(a[1])}</span></td>
      <td class="wo" data-l="요청"><b>${esc(a[1])}</b></td>
      <td data-l="사유" style="color:var(--muted)">${esc(a[2])}</td>
      <td class="ctr" data-l="기한"><span class="chip">${esc(a[3])}</span></td>
      <td class="ctr" data-l="대상" style="color:var(--muted)">${esc(a[4])}</td></tr>`;
  });
  h += `</tbody></table></div>
  <div class="note">요청 5건이 확정되면 시뮬레이터 입력만으로 KPI 목표와 금액 효과가 계약 4축 전체로 확장된다.</div>`;
  document.getElementById('p-routine').innerHTML = h;
}

/* ── 부팅 ───────────────────────────────────────── */
function renderAll(){
  document.getElementById('subline').textContent = D.meta.subtitle + ' · ' + D.meta.period;
  renderOverview(); renderCalendar(); renderTasks(); renderKpi(); renderSim(); renderRisk(); renderRoutine();
}
buildTabs(); renderAll();
document.getElementById('saveinfo').textContent = '자동 저장 (이 브라우저)';
</script>
</body>
</html>
