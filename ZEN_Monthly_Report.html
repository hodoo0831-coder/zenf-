<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>월 마감 자동 보고서 v4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --ink-900: #0a1628; --ink-800: #0c2340; --ink-700: #163b62; --ink-600: #1d4f82;
  --ink-500: #2962a8; --ink-400: #4a85c4; --ink-300: #82acd6; --ink-200: #c0d6e8;
  --ink-100: #e0ebf5; --ink-50: #f0f6fb;
  --paper: #fafaf7; --paper-2: #f4f3ee; --line: #e8e6e0; --line-2: #d8d5cd;
  --text: #18181b; --text-2: #52525b; --text-3: #71717a; --text-4: #a1a1aa;
  --green-900: #1b4d1f; --green-700: #2d6a32; --green-500: #5b9133; --green-100: #e6f0d8;
  --red-900: #7a1d1d; --red-700: #a32d2d; --red-500: #d4654c; --red-100: #fbe4e0;
  --amber-700: #854f0b; --amber-100: #faeeda;
  --radius-sm: 6px; --radius: 10px; --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.04), 0 0 0 1px rgba(15,23,42,0.06);
  --shadow: 0 4px 16px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-lg: 0 12px 32px rgba(15,23,42,0.08), 0 4px 8px rgba(15,23,42,0.04);
  --font-sans: 'Inter', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { font-family: var(--font-sans); background: var(--paper); color: var(--text); margin: 0; padding: 36px 28px; line-height: 1.55; letter-spacing: -0.005em; }
.wrap { max-width: 1180px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }

.app-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; padding: 0 4px; }
.app-header-left { display: flex; align-items: center; gap: 14px; }
.app-logo { width: 38px; height: 38px; border-radius: 9px; background: linear-gradient(135deg, var(--ink-700), var(--ink-500)); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
.app-logo svg { width: 20px; height: 20px; }
.app-title h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -0.02em; color: var(--ink-900); }
.app-title .ver { font-size: 10px; color: var(--text-4); font-weight: 500; font-family: var(--font-mono); margin-left: 6px; }
.app-title p { font-size: 12px; color: var(--text-3); margin: 2px 0 0; }
.app-header-right { font-size: 11px; color: var(--text-3); text-align: right; font-family: var(--font-mono); }
.app-header-right .date { color: var(--text-2); font-weight: 500; }

.dropzone { background: white; border: 1.5px dashed var(--line-2); border-radius: var(--radius); padding: 18px 22px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.dropzone:hover, .dropzone.dragover { border-color: var(--ink-500); background: var(--ink-50); }
.dropzone-icon { width: 42px; height: 42px; border-radius: 50%; background: var(--ink-100); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
.dropzone:hover .dropzone-icon { background: var(--ink-200); }
.dropzone-icon svg { width: 20px; height: 20px; stroke: var(--ink-700); }
.dropzone-text { flex: 1; }
.dropzone-text .main { font-size: 13px; color: var(--text); font-weight: 600; margin: 0; }
.dropzone-text .sub { font-size: 11px; color: var(--text-3); margin: 2px 0 0; }
.file-result { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; animation: slideDown 0.3s; }
.file-result.ok { background: var(--ink-50); border: 1px solid var(--ink-200); color: var(--ink-700); }
.file-result.err { background: var(--red-100); border: 1px solid var(--red-500); color: var(--red-900); }

.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; padding: 10px 14px; background: white; border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow-sm); flex-wrap: wrap; }
.toolbar-section { display: flex; gap: 6px; align-items: center; }
.toolbar-divider { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.toolbar-label { font-size: 11px; color: var(--text-3); font-weight: 500; margin-right: 4px; }

button, .btn { padding: 7px 12px; border: 1px solid var(--line); background: white; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 500; color: var(--text); transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; }
button:hover, .btn:hover { background: var(--paper-2); border-color: var(--line-2); }
button.primary { background: var(--ink-700); color: white; border-color: var(--ink-700); }
button.primary:hover { background: var(--ink-800); }
button.danger { color: var(--red-700); border-color: var(--red-100); }
button.danger:hover { background: var(--red-100); }
button svg { width: 13px; height: 13px; }

.month-pills { display: flex; gap: 4px; flex-wrap: wrap; }
.month-pill { padding: 5px 10px; background: var(--paper-2); border-radius: 20px; font-size: 11px; cursor: pointer; transition: all 0.15s; font-family: var(--font-mono); font-weight: 500; color: var(--text-2); }
.month-pill:hover { background: var(--ink-100); }
.month-pill.active { background: var(--ink-700); color: white; }

.report { display: none; }
.report.active { display: block; animation: fadeIn 0.4s; }
.page { background: white; padding: 40px 44px; border-radius: var(--radius-lg); border: 1px solid var(--line); box-shadow: var(--shadow); margin-bottom: 14px; }

.page-marker { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.page-num { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: white; background: var(--ink-700); padding: 3px 10px; border-radius: 12px; letter-spacing: 0.05em; }
.page-num.sub { background: var(--text-3); }
.page-marker-line { flex: 1; height: 1px; background: var(--line); }
.page-marker-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-4); letter-spacing: 0.1em; text-transform: uppercase; }

.report-head { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 18px; border-bottom: 2px solid var(--ink-700); margin-bottom: 22px; }
.report-head-left h2 { font-size: 28px; margin: 0; font-weight: 800; color: var(--ink-900); letter-spacing: -0.03em; line-height: 1.1; }
.report-head-left .subtitle { font-size: 12px; color: var(--text-3); margin: 6px 0 0; }
.report-head-left .meta-row { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: var(--text-2); }
.report-head-left .meta-row span { display: flex; align-items: center; gap: 4px; }
.report-head-left .meta-row strong { color: var(--ink-700); font-weight: 600; }
.report-head-right { text-align: right; }
.report-head-right .author { font-size: 13px; font-weight: 600; color: var(--ink-700); }
.report-head-right .dept { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.report-head-right .stamp { display: inline-block; margin-top: 8px; padding: 2px 8px; background: var(--paper-2); border-radius: 4px; font-size: 9px; color: var(--text-3); font-family: var(--font-mono); letter-spacing: 0.05em; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.kpi { background: white; padding: 16px 18px; border-radius: var(--radius); border: 1px solid var(--line); position: relative; overflow: hidden; transition: all 0.2s; }
.kpi:hover { border-color: var(--line-2); transform: translateY(-1px); box-shadow: var(--shadow); }
.kpi.alert { background: linear-gradient(180deg, #fef4f4 0%, white 60%); border-color: var(--red-100); }
.kpi.good { background: linear-gradient(180deg, #f3f7eb 0%, white 60%); border-color: var(--green-100); }
.kpi.featured { background: linear-gradient(180deg, var(--ink-50) 0%, white 60%); border-color: var(--ink-200); }
.kpi-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.kpi-label { font-size: 11px; color: var(--text-3); font-weight: 500; }
.kpi-val { font-size: 28px; font-weight: 800; margin: 0; color: var(--ink-900); letter-spacing: -0.03em; line-height: 1; }
.kpi-val .unit { font-size: 14px; color: var(--text-3); font-weight: 600; margin-left: 2px; }
.kpi-trend { font-size: 11px; margin-top: 8px; display: flex; align-items: center; gap: 5px; font-weight: 500; }
.kpi-trend.up { color: var(--red-700); }
.kpi-trend.down { color: var(--green-700); }
.kpi-trend.flat { color: var(--text-3); }
.kpi-trend .vs { color: var(--text-4); font-weight: 400; margin-left: 2px; }
.kpi-spark { position: absolute; right: 14px; bottom: 12px; opacity: 0.5; pointer-events: none; }

.insight-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.insight-card { background: linear-gradient(180deg, var(--ink-50) 0%, white 100%); border: 1px solid var(--ink-100); border-radius: var(--radius); padding: 14px 16px; position: relative; }
.insight-tag { display: inline-block; font-size: 9px; padding: 2px 8px; background: var(--ink-700); color: white; border-radius: 10px; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 8px; font-family: var(--font-mono); }
.insight-title { font-size: 13px; font-weight: 700; color: var(--ink-900); margin: 0 0 6px; line-height: 1.3; }
.insight-text { font-size: 11px; color: var(--text-2); margin: 0; line-height: 1.6; }
.insight-value { font-size: 20px; font-weight: 800; color: var(--ink-700); margin: 6px 0 2px; font-variant-numeric: tabular-nums; }

.viz-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-bottom: 18px; }
.viz-box { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; transition: border-color 0.2s; }
.viz-box:hover { border-color: var(--line-2); }
.viz-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--paper-2); }
.viz-title { font-size: 12px; font-weight: 700; color: var(--ink-900); margin: 0; letter-spacing: -0.01em; }
.viz-meta { font-size: 10px; color: var(--text-4); font-family: var(--font-mono); }

.area-chart { padding: 6px 0; }
.area-svg { width: 100%; height: 220px; display: block; }
.area-legend { display: flex; gap: 18px; justify-content: center; margin-top: 12px; font-size: 11px; padding-top: 10px; border-top: 1px solid var(--paper-2); }
.area-legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-weight: 500; }
.area-legend-dot { width: 12px; height: 12px; border-radius: 3px; }

.alert-bars { padding: 4px 0; }
.alert-bar-row { margin-bottom: 13px; }
.alert-bar-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; font-size: 11px; }
.alert-bar-name { font-weight: 700; color: var(--ink-900); font-size: 12px; }
.alert-bar-cat { font-size: 9px; color: var(--text-3); padding: 2px 7px; background: var(--paper-2); border-radius: 3px; margin-left: 6px; font-weight: 500; }
.alert-bar-pct { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px; }
.alert-bar-track { background: var(--paper-2); border-radius: 4px; height: 24px; position: relative; overflow: hidden; }
.alert-bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding: 0 10px; font-size: 10px; color: white; font-weight: 700; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); font-variant-numeric: tabular-nums; }
.alert-bar-fill.up { background: linear-gradient(90deg, var(--red-500), var(--red-700)); }
.alert-bar-fill.down { background: linear-gradient(90deg, var(--green-500), var(--green-700)); }
.alert-bar-flow { font-size: 10px; color: var(--text-3); margin-top: 4px; font-variant-numeric: tabular-nums; text-align: right; font-family: var(--font-mono); }

.section-head { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.section-head-left { display: flex; align-items: center; gap: 10px; }
.section-count { font-size: 10px; font-weight: 600; color: var(--ink-600); background: var(--ink-50); padding: 2px 8px; border-radius: 10px; margin-left: 6px; font-family: var(--font-mono); letter-spacing: 0.02em; vertical-align: middle; }

/* ─── 그룹 구분선 ─── */
.group-divider { display: flex; align-items: center; gap: 12px; margin: 30px 0 4px; }
.group-divider::before, .group-divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.group-divider-label { font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--font-mono); white-space: nowrap; }
.section-icon { width: 22px; height: 22px; border-radius: 5px; background: var(--ink-100); color: var(--ink-700); display: flex; align-items: center; justify-content: center; }
.section-icon svg { width: 12px; height: 12px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--ink-900); margin: 0; letter-spacing: -0.01em; }
.section-sub { font-size: 10px; color: var(--text-4); font-family: var(--font-mono); }

.heatmap-wrap { overflow-x: auto; max-width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--line); }
.heatmap { border-collapse: separate; border-spacing: 0; font-size: 10px; width: 100%; min-width: 800px; }
.heatmap th { background: var(--ink-800); color: white; padding: 9px 6px; font-weight: 600; font-size: 10px; text-align: center; min-width: 64px; font-family: var(--font-mono); }
.heatmap th.line-head { text-align: left; padding-left: 12px; min-width: 120px; }
.heatmap th:first-child { border-top-left-radius: 6px; }
.heatmap th:last-child { border-top-right-radius: 6px; }
.heatmap td { padding: 6px 8px; border-bottom: 1px solid var(--paper-2); font-variant-numeric: tabular-nums; }
.heatmap tr:last-child td { border-bottom: none; }
.heatmap td.line-name { text-align: left; font-weight: 600; padding-left: 12px; background: var(--paper); font-family: var(--font-sans); font-size: 11px; }
.heatmap td.cell { text-align: right; font-size: 10px; font-family: var(--font-mono); }
.heatmap td.cell:hover { outline: 2px solid var(--ink-500); outline-offset: -2px; }
.heatmap td.cell-clickable { transition: all 0.12s; }
.heatmap td.cell-clickable:hover { outline: 2px solid var(--ink-700); outline-offset: -2px; filter: brightness(1.12); }
.heatmap-hint { font-size: 10px; color: var(--text-3); margin-top: 8px; padding: 6px 10px; background: var(--paper); border-radius: var(--radius-sm); }

/* ─── 셀 드릴다운 ─── */
.cd-head { margin-bottom: 14px; }
.cd-title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.cd-line { font-size: 22px; font-weight: 800; color: var(--ink-900); margin: 0; letter-spacing: -0.03em; }
.cd-month { font-size: 12px; color: var(--text-3); font-family: var(--font-mono); padding: 2px 8px; background: var(--paper-2); border-radius: 4px; }
.cd-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cd-kpi { background: var(--paper); border-radius: var(--radius-sm); padding: 12px 14px; }
.cd-kpi-label { font-size: 10px; color: var(--text-3); font-weight: 500; margin-bottom: 4px; }
.cd-kpi-val { font-size: 19px; font-weight: 800; color: var(--ink-700); letter-spacing: -0.02em; }
.cd-kpi-sub { font-size: 10px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.cd-section-title { font-size: 12px; font-weight: 700; color: var(--ink-900); margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.cd-brands { display: flex; flex-direction: column; gap: 6px; }
.cd-brand-row { display: grid; grid-template-columns: 70px 1fr 56px 42px 56px; gap: 8px; align-items: center; font-size: 11px; }
.cd-brand-name { font-weight: 700; color: var(--ink-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cd-brand-track { background: var(--paper-2); border-radius: 3px; height: 16px; overflow: hidden; }
.cd-brand-fill { height: 100%; background: linear-gradient(90deg, var(--ink-500), var(--ink-700)); border-radius: 3px; }
.cd-brand-amt { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; color: var(--ink-700); }
.cd-brand-pct { font-variant-numeric: tabular-nums; color: var(--text-3); text-align: right; font-size: 10px; }
.cd-brand-qty { font-variant-numeric: tabular-nums; color: var(--text-4); text-align: right; font-size: 10px; font-family: var(--font-mono); }
.cd-note { font-size: 11px; color: var(--text-2); line-height: 1.6; margin: 16px 0 0; padding: 12px 14px; background: var(--ink-50); border-radius: var(--radius-sm); border-left: 3px solid var(--ink-400); }
.cd-note strong { color: var(--ink-700); }

/* ─── 이상치 KPI 클릭 ─── */
.kpi-clickable { transition: all 0.2s; }
.kpi-clickable:hover { border-color: var(--red-500); transform: translateY(-2px); box-shadow: var(--shadow); }

/* ─── 이상치 상세 모달 ─── */
.al-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.al-sum-card { background: var(--paper); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
.al-sum-card.up { background: #fdf3f2; }
.al-sum-card.down { background: #f2f7ee; }
.al-sum-num { font-size: 24px; font-weight: 800; color: var(--ink-800); letter-spacing: -0.03em; line-height: 1; }
.al-sum-label { font-size: 10px; color: var(--text-3); font-weight: 500; margin-top: 4px; }
.al-intro { font-size: 11px; color: var(--text-2); line-height: 1.6; margin: 0 0 18px; padding: 10px 12px; background: var(--ink-50); border-radius: var(--radius-sm); }
.al-intro strong { color: var(--ink-700); }
.al-group { margin-bottom: 18px; }
.al-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.al-group-icon { width: 26px; height: 26px; border-radius: 6px; background: var(--ink-100); color: var(--ink-700); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.al-group-icon svg { width: 14px; height: 14px; }
.al-group-title-wrap { flex: 1; display: flex; flex-direction: column; }
.al-group-title { font-size: 13px; font-weight: 700; color: var(--ink-900); }
.al-group-desc { font-size: 10px; color: var(--text-4); }
.al-group-count { font-size: 11px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
.al-rows { display: flex; flex-direction: column; }
.al-row { display: grid; grid-template-columns: 20px 1fr 150px 64px; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--paper-2); font-size: 12px; }
.al-row:last-child { border-bottom: none; }
.al-row-click { cursor: pointer; border-radius: var(--radius-sm); transition: background 0.12s; }
.al-row-click:hover { background: var(--ink-50); }
.al-dir { font-size: 10px; text-align: center; }
.al-dir-up { color: var(--red-700); }
.al-dir-down { color: var(--green-700); }
.al-name { font-weight: 700; color: var(--ink-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.al-drill-tag { font-size: 9px; color: var(--ink-500); font-weight: 600; opacity: 0; transition: opacity 0.15s; }
.al-row-click:hover .al-drill-tag { opacity: 1; }
.al-flow { font-size: 11px; color: var(--text-3); text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.al-pct { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }

/* ─── KPI 카드 화살표 + 드릴다운 ─── */
.kpi-more { font-size: 16px; color: var(--text-4); font-weight: 400; opacity: 0; transition: opacity 0.15s; line-height: 1; }
.kpi-clickable:hover .kpi-more { opacity: 1; }
.kpi-clickable:hover { border-color: var(--ink-300); transform: translateY(-2px); box-shadow: var(--shadow); }
.kd-head { margin-bottom: 16px; }
.kd-head-val { font-size: 32px; font-weight: 800; color: var(--ink-900); letter-spacing: -0.03em; line-height: 1; }
.kd-head-delta { font-size: 13px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kd-stack { display: flex; height: 28px; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 14px; gap: 2px; }
.kd-stack-seg { transition: opacity 0.15s; min-width: 3px; }
.kd-stack-seg:hover { opacity: 0.85; }
.kd-comp-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }

.kd-ex-val { display: block; font-size: 16px; font-weight: 800; color: var(--ink-700); letter-spacing: -0.02em; }
.kd-section-title { font-size: 12px; font-weight: 700; color: var(--ink-900); margin: 18px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.kd-line-list { display: flex; flex-direction: column; gap: 2px; }
.kd-line-row { display: grid; grid-template-columns: 1fr 80px 60px; gap: 8px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--paper-2); font-size: 12px; }

.kd-line-amt { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink-700); text-align: right; }
.kd-line-d { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; font-size: 11px; }

/* ─── 누계 기간 선택 ─── */
.cum-controls { margin-bottom: 14px; }

.cum-opts { display: flex; gap: 6px; flex-wrap: wrap; }

.cum-opt-btn:hover { border-color: var(--ink-300); }
.cum-opt-btn.active { background: var(--ink-700); color: white; border-color: var(--ink-700); }
.cum-custom-row { display: flex; align-items: center; gap: 8px; }
.cum-custom-row select { padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 12px; background: white; cursor: pointer; font-family: var(--font-mono); color: var(--ink-700); font-weight: 600; }
.cum-tilde { color: var(--text-4); font-weight: 600; }
.cum-result { background: linear-gradient(180deg, var(--ink-50), white); border: 1px solid var(--ink-100); border-radius: var(--radius); padding: 16px; }
.cum-label { font-size: 11px; color: var(--text-2); margin-bottom: 12px; }

.cum-main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.cum-big { display: flex; flex-direction: column; gap: 3px; }
.cum-big-label { font-size: 10px; color: var(--text-3); font-weight: 500; }
.cum-big-val { font-size: 26px; font-weight: 800; color: var(--ink-700); letter-spacing: -0.03em; line-height: 1; }
.cum-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-top: 12px; border-top: 1px solid var(--ink-100); }
.cum-cell { display: flex; flex-direction: column; gap: 2px; text-align: center; }
.cum-c-label { font-size: 9px; color: var(--text-4); font-weight: 500; }
.cum-c-val { font-size: 13px; font-weight: 800; color: var(--ink-800); font-variant-numeric: tabular-nums; }
.cum-c-pct { font-size: 9px; color: var(--ink-500); font-weight: 600; font-family: var(--font-mono); }
.heatmap td.total-cell { background: var(--ink-800) !important; color: white !important; font-weight: 700; }

.unit-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.unit-card { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; transition: all 0.2s; }
.unit-card:hover { border-color: var(--ink-300); transform: translateY(-1px); box-shadow: var(--shadow); }
.unit-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.unit-name { font-size: 12px; font-weight: 700; color: var(--ink-900); }
.unit-cat { font-size: 9px; color: var(--text-4); font-family: var(--font-mono); }
.unit-main { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.unit-curr { font-size: 22px; font-weight: 800; color: var(--ink-700); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.unit-curr-unit { font-size: 11px; color: var(--text-3); font-weight: 500; }
.unit-delta { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
.unit-delta.up { color: var(--red-700); background: var(--red-100); }
.unit-delta.down { color: var(--green-700); background: var(--green-100); }
.unit-delta.flat { color: var(--text-3); background: var(--paper-2); }
.unit-mini-svg { width: 100%; height: 44px; display: block; margin-top: 6px; }
.unit-stats { display: flex; gap: 8px; font-size: 9px; color: var(--text-3); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--paper-2); }
.unit-stat { flex: 1; text-align: center; }
.unit-stat .v { display: block; color: var(--text); font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }

.summary-box { background: linear-gradient(135deg, var(--ink-700), var(--ink-800)); border-radius: var(--radius); padding: 18px 22px; margin-top: 16px; color: white; box-shadow: var(--shadow); }
.summary-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.summary-icon { width: 20px; height: 20px; }
.summary-title { font-size: 11px; font-weight: 700; margin: 0; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-200); font-family: var(--font-mono); }
.summary-text { font-size: 13px; line-height: 1.7; margin: 0; color: white; }
.summary-text strong { color: white; font-weight: 700; }

.action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
.action-card { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; transition: all 0.2s; }
.action-card:hover { border-color: var(--ink-500); transform: translateY(-1px); box-shadow: var(--shadow); }
.action-icon { width: 28px; height: 28px; border-radius: 6px; background: var(--ink-100); color: var(--ink-700); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.action-icon svg { width: 15px; height: 15px; }
.action-title { font-size: 12px; font-weight: 700; color: var(--ink-900); margin: 0 0 3px; }
.action-desc { font-size: 11px; color: var(--text-3); margin: 0; line-height: 1.4; }

.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.2s; }
.modal-bg.active { display: flex; }
.modal { background: white; border-radius: var(--radius-lg); width: 100%; max-width: 640px; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: modalIn 0.25s; }
.modal-head { padding: 20px 24px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.modal-title { font-size: 16px; font-weight: 700; margin: 0; color: var(--ink-900); }
.modal-close { background: none; border: none; padding: 4px; cursor: pointer; color: var(--text-3); }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
.modal-foot { padding: 14px 24px; border-top: 1px solid var(--line); background: var(--paper); display: flex; gap: 8px; justify-content: flex-end; }
.modal textarea { width: 100%; min-height: 240px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 12px; line-height: 1.6; resize: vertical; color: var(--text); background: var(--paper); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes modalIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

/* ─── 워터폴 차트 ─── */
.waterfall { padding: 6px 0; }
.waterfall-svg { width: 100%; height: 240px; display: block; }
.wf-bar { transition: all 0.3s; cursor: default; }
.wf-bar:hover { filter: brightness(1.08); }
.wf-connector { stroke: var(--text-4); stroke-width: 1; stroke-dasharray: 2 2; opacity: 0.5; }
.wf-label { font-size: 9px; fill: var(--text-3); font-family: var(--font-mono); }
.wf-value { font-size: 9px; font-weight: 700; font-family: var(--font-mono); }
.wf-name { font-size: 10px; font-family: var(--font-sans); }
.wf-bar { transition: opacity 0.15s; }
.wf-bar[onclick]:hover { opacity: 0.8; }
.wf-caption { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.wf-cap-text { font-size: 12px; color: var(--text-2); }
.wf-cap-text strong { color: var(--ink-800); font-weight: 700; }
.wf-cap-net { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.wf-hint { font-size: 10px; color: var(--text-3); margin-bottom: 10px; padding: 6px 10px; background: var(--paper); border-radius: var(--radius-sm); }
.waterfall { overflow-x: auto; }
.waterfall-svg { width: 100%; min-width: 700px; height: 300px; display: block; }

/* ─── 워터폴 드릴다운 ─── */
.wfd-head { margin-bottom: 16px; }
.wfd-title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.wfd-line { font-size: 22px; font-weight: 800; color: var(--ink-900); margin: 0; letter-spacing: -0.03em; }
.wfd-month { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }
.wfd-summary { display: flex; align-items: center; gap: 14px; background: var(--paper); border-radius: var(--radius-sm); padding: 12px 16px; }
.wfd-sum-item { display: flex; flex-direction: column; gap: 2px; }
.wfd-sum-label { font-size: 10px; color: var(--text-3); font-weight: 500; }
.wfd-sum-val { font-size: 18px; font-weight: 800; color: var(--ink-700); letter-spacing: -0.02em; }
.wfd-sum-arrow { color: var(--text-4); font-size: 16px; }
.wfd-section-title { font-size: 12px; font-weight: 700; color: var(--ink-900); margin: 18px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.wfd-axis { display: grid; grid-template-columns: 80px 1fr 70px 110px; gap: 8px; font-size: 9px; color: var(--text-4); font-family: var(--font-mono); padding-bottom: 6px; }
.wfd-axis .c { text-align: center; }
.wfd-axis .r { text-align: right; }
.wfd-rows { display: flex; flex-direction: column; gap: 4px; }
.wfd-row { display: grid; grid-template-columns: 80px 1fr 70px 110px; gap: 8px; align-items: center; font-size: 11px; padding: 4px 0; }
.wfd-brand { font-weight: 700; color: var(--ink-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wfd-bar-zone { display: flex; align-items: center; height: 18px; }
.wfd-bar-neg { flex: 1; display: flex; justify-content: flex-end; height: 100%; padding-right: 2px; }
.wfd-bar-pos { flex: 1; display: flex; justify-content: flex-start; height: 100%; padding-left: 2px; border-left: 1.5px solid var(--line-2); }
.wfd-fill { height: 100%; min-width: 1px; border-radius: 3px; }
.wfd-fill.neg { background: linear-gradient(90deg, var(--green-700), var(--green-500)); }
.wfd-fill.pos { background: linear-gradient(90deg, var(--red-500), var(--red-700)); }
.wfd-delta { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.wfd-flow { font-size: 10px; color: var(--text-3); text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wfd-note { font-size: 11px; color: var(--text-2); line-height: 1.6; margin: 16px 0 0; padding: 12px 14px; background: var(--ink-50); border-radius: var(--radius-sm); border-left: 3px solid var(--ink-400); }
.wfd-note strong { color: var(--ink-700); }

/* ─── 라인별 변동 (다이버징) ─── */
.diverge-wrap { padding: 6px 0; }
.diverge-axis { display: grid; grid-template-columns: 96px 1fr 1fr 60px; gap: 4px; font-size: 9px; color: var(--text-4); font-family: var(--font-mono); padding-bottom: 5px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.diverge-axis .c { text-align: center; }
.diverge-axis .r { text-align: right; }
.diverge-row { display: grid; grid-template-columns: 96px 1fr 1fr 60px; gap: 4px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--paper-2); font-size: 11px; }
.diverge-row:last-child { border-bottom: none; }
.diverge-name { font-weight: 600; color: var(--text); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.diverge-bar-left { display: flex; justify-content: flex-end; height: 16px; padding-right: 2px; }
.diverge-bar-right { display: flex; justify-content: flex-start; height: 16px; padding-left: 2px; border-left: 1.5px solid var(--line-2); }
.diverge-fill { height: 100%; min-width: 1px; }
.diverge-fill.neg { background: linear-gradient(90deg, var(--green-700), var(--green-500)); border-radius: 3px 0 0 3px; }
.diverge-fill.pos { background: linear-gradient(90deg, var(--red-500), var(--red-700)); border-radius: 0 3px 3px 0; }
.diverge-pct { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; font-size: 11px; }

/* ─── 라인별 멀티 스파크 ─── */
.linespark-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.linespark-card { background: white; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 12px; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }
.linespark-card:hover { border-color: var(--ink-300); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.linespark-info { flex: 1; min-width: 0; }
.linespark-name { font-size: 11px; font-weight: 700; color: var(--ink-900); }
.linespark-vals { font-size: 9px; color: var(--text-3); font-family: var(--font-mono); margin-top: 2px; }
.linespark-chart { flex-shrink: 0; }
.linespark-delta { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; min-width: 50px; text-align: right; }

/* ─── 애니메이션 ─── */
@keyframes drawLine { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
@keyframes floatUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes growUp { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
@keyframes fillW { from { width: 0 !important; } }

/* ─── 접이식 더보기 블록 ─── */
.more-block { margin-top: 14px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: white; transition: border-color 0.2s; }
.more-block[open] { border-color: var(--line-2); }
.more-summary { display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ink-900); list-style: none; user-select: none; transition: background 0.15s; }
.more-summary::-webkit-details-marker { display: none; }
.more-summary:hover { background: var(--paper); }
.more-icon { width: 24px; height: 24px; border-radius: 6px; background: var(--ink-100); color: var(--ink-700); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.more-icon svg { width: 13px; height: 13px; }
.more-meta { font-size: 10px; color: var(--text-4); font-weight: 400; font-family: var(--font-mono); margin-left: auto; }
.more-chevron { width: 16px; height: 16px; flex-shrink: 0; position: relative; transition: transform 0.25s; }
.more-chevron::before { content: ''; position: absolute; top: 4px; left: 4px; width: 7px; height: 7px; border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3); transform: rotate(45deg); }
.more-block[open] .more-chevron { transform: rotate(180deg); }
.more-content { padding: 4px 18px 18px; border-top: 1px solid var(--paper-2); animation: floatUp 0.4s ease-out; }

/* ─── 비교 모드 버튼 ─── */
.cmp-mode { display: inline-flex; background: var(--paper-2); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.cmp-btn { padding: 5px 11px; border: none; background: transparent; border-radius: 5px; font-size: 11px; font-weight: 600; color: var(--text-3); cursor: pointer; transition: all 0.15s; }
.cmp-btn:hover { color: var(--text); background: rgba(255,255,255,0.6); }
.cmp-btn.active { background: white; color: var(--ink-700); box-shadow: 0 1px 2px rgba(15,23,42,0.08); }

/* ─── 백업 리마인더 토스트 ─── */
.backup-toast { position: fixed; bottom: 24px; right: 24px; max-width: 380px; background: white; border: 1px solid var(--line-2); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 14px 16px; display: none; align-items: flex-start; gap: 12px; z-index: 200; animation: toastIn 0.4s cubic-bezier(0.16,1,0.3,1); }
.backup-toast.show { display: flex; }
.backup-toast-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--amber-100); color: var(--amber-700); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.backup-toast-icon svg { width: 18px; height: 18px; }
.backup-toast-body { flex: 1; min-width: 0; }
.backup-toast-title { font-size: 13px; font-weight: 700; color: var(--ink-900); margin-bottom: 2px; }
.backup-toast-text { font-size: 11px; color: var(--text-2); line-height: 1.5; }
.backup-toast-btn { padding: 7px 12px; background: var(--ink-700); color: white; border: none; border-radius: var(--radius-sm); font-size: 11px; font-weight: 600; cursor: pointer; flex-shrink: 0; align-self: center; }
.backup-toast-btn:hover { background: var(--ink-800); }
.backup-toast-close { background: none; border: none; padding: 2px; cursor: pointer; color: var(--text-4); flex-shrink: 0; }
.backup-toast-close:hover { color: var(--text); }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* ─── 라인별 단가 차트 ─── */
.lp-wrap { padding: 8px 0; }
.lp-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.lp-stat { background: linear-gradient(180deg, var(--ink-50), white); border: 1px solid var(--ink-100); border-radius: var(--radius); padding: 12px 16px; }
.lp-stat-label { font-size: 10px; color: var(--text-3); font-weight: 500; }
.lp-stat-val { font-size: 22px; font-weight: 800; color: var(--ink-700); margin: 4px 0 2px; letter-spacing: -0.02em; }
.lp-stat-sub { font-size: 10px; color: var(--text-4); font-family: var(--font-mono); }
.lp-legend { display: flex; gap: 16px; justify-content: flex-end; margin-bottom: 10px; font-size: 10px; color: var(--text-3); }
.lp-legend-item { display: flex; align-items: center; gap: 5px; }
.lp-dot { width: 10px; height: 10px; border-radius: 2px; }
.lp-dot.cur { background: var(--ink-600); }
.lp-dot.old { background: var(--ink-200); }
.lp-list { display: flex; flex-direction: column; gap: 2px; }
.lp-row { display: grid; grid-template-columns: 96px 1fr 56px 56px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--paper-2); }
.lp-row:last-child { border-bottom: none; }
.lp-name { font-size: 11px; font-weight: 700; color: var(--ink-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lp-bars { position: relative; }
.lp-bar-wrap { position: relative; height: 22px; display: flex; align-items: center; }
.lp-bar-old { position: absolute; height: 22px; background: var(--ink-200); border-radius: 4px; top: 0; opacity: 0.7; }
.lp-bar-cur { position: relative; height: 22px; background: linear-gradient(90deg, var(--ink-500), var(--ink-700)); border-radius: 4px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; z-index: 1; min-width: 40px; }
.lp-bar-val { font-size: 10px; color: white; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lp-old-label { font-size: 8px; color: var(--text-4); margin-top: 2px; font-family: var(--font-mono); }

<script>
const THRESHOLD = 0.03;

// 브랜드코드(자재코드 앞5자리) → 브랜드명 매핑
const CODE2BRAND = {"12002": "헤라", "11064": "프리메라", "11141": "려", "76600": "아.트루싱크", "21141": "려", "11131": "미쟝센", "76620": "아.그린티액", "11003": "라보에이치", "11104": "롱테이크", "11129": "해피바스", "13117": "화산송이", "31005": "메디안", "11148": "에이피", "11190": "홀리추얼", "11124": "설화수", "11198": "라네즈", "11127": "일리윤", "76700": "아윤채", "15010": "에스트라", "11165": "한율", "11196": "라네즈", "11073": "모이스처", "27028": "라네즈", "13119": "그린티아미노", "23117": "그린티", "11157": "헤라", "11113": "아이오페", "27032": "설화수", "11117": "설화수", "11143": "아이오페", "11302": "COSRX", "11065": "마몽드", "11138": "AP", "17777": "바이비레디", "11197": "라네즈", "13000": "국립중앙박물", "11070": "마몽드", "23119": "그린티", "61112": "세라마이드", "27165": "한율", "76720": "아윤채"};
function getBrand(code, name) {
  code = (code || '').toString();
  if (code.length >= 5 && CODE2BRAND[code.slice(0, 5)]) return CODE2BRAND[code.slice(0, 5)];
  // 폴백: 자재내역에서 추출
  let n = (name || '').replace(/^\([^)]*\)\s*/, '').replace(/^[A-Z]+\.\s*/, '').replace(/^\([^)]*\)\s*/, '').trim();
  const parts = n.split(/\s+/);
  if (parts.length && parts[0] && !/^\d+$/.test(parts[0])) return parts[0].slice(0, 6);
  return '기타';
}
document.getElementById('todayDate').textContent = new Date().toISOString().slice(0, 10);

const dz = document.getElementById('dropzone');
const fi = document.getElementById('fileInput');
dz.addEventListener('click', () => fi.click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
fi.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  const r = new FileReader();
  r.onload = ev => {
    try { const wb = XLSX.read(ev.target.result, { type: 'array' }); const p = parseClosing(wb, file.name); if (p) { saveMonth(p); renderUI(p.ym); showFileResult(p); showBackupToast(p.ym); } }
    catch (err) { document.getElementById('fileResult').innerHTML = `<div class="file-result err">⚠ 실패: ${err.message}</div>`; }
  };
  r.readAsArrayBuffer(file);
}

function parseClosing(wb, filename) {
  const m = filename.match(/(\d{2})년[_\s-]*(\d{1,2})월/);
  if (!m) { document.getElementById('fileResult').innerHTML = `<div class="file-result err">⚠ 파일명에 "26년_08월" 형식 필요</div>`; return null; }
  const ym = `20${m[1]}-${m[2].padStart(2, '0')}`;
  const src = filename.includes('데일리뷰티') ? '데일리뷰티' : 'AP';
  const result = { ym, src, file: filename };
  if (!wb.SheetNames.includes('마감액')) { document.getElementById('fileResult').innerHTML = `<div class="file-result err">⚠ "마감액" 시트 없음</div>`; return null; }
  const aRows = XLSX.utils.sheet_to_json(wb.Sheets['마감액'], { header: 1, defval: null });
  let pl=0,pe=0,pi=0,bl=0,be=0,bi=0,curCat=null;
  for (const r of aRows) {
    if (!r) continue;
    const cat = (r[1] || '').toString().trim();
    const sub = (r[2] || '').toString().trim();
    const amt = typeof r[3] === 'number' ? r[3] : 0;
    if (cat === '생산도급' || cat === '업무도급') curCat = cat;
    if (curCat === '생산도급') { if (sub.includes('용역') || sub === '노무비') pl += amt; else if (sub.includes('추가비')) pe += amt; else if (sub.includes('인센티브')) pi += amt; }
    else if (curCat === '업무도급') { if (sub.includes('용역') || sub.startsWith('노무비')) bl += amt; else if (sub.includes('추가비')) be += amt; else if (sub.includes('인센티브')) bi += amt; }
  }
  result.prod_labor=pl; result.prod_extra=pe; result.prod_inc=pi; result.bus_labor=bl; result.bus_extra=be; result.bus_inc=bi;
  result.total = pl + pe + pi + bl + be + bi;
  result.lines = {};
  result.linePrices = {};  // 라인별 단가 (수량 가중평균)
  result.lineBrands = {};  // 라인별 브랜드 분해
  if (wb.SheetNames.includes('생산도급')) {
    const pRows = XLSX.utils.sheet_to_json(wb.Sheets['생산도급'], { header: 1, defval: null });
    // ★ 헤더 자동 감지 — 양식(AP/데일리뷰티)마다 컬럼 위치가 달라서 헤더 이름으로 찾음
    let cols = null, headerRow = 0;
    for (let i = 0; i < Math.min(4, pRows.length); i++) {
      const r = pRows[i];
      if (r && r.some(c => c && c.toString().includes('라인명'))) {
        cols = {};
        r.forEach((c, idx) => {
          if (!c) return;
          const v = c.toString().trim();
          if (v === '라인명') cols.line = idx;
          else if (v === '자재코드') cols.code = idx;
          else if (v === '자재내역') cols.name = idx;
          else if (v === '확정수량') cols.qty = idx;
          else if (v === '가격') cols.price = idx;
          else if (v === '정산금액') cols.amt = idx;
          else if (v.includes('기존단가')) cols.old = idx;
        });
        headerRow = i;
        break;
      }
    }
    // 헤더 못 찾으면 AP 기본값으로 폴백
    if (!cols || cols.line === undefined) cols = { line: 9, code: 5, name: 6, qty: 7, price: 11, amt: 12, old: 13 };

    const acc = {};
    const lineBrand = {};
    for (let i = headerRow + 1; i < pRows.length; i++) {
      const r = pRows[i]; if (!r) continue;
      const line = (r[cols.line] || '').toString().trim();
      const code = cols.code !== undefined ? (r[cols.code] || '').toString() : '';
      const name = cols.name !== undefined ? (r[cols.name] || '').toString().trim() : '';
      const qty = typeof r[cols.qty] === 'number' ? r[cols.qty] : 0;
      const price = cols.price !== undefined && typeof r[cols.price] === 'number' ? r[cols.price] : 0;
      const amt = typeof r[cols.amt] === 'number' ? r[cols.amt] : 0;
      const oldPrice = cols.old !== undefined && typeof r[cols.old] === 'number' ? r[cols.old] : 0;
      if (line && amt) result.lines[line] = (result.lines[line] || 0) + amt;
      if (line && qty > 0 && price > 0) {
        if (!acc[line]) acc[line] = { qty: 0, priceSum: 0, oldSum: 0, amt: 0 };
        acc[line].qty += qty;
        acc[line].priceSum += price * qty;
        acc[line].oldSum += oldPrice * qty;
        acc[line].amt += amt;
      }
      // 브랜드 분해
      if (line && (qty > 0 || amt > 0)) {
        const brand = getBrand(code, name);
        if (!lineBrand[line]) lineBrand[line] = {};
        if (!lineBrand[line][brand]) lineBrand[line][brand] = { qty: 0, amt: 0 };
        lineBrand[line][brand].qty += qty;
        lineBrand[line][brand].amt += amt;
      }
    }
    for (const [line, d] of Object.entries(acc)) {
      if (d.qty > 0) {
        result.linePrices[line] = { price: d.priceSum / d.qty, oldPrice: d.oldSum > 0 ? d.oldSum / d.qty : 0, qty: d.qty, amt: d.amt };
      }
    }
    // 라인별 상위 6개 브랜드만
    for (const [line, brands] of Object.entries(lineBrand)) {
      const top = Object.entries(brands).sort((a, b) => b[1].amt - a[1].amt).slice(0, 6).filter(([_, v]) => v.amt > 0);
      result.lineBrands[line] = {};
      for (const [b, v] of top) result.lineBrands[line][b] = { qty: Math.round(v.qty), amt: Math.round(v.amt) };
    }
  }
  result.bus_items = {};
  if (wb.SheetNames.includes('업무도급')) {
    const bRows = XLSX.utils.sheet_to_json(wb.Sheets['업무도급'], { header: 1, defval: null });
    for (let i = 3; i < bRows.length; i++) { const r = bRows[i]; if (!r) continue; const item = (r[2] || '').toString().trim(); const unit = typeof r[3] === 'number' ? r[3] : 0; const qty = typeof r[4] === 'number' ? r[4] : 0; const cost = typeof r[5] === 'number' ? r[5] : 0; if (item && item !== '총계' && item !== '계' && (unit || qty || cost)) result.bus_items[item] = { unit, qty, cost }; }
  }
  return result;
}

function saveMonth(rec) { const arr = JSON.parse(localStorage.getItem('closingArchive') || '[]'); const idx = arr.findIndex(x => x.ym === rec.ym); if (idx >= 0) arr[idx] = rec; else arr.push(rec); arr.sort((a, b) => a.ym.localeCompare(b.ym)); localStorage.setItem('closingArchive', JSON.stringify(arr)); }
function loadArchive() { return JSON.parse(localStorage.getItem('closingArchive') || '[]'); }
function showFileResult(p) { document.getElementById('fileResult').innerHTML = `<div class="file-result ok"><strong>✓ ${p.ym} 처리 완료</strong> · ${p.src} · ${fmtM(p.total)} · 라인 ${Object.keys(p.lines).length}개 · 항목 ${Object.keys(p.bus_items).length}개</div>`; }

function fmtM(n) { if (!n) return '-'; if (Math.abs(n) >= 100000000) return (n / 100000000).toFixed(2) + '억'; return Math.round(n / 10000).toLocaleString() + '만'; }
function fmtKrw(n) { return Math.round(n).toLocaleString() + '원'; }
function fmtDelta(n) { return (n >= 0 ? '+' : '') + (n * 100).toFixed(1) + '%'; }
function arrow(n, t) { if (Math.abs(n) < t) return { cls: 'flat', sym: '─' }; return n > 0 ? { cls: 'up', sym: '▲' } : { cls: 'down', sym: '▼' }; }

function renderUI(ym) {
  const arr = loadArchive();
  if (arr.length === 0) { document.getElementById('report').classList.remove('active'); document.getElementById('toolbar').style.display = 'none'; return; }
  document.getElementById('toolbar').style.display = 'flex';
  renderMonthPills(arr, ym);
  const curr = arr.find(x => x.ym === ym) || arr[arr.length - 1];
  renderCompareControl(arr, curr.ym);
  const prev = resolveCompare(arr, curr);
  renderReport(curr, prev, arr);
}

// 비교 기준월 결정 (모드별)
function resolveCompare(arr, curr) {
  const mode = window._cmpMode || 'prev';
  const idx = arr.findIndex(x => x.ym === curr.ym);
  if (mode === 'prev') {
    return idx > 0 ? arr[idx - 1] : null;
  } else if (mode === 'yoy') {
    // 전년 동월
    const [y, m] = curr.ym.split('-');
    const target = `${parseInt(y) - 1}-${m}`;
    return arr.find(x => x.ym === target) || null;
  } else if (mode === 'custom') {
    const sel = document.getElementById('compareMonth').value;
    return sel ? arr.find(x => x.ym === sel) : (idx > 0 ? arr[idx - 1] : null);
  }
  return idx > 0 ? arr[idx - 1] : null;
}

function setCmpMode(mode) {
  window._cmpMode = mode;
  document.querySelectorAll('.cmp-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('compareMonth').style.display = mode === 'custom' ? 'inline-block' : 'none';

  const active = document.querySelector('.month-pill.active');

function renderCompareControl(arr, currYM) {
  const mode = window._cmpMode || 'prev';

  sel.style.display = mode === 'custom' ? 'inline-block' : 'none';
