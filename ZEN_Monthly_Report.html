function renderKPI(label, value, delta, trend, type, kind) {
  let trendHtml = '';
  if (delta !== null) { const a = arrow(delta, 0.03); trendHtml = `<div class="kpi-trend ${a.cls}">${a.sym} ${fmtDelta(delta)} <span class="vs">전월</span></div>`; }
  let values;
  if (type === 'total') values = trend.map(t => t.total);
  else if (type === 'prod') values = trend.map(t => t.prod_labor + t.prod_extra + t.prod_inc);
  else values = trend.map(t => t.bus_labor + t.bus_extra + t.bus_inc);
  return `<div class="kpi ${kind || ''} kpi-clickable" onclick="openKpiDrill('${type}')" style="cursor:pointer;"><div class="kpi-top"><span class="kpi-label">${label}</span><span class="kpi-more">›</span></div><p class="kpi-val">${value}</p>${trendHtml}<div class="kpi-spark">${renderSparkline(values, 80, 24)}</div></div>`;
}
function renderKPIAlertCount(n) { const cls = n > 0 ? 'alert' : 'good'; const trendHtml = n > 0 ? '<div class="kpi-trend up">⚠ 검토 필요 · 클릭</div>' : '<div class="kpi-trend down">✓ 안정 운영</div>'; const click = n > 0 ? 'onclick="openAlertDrill()" style="cursor:pointer;"' : ''; return `<div class="kpi ${cls} ${n > 0 ? 'kpi-clickable' : ''}" ${click}><div class="kpi-top"><span class="kpi-label">이상치 항목</span></div><p class="kpi-val">${n}<span class="unit">건</span></p>${trendHtml}</div>`; }
function renderSparkline(values, w, h) { if (values.length < 2) return ''; const max = Math.max(...values), min = Math.min(...values); const range = max - min || 1; const pts = values.map((v, i) => `${i / (values.length - 1) * w},${h - (v - min) / range * (h - 2) - 1}`).join(' '); return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="var(--ink-500)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`; }

function renderAreaChart(trend) {
  if (trend.length < 2) return '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:80px 0;">2개월 이상 누적 필요</p>';
  const W = 640, H = 220, padL = 50, padR = 20, padT = 24, padB = 36;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const totals = trend.map(t => t.total);
  const max = Math.max(...totals);
  const yMax = Math.ceil(max / 100000000) * 100000000;
  const stepX = trend.length > 1 ? chartW / (trend.length - 1) : 0;
  const prodPts = [], busPts = [];
  trend.forEach((t, i) => {
    const x = padL + i * stepX;
    const prod = t.prod_labor + t.prod_extra + t.prod_inc;
    const bus = t.bus_labor + t.bus_extra + t.bus_inc;
    prodPts.push({ x, y: padT + chartH - (prod / yMax * chartH), prod });
    busPts.push({ x, y: padT + chartH - ((prod + bus) / yMax * chartH), total: prod + bus });
  });
  const baseY = padT + chartH;
  const prodArea = `M${padL},${baseY} ` + prodPts.map(p => `L${p.x},${p.y}`).join(' ') + ` L${padL + chartW},${baseY} Z`;
  const busArea = `M${prodPts[0].x},${prodPts[0].y} ` + busPts.map(p => `L${p.x},${p.y}`).join(' ') + ' ' + prodPts.slice().reverse().map(p => `L${p.x},${p.y}`).join(' ') + ' Z';
  const yLines = [0,0.25,0.5,0.75,1].map(r => { const y = padT + chartH - r * chartH; return `<line x1="${padL}" y1="${y}" x2="${padL+chartW}" y2="${y}" stroke="#f4f3ee" stroke-width="1"/><text x="${padL-8}" y="${y+3}" font-size="9" fill="#a1a1aa" text-anchor="end" font-family="JetBrains Mono, monospace">${fmtM(yMax*r)}</text>`; }).join('');
  const xLabels = trend.map((t, i) => `<text x="${padL+i*stepX}" y="${baseY+20}" font-size="10" fill="#71717a" text-anchor="middle" font-family="JetBrains Mono, monospace">${t.ym.slice(2).replace('-', '/')}</text>`).join('');
  const dots = busPts.map((p, i) => { const isLast = i === busPts.length - 1; return `<circle class="${isLast ? 'glow-dot' : ''}" cx="${p.x}" cy="${p.y}" r="${isLast?5:3}" fill="${isLast?'#0c2340':'#2962a8'}" stroke="white" stroke-width="2"/>${isLast?`<text x="${p.x}" y="${p.y-10}" font-size="11" font-weight="700" fill="#0c2340" text-anchor="middle">${fmtM(p.total)}</text>`:''}`; }).join('');
  return `<div class="area-chart"><svg class="area-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="prodGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2962a8" stop-opacity="0.75"/><stop offset="100%" stop-color="#2962a8" stop-opacity="0.35"/></linearGradient><linearGradient id="busGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5b9133" stop-opacity="0.6"/><stop offset="100%" stop-color="#5b9133" stop-opacity="0.2"/></linearGradient></defs>${yLines}<path d="${prodArea}" fill="url(#prodGrad)"/><path d="${busArea}" fill="url(#busGrad)"/><polyline class="anim-line" points="${prodPts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#163b62" stroke-width="1.5" stroke-linejoin="round"/><polyline class="anim-line" points="${busPts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#2d6a32" stroke-width="1.5" stroke-linejoin="round"/>${dots}${xLabels}</svg><div class="area-legend"><div class="area-legend-item"><div class="area-legend-dot" style="background:#2962a8;opacity:0.7;"></div>생산도급</div><div class="area-legend-item"><div class="area-legend-dot" style="background:#5b9133;opacity:0.6;"></div>업무도급</div></div></div>`;
}

function renderAlertBars(alerts) {
  if (alerts.length === 0) return '<p style="font-size:12px;color:var(--green-700);text-align:center;padding:80px 0;line-height:1.7;">✓ 전월 대비 ±3% 이내<br><span style="font-size:11px;color:var(--text-3);">이상치 없음 · 안정 운영</span></p>';
  const maxPct = Math.max(...alerts.map(a => Math.abs(a.pct)));
  return `<div class="alert-bars">${alerts.map(a => { const w = Math.max(10, Math.abs(a.pct) / maxPct * 100); return `<div class="alert-bar-row"><div class="alert-bar-head"><div><span class="alert-bar-name">${a.name}</span><span class="alert-bar-cat">${a.cat}</span></div><span class="alert-bar-pct" style="color:${a.dir==='up'?'var(--red-700)':'var(--green-700)'};">${fmtDelta(a.pct)}</span></div><div class="alert-bar-track"><div class="alert-bar-fill ${a.dir}" style="width:${w}%;">${fmtDelta(a.pct)}</div></div><div class="alert-bar-flow">${fmtM(a.prev)} → ${fmtM(a.curr)}</div></div>`; }).join('')}</div>`;
}

function generateInsights(curr, prev, trend, alerts) {
  const ins = [];
  const year = curr.ym.slice(0, 4);
  const ytd = trend.filter(t => t.ym.startsWith(year) && t.ym <= curr.ym);
  const ytdTotal = ytd.reduce((s, t) => s + t.total, 0);
  ins.push({ tag: 'YTD', title: `${year}년 누적 마감액`, value: fmtM(ytdTotal), text: `${ytd.length}개월 누적. 월 평균 <strong>${fmtM(ytdTotal / ytd.length)}</strong>.` });
  if (trend.length >= 3) {
    const n = trend.length, xs = trend.map((_, i) => i), ys = trend.map(t => t.total);
    const meanX = xs.reduce((s, x) => s + x, 0) / n;
    const meanY = ys.reduce((s, y) => s + y, 0) / n;
    const slope = xs.reduce((s, x, i) => s + (x - meanX) * (ys[i] - meanY), 0) / xs.reduce((s, x) => s + (x - meanX) ** 2, 0);
    const nextPred = meanY + slope * n;
    const trendDir = slope > meanY * 0.01 ? '상승' : slope < -meanY * 0.01 ? '하락' : '안정';
    const trendColor = trendDir === '상승' ? 'var(--red-700)' : trendDir === '하락' ? 'var(--green-700)' : 'var(--text-3)';
    ins.push({ tag: 'TREND', title: '다음 달 예상 마감액', value: fmtM(nextPred), text: `${n}개월 회귀 기반 예측. 흐름: <strong style="color:${trendColor};">${trendDir}</strong>.` });
  } else {
    ins.push({ tag: 'TREND', title: '추세 분석', text: '3개월 이상 누적 시 예측 가능.' });
  }
  const unitAlerts = alerts.filter(a => a.cat === '단가');
  if (unitAlerts.length > 0) {
    ins.push({ tag: 'PRICE', title: `단가 변동 ${unitAlerts.length}건`, value: fmtDelta(unitAlerts[0].pct), text: `<strong>${unitAlerts[0].name}</strong> 변동. BY27 협상 근거 누적 필요.` });
  } else {
    const top = alerts[0];
    if (top) ins.push({ tag: 'WATCH', title: '최대 변동 항목', value: fmtDelta(top.pct), text: `<strong>${top.name}</strong> (${top.cat}). 검토 필요.` });
    else ins.push({ tag: 'STABLE', title: '운영 상태', value: '안정', text: `전월 대비 ±3% 이내. 모든 항목 정상.` });
  }
  return ins;
}

function renderWaterfall(curr, prev) {
  if (!prev) return '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:60px 0;">전월 데이터 없음 · 비교 불가</p>';

  // ★ 라인별 증감 계산
  const allLines = new Set([...Object.keys(curr.lines || {}), ...Object.keys(prev.lines || {})]);
  const lineChanges = [];
  for (const line of allLines) {
    const c = (curr.lines || {})[line] || 0;
    const p = (prev.lines || {})[line] || 0;
    const delta = c - p;
    if (Math.abs(delta) > 100000) lineChanges.push({ line, c, p, delta });
  }
  lineChanges.sort((a, b) => b.delta - a.delta);

  // 증가 TOP5 + 감소 TOP5 + 나머지는 '기타'로 묶기
  const ups = lineChanges.filter(x => x.delta > 0);
  const downs = lineChanges.filter(x => x.delta < 0);
  const topUps = ups.slice(0, 5);
  const topDowns = downs.slice(-5);
  const otherUpDelta = ups.slice(5).reduce((s, x) => s + x.delta, 0);
  const otherDownDelta = downs.slice(0, -5).reduce((s, x) => s + x.delta, 0);
  const otherDelta = otherUpDelta + otherDownDelta;

  // 워터폴 스텝: 전월총 → 증가라인들 → 감소라인들 → 기타 → 당월총
  const steps = [{ label: prev.ym, sub: '전월 총액', type: 'total', cum: prev.total }];
  let cum = prev.total;
  for (const u of topUps) { steps.push({ label: u.line, type: 'delta', value: u.delta, start: cum, cum: cum + u.delta, line: u.line }); cum += u.delta; }
  for (const d of topDowns) { steps.push({ label: d.line, type: 'delta', value: d.delta, start: cum, cum: cum + d.delta, line: d.line }); cum += d.delta; }
  if (Math.abs(otherDelta) > 100000) { steps.push({ label: '기타', sub: `${ups.length + downs.length - 10}개 라인`, type: 'delta', value: otherDelta, start: cum, cum: cum + otherDelta }); cum += otherDelta; }
  steps.push({ label: curr.ym, sub: '당월 총액', type: 'total', cum: curr.total });

  const W = Math.max(900, steps.length * 80), H = 300, padL = 55, padR = 25, padT = 36, padB = 64;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const allVals = steps.map(s => s.cum).concat(steps.map(s => s.type === 'delta' ? s.start : s.cum));
  const maxV = Math.max(...allVals) * 1.05;
  const minV = Math.min(0, ...allVals);
  const range = maxV - minV || 1;
  const gap = chartW / steps.length;
  const barW = gap * 0.62;
  const yOf = v => padT + chartH - (v - minV) / range * chartH;

  let bars = '', connectors = '', labels = '';
  steps.forEach((s, i) => {
    const x = padL + i * gap + (gap - barW) / 2;
    let y, h, fill, clickable = '';
    if (s.type === 'total') {
      y = yOf(s.cum); h = yOf(minV) - y;
      fill = i === 0 ? 'var(--ink-400)' : 'var(--ink-700)';
    } else {
      const top = Math.max(s.start, s.cum), bot = Math.min(s.start, s.cum);
      y = yOf(top); h = yOf(bot) - yOf(top);
      fill = s.value >= 0 ? 'url(#wfUp)' : 'url(#wfDown)';
      if (s.line) clickable = `onclick="openWaterfallDrill('${s.line.replace(/'/g, "\\'")}')" style="cursor:pointer;"`;
    }
    bars += `<rect class="wf-bar" ${clickable} x="${x}" y="${y}" width="${barW}" height="${Math.max(h, 2)}" rx="2" fill="${fill}"><title>${s.label}${s.type === 'delta' ? ': ' + (s.value >= 0 ? '+' : '') + fmtM(s.value) : ': ' + fmtM(s.cum)}</title></rect>`;
    const vTxt = s.type === 'total' ? fmtM(s.cum) : (s.value >= 0 ? '+' : '') + fmtM(s.value);
    const vColor = s.type === 'total' ? 'var(--ink-800)' : (s.value >= 0 ? 'var(--red-700)' : 'var(--green-700)');
    labels += `<text class="wf-value" x="${x + barW / 2}" y="${y - 6}" text-anchor="middle" fill="${vColor}">${vTxt}</text>`;
    // 라인명 라벨 (회전)
    const lblColor = s.type === 'total' ? 'var(--ink-700)' : 'var(--text-2)';
    labels += `<text class="wf-name" x="${x + barW / 2}" y="${padT + chartH + 14}" text-anchor="end" fill="${lblColor}" transform="rotate(-35 ${x + barW / 2} ${padT + chartH + 14})" font-weight="${s.type === 'total' ? 700 : 500}">${s.label}</text>`;
    if (i < steps.length - 1) {
      const yc = yOf(s.cum);
      connectors += `<line class="wf-connector" x1="${x + barW}" y1="${yc}" x2="${padL + (i + 1) * gap + (gap - barW) / 2}" y2="${yc}"/>`;
    }
  });

  const netDelta = curr.total - prev.total;
  return `
    <div class="wf-caption">
      <span class="wf-cap-text">${prev.ym} <strong>${fmtM(prev.total)}</strong> → ${curr.ym} <strong>${fmtM(curr.total)}</strong></span>
      <span class="wf-cap-net" style="color:${netDelta >= 0 ? 'var(--red-700)' : 'var(--green-700)'};">순변동 ${netDelta >= 0 ? '+' : ''}${fmtM(netDelta)} (${fmtDelta(netDelta / prev.total)})</span>
    </div>
    <div class="wf-hint">💡 막대(라인) 클릭 → 브랜드별로 더 분해 · <span style="color:var(--red-700);">빨강=증가</span> / <span style="color:var(--green-700);">초록=감소</span></div>
    <div class="waterfall"><svg class="waterfall-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="wfUp" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4654c"/><stop offset="100%" stop-color="#a32d2d"/></linearGradient>
        <linearGradient id="wfDown" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5b9133"/><stop offset="100%" stop-color="#2d6a32"/></linearGradient>
      </defs>
      ${connectors}${bars}${labels}
    </svg></div>`;
}

// 워터폴 라인 막대 클릭 → 브랜드별 분해 드릴다운
window.openWaterfallDrill = function(line) {
  const s = window._currentState;
  if (!s) return;
  const { curr, prev } = s;
  const cb = (curr.lineBrands || {})[line] || {};
  const pb = (prev.lineBrands || {})[line] || {};
  const curAmt = (curr.lines || {})[line] || 0;
  const prevAmt = (prev.lines || {})[line] || 0;
  const lineDelta = curAmt - prevAmt;

  // 브랜드별 증감
  const allBrands = new Set([...Object.keys(cb), ...Object.keys(pb)]);
  const brandChanges = [];
  for (const b of allBrands) {
    const c = cb[b]?.amt || 0;
    const p = pb[b]?.amt || 0;
    brandChanges.push({ brand: b, c, p, delta: c - p });
  }
  brandChanges.sort((a, b) => b.delta - a.delta);

  const maxAbs = Math.max(...brandChanges.map(x => Math.abs(x.delta)), 1);
  let rows = '';
  for (const ch of brandChanges) {
    if (Math.abs(ch.delta) < 10000 && ch.c === 0) continue;
    const isPos = ch.delta >= 0;
    const w = Math.abs(ch.delta) / maxAbs * 100;
    rows += `<div class="wfd-row">
      <span class="wfd-brand">${ch.brand}</span>
      <div class="wfd-bar-zone">
        <div class="wfd-bar-neg">${!isPos ? `<div class="wfd-fill neg" style="width:${w}%;"></div>` : ''}</div>
        <div class="wfd-bar-pos">${isPos ? `<div class="wfd-fill pos" style="width:${w}%;"></div>` : ''}</div>
      </div>
      <span class="wfd-delta" style="color:${isPos ? 'var(--red-700)' : 'var(--green-700)'};">${isPos ? '+' : ''}${fmtM(ch.delta)}</span>
      <span class="wfd-flow">${fmtM(ch.p)} → ${fmtM(ch.c)}</span>
    </div>`;
  }
  if (!rows) rows = '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:20px;">브랜드 분해 데이터 없음</p>';

  const body = `
    <div class="wfd-head">
      <div class="wfd-title-row"><h2 class="wfd-line">${line}</h2><span class="wfd-month">${prev.ym} → ${curr.ym}</span></div>
      <div class="wfd-summary">
        <div class="wfd-sum-item"><span class="wfd-sum-label">전월</span><span class="wfd-sum-val">${fmtM(prevAmt)}</span></div>
        <div class="wfd-sum-arrow">→</div>
        <div class="wfd-sum-item"><span class="wfd-sum-label">당월</span><span class="wfd-sum-val">${fmtM(curAmt)}</span></div>
        <div class="wfd-sum-item"><span class="wfd-sum-label">변동</span><span class="wfd-sum-val" style="color:${lineDelta >= 0 ? 'var(--red-700)' : 'var(--green-700)'};">${lineDelta >= 0 ? '+' : ''}${fmtM(lineDelta)}</span></div>
      </div>
    </div>
    <div class="wfd-section-title">브랜드별 증감 분해</div>
    <div class="wfd-axis"><span>브랜드</span><span class="c">◀ 감소 / 증가 ▶</span><span class="r">증감액</span><span class="r">전월→당월</span></div>
    <div class="wfd-rows">${rows}</div>
    <p class="wfd-note">이 라인의 정산금액 변동이 <strong>어느 브랜드 생산 때문인지</strong> 보여줍니다. 브랜드별 물량 변화가 곧 비용 변화로 이어집니다.</p>
  `;
  document.getElementById('modalTitle').textContent = '워터폴 분해: ' + line;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalBg').classList.add('active');
  document.querySelector('.modal').style.maxWidth = '680px';
};

function renderDivergingLines(curr, prev) {
  if (!prev) return '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:30px 0;">전월 데이터 없음</p>';
  const allLines = new Set([...Object.keys(curr.lines || {}), ...Object.keys(prev.lines || {})]);
  const changes = [];
  for (const line of allLines) {
    const c = (curr.lines || {})[line] || 0;
    const p = (prev.lines || {})[line] || 0;
    if (p > 500000 && c > 0) {
      changes.push({ line, c, p, pct: (c - p) / p });
    }
  }
  changes.sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct));
  const top = changes.slice(0, 12);
  if (top.length === 0) return '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:30px 0;">변동 데이터 없음</p>';
  const maxPct = Math.max(...top.map(c => Math.abs(c.pct)));

  let html = '<div class="diverge-wrap"><div class="diverge-axis"><span>라인명</span><span class="r">◀ 감소</span><span>증가 ▶</span><span class="r">변동률</span></div>';
  for (const ch of top) {
    const w = Math.abs(ch.pct) / maxPct * 100;
    const isPos = ch.pct >= 0;
    html += `<div class="diverge-row">
      <span class="diverge-name" title="${ch.line}">${ch.line}</span>
      <div class="diverge-bar-left">${!isPos ? `<div class="diverge-fill neg" style="width:${w}%;animation:fillW 0.7s ease-out;"></div>` : ''}</div>
      <div class="diverge-bar-right">${isPos ? `<div class="diverge-fill pos" style="width:${w}%;animation:fillW 0.7s ease-out;"></div>` : ''}</div>
      <span class="diverge-pct" style="color:${isPos ? 'var(--red-700)' : 'var(--green-700)'};">${fmtDelta(ch.pct)}</span>
    </div>`;
  }
  html += '</div>';
  return html;
}

function renderLineSparks(trend) {
  const lineMap = {};
  for (const t of trend) for (const [line, amt] of Object.entries(t.lines || {})) lineMap[line] = (lineMap[line] || 0) + amt;
  const topLines = Object.entries(lineMap).sort((a, b) => b[1] - a[1]).slice(0, 6).map(x => x[0]);
  if (topLines.length === 0) return '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:20px 0;">데이터 없음</p>';

  let html = '<div class="linespark-grid">';
  for (const line of topLines) {
    const series = trend.map(t => (t.lines || {})[line] || 0);
    const nonZero = series.filter(v => v > 0);
    if (nonZero.length === 0) continue;
    const last = series[series.length - 1];
    const prevV = series.length > 1 ? series[series.length - 2] : 0;
    const delta = prevV > 0 ? (last - prevV) / prevV : 0;
    const max = Math.max(...series), min = Math.min(...nonZero);
    const W = 100, H = 32;
    const stepX = series.length > 1 ? W / (series.length - 1) : 0;
    const range = max - min || 1;
    const pts = series.map((v, i) => ({ x: i * stepX, y: v > 0 ? H - 3 - (v - min) / range * (H - 6) : H - 3, v }));
    const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
    const safeId = 'ls_' + line.replace(/[\s\/]/g, '_');
    let dCls = delta > 0.03 ? 'var(--red-700)' : delta < -0.03 ? 'var(--green-700)' : 'var(--text-3)';

    html += `<div class="linespark-card">
      <div class="linespark-info">
        <div class="linespark-name">${line}</div>
        <div class="linespark-vals">누적 ${fmtM(lineMap[line])} · 당월 ${fmtM(last)}</div>
      </div>
      <svg class="linespark-chart" width="${W}" height="${H}">
        <defs><linearGradient id="${safeId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2962a8" stop-opacity="0.25"/><stop offset="100%" stop-color="#2962a8" stop-opacity="0"/></linearGradient></defs>
        <path d="${path} L${W},${H} L0,${H} Z" fill="url(#${safeId})"/>
        <path d="${path}" fill="none" stroke="#2962a8" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${pts[pts.length-1].x}" cy="${pts[pts.length-1].y}" r="2.5" fill="#0c2340" stroke="white" stroke-width="1"/>
      </svg>
      <span class="linespark-delta" style="color:${dCls};">${prevV > 0 ? fmtDelta(delta) : '—'}</span>
    </div>`;
  }
  html += '</div>';
  return html;
}

function renderLineSummary(trend, curr, prev) {
  const lines = curr.lines || {};
  const lp = curr.linePrices || {};
  const lineCount = Object.keys(lines).length;
  if (lineCount === 0) return '';

  // 최고 정산 라인
  const topAmt = Object.entries(lines).sort((a, b) => b[1] - a[1])[0];
  // 최고 단가 라인
  const priceEntries = Object.entries(lp).filter(([_, d]) => d.price > 0);
  const topPrice = priceEntries.length ? priceEntries.sort((a, b) => b[1].price - a[1].price)[0] : null;
  // 평균 단가 (수량 가중)
  let totQty = 0, totPriceQty = 0;
  for (const [_, d] of priceEntries) { totQty += d.qty; totPriceQty += d.price * d.qty; }
  const avgPrice = totQty > 0 ? totPriceQty / totQty : 0;
  // 총 생산량
  const totalProd = priceEntries.reduce((s, [_, d]) => s + d.qty, 0);

  return `
    <div class="line-kpi-grid">
      <div class="line-kpi">
        <div class="line-kpi-icon" style="background:var(--ink-100);color:var(--ink-700);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></div>
        <div class="line-kpi-body"><div class="line-kpi-label">분석 라인 수</div><div class="line-kpi-val">${lineCount}<span class="u">개</span></div></div>
      </div>
      <div class="line-kpi">
        <div class="line-kpi-icon" style="background:#fdeeee;color:var(--red-700);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div>
        <div class="line-kpi-body"><div class="line-kpi-label">최고 정산 라인</div><div class="line-kpi-val" style="font-size:17px;">${topAmt[0]}</div><div class="line-kpi-sub">${fmtM(topAmt[1])}</div></div>
      </div>
      <div class="line-kpi">
        <div class="line-kpi-icon" style="background:var(--ink-100);color:var(--ink-700);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
        <div class="line-kpi-body"><div class="line-kpi-label">최고 단가 라인</div><div class="line-kpi-val" style="font-size:17px;">${topPrice ? topPrice[0] : '-'}</div><div class="line-kpi-sub">${topPrice ? topPrice[1].price.toFixed(1) + '원' : ''}</div></div>
      </div>
      <div class="line-kpi">
        <div class="line-kpi-icon" style="background:#eef5e6;color:var(--green-700);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg></div>
        <div class="line-kpi-body"><div class="line-kpi-label">평균 단가 / 총 물량</div><div class="line-kpi-val">${avgPrice.toFixed(1)}<span class="u">원</span></div><div class="line-kpi-sub">${(totalProd / 1000000).toFixed(2)}M개</div></div>
      </div>
    </div>
  `;
}

function renderLineCards(trend, curr, prev) {
  const lines = curr.lines || {};
  const lp = curr.linePrices || {};
  const prevLines = (prev && prev.lines) || {};
  const top = Object.entries(lines).sort((a, b) => b[1] - a[1]).slice(0, 9);
  if (top.length === 0) return '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:30px 0;">라인 데이터 없음</p>';

  let html = '<div class="line-card-grid">';
  for (const [line, amt] of top) {
    // 12개월 정산 추이
    const series = trend.map(t => (t.lines || {})[line] || 0);
    const prevAmt = prevLines[line] || 0;
    const delta = prevAmt > 0 ? (amt - prevAmt) / prevAmt : null;
    const price = lp[line] ? lp[line].price : 0;
    const qty = lp[line] ? lp[line].qty : 0;
    const oldPrice = lp[line] ? lp[line].oldPrice : 0;
    const priceRise = oldPrice > 0 ? (price - oldPrice) / oldPrice : null;

    // 스파크라인
    const W = 200, H = 40;
    const nonZero = series.filter(v => v > 0);
    const max = Math.max(...series), min = nonZero.length ? Math.min(...nonZero) : 0;
    const range = max - min || 1;
    const stepX = series.length > 1 ? W / (series.length - 1) : 0;
    const pts = series.map((v, i) => ({ x: i * stepX, y: v > 0 ? H - 4 - (v - min) / range * (H - 8) : H - 4, v }));
    const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
    const safeId = 'lc_' + line.replace(/[\s\/]/g, '_');

    const deltaColor = delta === null ? 'var(--text-4)' : delta > 0.03 ? 'var(--red-700)' : delta < -0.03 ? 'var(--green-700)' : 'var(--text-3)';
    const deltaText = delta === null ? '신규' : (delta >= 0 ? '+' : '') + (delta * 100).toFixed(1) + '%';

    html += `
      <div class="line-card" onclick="openLineDrill('${line.replace(/'/g, "\\'")}')" style="cursor:pointer;">
        <div class="line-card-head">
          <span class="line-card-name">${line}</span>
          <span class="line-card-delta" style="color:${deltaColor};">${deltaText}</span>
        </div>
        <div class="line-card-amt">${fmtM(amt)}</div>
        <svg class="line-card-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs><linearGradient id="${safeId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--ink-500)" stop-opacity="0.25"/><stop offset="100%" stop-color="var(--ink-500)" stop-opacity="0"/></linearGradient></defs>
          <path d="${path} L${W},${H} L0,${H} Z" fill="url(#${safeId})"/>
          <path class="anim-line" d="${path}" fill="none" stroke="var(--ink-600)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
          <circle class="glow-dot" cx="${pts[pts.length-1].x}" cy="${pts[pts.length-1].y}" r="2.5" fill="var(--ink-800)" stroke="white" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="line-card-foot">
          <div class="line-card-stat"><span class="lcs-label">단가</span><span class="lcs-val">${price > 0 ? price.toFixed(1) + '원' : '-'}</span>${priceRise !== null ? `<span class="lcs-rise" style="color:${priceRise > 0 ? 'var(--red-700)' : 'var(--green-700)'};">${priceRise >= 0 ? '+' : ''}${(priceRise * 100).toFixed(0)}%</span>` : ''}</div>
          <div class="line-card-stat"><span class="lcs-label">물량</span><span class="lcs-val">${qty > 0 ? (qty / 1000).toFixed(0) + 'K' : '-'}</span></div>
        </div>
        <div class="line-card-drill-hint">클릭 → 브랜드별 상세</div>
      </div>
    `;
  }
  html += '</div>';
  return html;
}

window.openLineDrill = function(line) {
  const s = window._currentState;
  if (!s) return;
  const { curr, prev, trend } = s;

  // 12개월 추이
  const amtSeries = trend.map(t => ({ ym: t.ym, v: (t.lines || {})[line] || 0 }));
  const priceSeries = trend.map(t => ({ ym: t.ym, v: (t.linePrices || {})[line]?.price || 0 }));
  const qtySeries = trend.map(t => ({ ym: t.ym, v: (t.linePrices || {})[line]?.qty || 0 }));

  const curAmt = (curr.lines || {})[line] || 0;
  const curLp = (curr.linePrices || {})[line] || {};
  const brands = (curr.lineBrands || {})[line] || {};

  // 미니 라인차트 헬퍼
  const miniChart = (series, color, fmt) => {
    const vals = series.map(x => x.v);
    const nonZero = vals.filter(v => v > 0);
    if (nonZero.length < 2) return '<div style="height:60px;display:flex;align-items:center;justify-content:center;color:var(--text-4);font-size:11px;">데이터 부족</div>';
    const max = Math.max(...vals), min = Math.min(...nonZero);
    const range = max - min || 1;
    const W = 280, H = 60;
    const stepX = vals.length > 1 ? W / (vals.length - 1) : 0;
    const pts = vals.map((v, i) => ({ x: i * stepX, y: v > 0 ? H - 6 - (v - min) / range * (H - 12) : H - 6 }));
    const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:60px;">
      <path d="${path} L${W},${H} L0,${H} Z" fill="${color}" fill-opacity="0.12"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      <circle cx="${pts[pts.length-1].x}" cy="${pts[pts.length-1].y}" r="3" fill="${color}" stroke="white" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    </svg>`;
  };

  // 브랜드 분해 막대
  const brandEntries = Object.entries(brands).sort((a, b) => b[1].amt - a[1].amt);
  const brandTotal = brandEntries.reduce((s, [_, v]) => s + v.amt, 0);
  const brandMax = brandEntries.length ? brandEntries[0][1].amt : 1;
  let brandHtml = '';
  if (brandEntries.length > 0) {
    brandHtml = brandEntries.map(([b, v]) => {
      const w = v.amt / brandMax * 100;
      const pct = brandTotal > 0 ? (v.amt / brandTotal * 100).toFixed(1) : 0;
      return `<div class="drill-brand-row">
        <span class="drill-brand-name">${b}</span>
        <div class="drill-brand-track"><div class="drill-brand-fill" style="width:${w}%;"></div></div>
        <span class="drill-brand-amt">${fmtM(v.amt)}</span>
        <span class="drill-brand-pct">${pct}%</span>
        <span class="drill-brand-qty">${(v.qty / 1000).toFixed(0)}K개</span>
      </div>`;
    }).join('');
  } else {
    brandHtml = '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:16px;">브랜드 분해 데이터 없음</p>';
  }

  // 월별 테이블
  let tableRows = '';
  for (let i = 0; i < trend.length; i++) {
    const t = trend[i];
    const a = (t.lines || {})[line] || 0;
    if (a === 0) continue;
    const lp = (t.linePrices || {})[line] || {};
    const pa = i > 0 ? (trend[i - 1].lines || {})[line] || 0 : 0;
    const d = pa > 0 ? (a - pa) / pa : null;
    tableRows += `<tr>
      <td class="dt-ym">${t.ym}</td>
      <td class="dt-num">${fmtM(a)}</td>
      <td class="dt-num">${lp.price ? lp.price.toFixed(1) + '원' : '-'}</td>
      <td class="dt-num">${lp.qty ? (lp.qty / 1000).toFixed(0) + 'K' : '-'}</td>
      <td class="dt-num" style="color:${d === null ? 'var(--text-4)' : d > 0.03 ? 'var(--red-700)' : d < -0.03 ? 'var(--green-700)' : 'var(--text-3)'};">${d === null ? '-' : (d >= 0 ? '+' : '') + (d * 100).toFixed(1) + '%'}</td>
    </tr>`;
  }

  const priceRise = curLp.oldPrice > 0 ? (curLp.price - curLp.oldPrice) / curLp.oldPrice : null;

  const body = `
    <div class="drill-head">
      <div class="drill-title-row">
        <h2 class="drill-line-name">${line}</h2>
        <span class="drill-month">${curr.ym} 기준</span>
      </div>
      <div class="drill-kpis">
        <div class="drill-kpi"><div class="dk-label">정산금액</div><div class="dk-val">${fmtM(curAmt)}</div></div>
        <div class="drill-kpi"><div class="dk-label">단가</div><div class="dk-val">${curLp.price ? curLp.price.toFixed(1) + '원' : '-'}</div>${priceRise !== null ? `<div class="dk-sub" style="color:${priceRise > 0 ? 'var(--red-700)' : 'var(--green-700)'};">${priceRise >= 0 ? '+' : ''}${(priceRise * 100).toFixed(1)}% (기존 ${curLp.oldPrice.toFixed(1)}원)</div>` : ''}</div>
        <div class="drill-kpi"><div class="dk-label">생산 물량</div><div class="dk-val">${curLp.qty ? (curLp.qty / 1000).toFixed(0) + 'K개' : '-'}</div></div>
      </div>
    </div>

    <div class="drill-section-title">${trend.length}개월 추이</div>
    <div class="drill-charts">
      <div class="drill-chart"><div class="dc-label">정산금액</div>${miniChart(amtSeries, 'var(--ink-600)')}</div>
      <div class="drill-chart"><div class="dc-label">단가</div>${miniChart(priceSeries, 'var(--green-700)')}</div>
      <div class="drill-chart"><div class="dc-label">물량</div>${miniChart(qtySeries, 'var(--amber-700)')}</div>
    </div>

    <div class="drill-section-title">브랜드별 생산 분해 (${curr.ym})</div>
    <div class="drill-brands">${brandHtml}</div>

    <div class="drill-section-title">월별 상세</div>
    <div class="drill-table-wrap">
      <table class="drill-table">
        <thead><tr><th>월</th><th>정산금액</th><th>단가</th><th>물량</th><th>전월비</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
  `;

  document.getElementById('modalTitle').textContent = '라인 상세: ' + line;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalBg').classList.add('active');
  // 모달 넓게
  document.querySelector('.modal').style.maxWidth = '760px';
};

// 업무도급 항목 클릭 → 상세 (단가·건수·비용 추이 + 월별 + 원인)
window.openBusDrill = function(item) {
  const s = window._currentState;
  if (!s) return;
  const { curr, prev, trend } = s;
  const cur = (curr.bus_items || {})[item];
  if (!cur) return;
  const pv = prev ? (prev.bus_items || {})[item] : null;
  const isFixed = cur.qty <= 1;

  const dColor = d => d === null ? 'var(--text-4)' : d > 0.03 ? 'var(--red-700)' : d < -0.03 ? 'var(--green-700)' : 'var(--text-3)';
  const dText = d => d === null ? '비교 불가' : (d >= 0 ? '+' : '') + (d * 100).toFixed(1) + '%';

  const unitDelta = pv && pv.unit > 0 ? (cur.unit - pv.unit) / pv.unit : null;
  const qtyDelta = pv && pv.qty > 0 ? (cur.qty - pv.qty) / pv.qty : null;
  const costDelta = pv && pv.cost > 0 ? (cur.cost - pv.cost) / pv.cost : null;

  const fmtUnit = u => u >= 10000 ? fmtM(u) : Math.round(u).toLocaleString() + '원';

  // 미니 추이 차트
  const miniChart = (getter, color, fmtLast) => {
    const series = trend.map(t => (t.bus_items || {})[item] ? getter((t.bus_items || {})[item]) : 0);
    const vals = series;
    const nonZero = vals.filter(v => v > 0);
    if (nonZero.length < 2) return '<div style="height:56px;display:flex;align-items:center;justify-content:center;color:var(--text-4);font-size:11px;">데이터 부족</div>';
    const max = Math.max(...vals), min = Math.min(...nonZero);
    const range = max - min || 1;
    const W = 260, H = 56;
    const stepX = vals.length > 1 ? W / (vals.length - 1) : 0;
    const pts = vals.map((v, i) => ({ x: i * stepX, y: v > 0 ? H - 6 - (v - min) / range * (H - 12) : H - 6 }));
    const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
    const lastV = vals[vals.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:56px;">
      <path d="${path} L${W},${H} L0,${H} Z" fill="${color}" fill-opacity="0.1"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      <circle cx="${pts[pts.length-1].x}" cy="${pts[pts.length-1].y}" r="3" fill="${color}" stroke="white" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    </svg>`;
  };

  // 월별 테이블
  let tableRows = '';
  for (let i = 0; i < trend.length; i++) {
    const t = trend[i];
    const bi = (t.bus_items || {})[item];
    if (!bi || (!bi.cost && !bi.qty)) continue;
    const pbi = i > 0 ? (trend[i - 1].bus_items || {})[item] : null;
    const cd = pbi && pbi.cost > 0 ? (bi.cost - pbi.cost) / pbi.cost : null;
    tableRows += `<tr>
      <td class="dt-ym">${t.ym}</td>
      <td class="dt-num">${fmtUnit(bi.unit)}</td>
      <td class="dt-num">${isFixed ? '-' : bi.qty.toLocaleString()}</td>
      <td class="dt-num">${fmtM(bi.cost)}</td>
      <td class="dt-num" style="color:${dColor(cd)};">${cd === null ? '-' : (cd >= 0 ? '+' : '') + (cd * 100).toFixed(1) + '%'}</td>
    </tr>`;
  }

  // 원인 해석 (비용 변동이 단가 때문인지 건수 때문인지)
  let causeNote = '';
  if (pv && costDelta !== null && !isFixed) {
    const uAbs = Math.abs(unitDelta || 0), qAbs = Math.abs(qtyDelta || 0);
    const driver = uAbs > qAbs ? '단가' : '건수';
    causeNote = `<p class="cd-note">전월 대비 비용 ${dText(costDelta)}. 단가 ${dText(unitDelta)}, 건수 ${dText(qtyDelta)} — <strong>${driver} 변화가 주요인</strong>.</p>`;
  } else if (isFixed) {
    causeNote = `<p class="cd-note">월 고정 비용(정액제) 항목. 건수와 무관하게 정액 계약되며, 단가 변동이 곧 비용 변동입니다.</p>`;
  }

  const body = `
    <div class="cd-head">
      <div class="cd-title-row"><h2 class="cd-line">${item}</h2><span class="cd-month">${curr.ym} · ${isFixed ? '정액제' : '건당'}</span></div>
      <div class="cd-kpis">
        <div class="cd-kpi"><div class="cd-kpi-label">단가</div><div class="cd-kpi-val">${fmtUnit(cur.unit)}</div><div class="cd-kpi-sub" style="color:${dColor(unitDelta)};">${pv ? '전월비 ' + dText(unitDelta) : ''}</div></div>
        ${!isFixed ? `<div class="cd-kpi"><div class="cd-kpi-label">건수</div><div class="cd-kpi-val">${cur.qty.toLocaleString()}</div><div class="cd-kpi-sub" style="color:${dColor(qtyDelta)};">${pv ? '전월비 ' + dText(qtyDelta) : ''}</div></div>` : ''}
        <div class="cd-kpi"><div class="cd-kpi-label">비용</div><div class="cd-kpi-val">${fmtM(cur.cost)}</div><div class="cd-kpi-sub" style="color:${dColor(costDelta)};">${pv ? '전월비 ' + dText(costDelta) : ''}</div></div>
      </div>
    </div>
    <div class="cd-section-title">${trend.length}개월 추이</div>
    <div class="drill-charts">
      <div class="drill-chart"><div class="dc-label">단가</div>${miniChart(b => b.unit, 'var(--ink-600)')}</div>
      ${!isFixed ? `<div class="drill-chart"><div class="dc-label">건수</div>${miniChart(b => b.qty, 'var(--amber-700)')}</div>` : ''}
      <div class="drill-chart"><div class="dc-label">비용</div>${miniChart(b => b.cost, 'var(--green-700)')}</div>
    </div>
    ${causeNote}
    <div class="cd-section-title">월별 상세</div>
    <div class="drill-table-wrap">
      <table class="drill-table">
        <thead><tr><th>월</th><th>단가</th><th>건수</th><th>비용</th><th>전월비</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
  `;
  document.getElementById('modalTitle').textContent = '업무도급 상세: ' + item;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalBg').classList.add('active');
  document.querySelector('.modal').style.maxWidth = '680px';
};

function renderBusAnalysis(trend, curr, prev) {
  const items = Object.keys(curr.bus_items || {});
  if (items.length === 0) return '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:30px 0;">업무도급 데이터 없음</p>';

  let html = '<div class="bus-grid">';
  for (const item of items) {
    const cur = curr.bus_items[item];
    const pv = prev ? (prev.bus_items || {})[item] : null;
    // 건수가 항상 1인 정액제 항목은 단가만, 나머지는 건수도
    const isFixed = cur.qty <= 1;

    // 추이 시리즈
    const unitSeries = trend.map(t => (t.bus_items || {})[item]?.unit || 0).filter(v => v > 0);
    const qtySeries = trend.map(t => (t.bus_items || {})[item]?.qty || 0);
    const costSeries = trend.map(t => (t.bus_items || {})[item]?.cost || 0);

    // 변동률
    const unitDelta = pv && pv.unit > 0 ? (cur.unit - pv.unit) / pv.unit : null;
    const qtyDelta = pv && pv.qty > 0 ? (cur.qty - pv.qty) / pv.qty : null;
    const costDelta = pv && pv.cost > 0 ? (cur.cost - pv.cost) / pv.cost : null;

    const dColor = d => d === null ? 'var(--text-4)' : d > 0.03 ? 'var(--red-700)' : d < -0.03 ? 'var(--green-700)' : 'var(--text-3)';
    const dText = d => d === null ? '—' : (d >= 0 ? '+' : '') + (d * 100).toFixed(1) + '%';

    // 건수 막대 차트 (월별)
    const qtyMax = Math.max(...qtySeries, 1);
    const qtyBars = trend.map((t, i) => {
      const q = qtySeries[i];
      const h = q / qtyMax * 100;
      const isLast = i === trend.length - 1;
      return `<div class="bus-qbar-col"><div class="bus-qbar ${isLast ? 'cur' : ''}" style="height:${h}%;" title="${t.ym}: ${q.toLocaleString()}건"></div></div>`;
    }).join('');

    html += `
      <div class="bus-card" onclick="openBusDrill('${item.replace(/'/g, "\\'")}')" style="cursor:pointer;">
        <div class="bus-card-head">
          <span class="bus-card-name">${item}</span>
          ${isFixed ? '<span class="bus-card-tag">정액</span>' : '<span class="bus-card-tag qty">건당</span>'}
        </div>
        <div class="bus-metrics">
          <div class="bus-metric">
            <span class="bus-metric-label">단가</span>
            <span class="bus-metric-val">${cur.unit >= 10000 ? fmtM(cur.unit) : Math.round(cur.unit).toLocaleString() + '원'}</span>
            <span class="bus-metric-delta" style="color:${dColor(unitDelta)};">${dText(unitDelta)}</span>
          </div>
          ${!isFixed ? `
          <div class="bus-metric">
            <span class="bus-metric-label">건수</span>
            <span class="bus-metric-val">${cur.qty.toLocaleString()}</span>
            <span class="bus-metric-delta" style="color:${dColor(qtyDelta)};">${dText(qtyDelta)}</span>
          </div>` : ''}
          <div class="bus-metric">
            <span class="bus-metric-label">비용</span>
            <span class="bus-metric-val">${fmtM(cur.cost)}</span>
            <span class="bus-metric-delta" style="color:${dColor(costDelta)};">${dText(costDelta)}</span>
          </div>
        </div>
        ${!isFixed ? `
        <div class="bus-qty-chart">
          <div class="bus-qty-label">월별 건수 추이</div>
          <div class="bus-qbar-row">${qtyBars}</div>
        </div>` : `
        <div class="bus-fixed-note">월 고정 비용 항목 (건수 변동 없음)</div>`}
        <div class="bus-card-drill-hint">클릭 → 항목 상세</div>
      </div>
    `;
  }
  html += '</div>';
  return html;
}

function renderScatter(curr) {
  const lp = curr.linePrices || {};
  const pts = Object.entries(lp).filter(([_, d]) => d.price > 0 && d.qty > 0).map(([line, d]) => ({ line, price: d.price, qty: d.qty, amt: d.amt }));
  if (pts.length < 3) return '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:40px 0;">산점도 표시에 충분한 데이터 없음</p>';

  const W = 880, H = 380, padL = 60, padR = 30, padT = 30, padB = 50;
  const chartW = W - padL - padR, chartH = H - padT - padB;

  const maxPrice = Math.max(...pts.map(p => p.price)) * 1.1;
  const maxQty = Math.max(...pts.map(p => p.qty)) * 1.1;
  const maxAmt = Math.max(...pts.map(p => p.amt));
  const avgPrice = pts.reduce((s, p) => s + p.price, 0) / pts.length;
  const avgQty = pts.reduce((s, p) => s + p.qty, 0) / pts.length;

  const xOf = v => padL + v / maxPrice * chartW;
  const yOf = v => padT + chartH - v / maxQty * chartH;
  const rOf = a => 5 + Math.sqrt(a / maxAmt) * 22;

  // 4분면 배경
  const cx = xOf(avgPrice), cy = yOf(avgQty);
  const quadrants = `
    <line x1="${cx}" y1="${padT}" x2="${cx}" y2="${padT + chartH}" stroke="var(--line-2)" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="${padL}" y1="${cy}" x2="${padL + chartW}" y2="${cy}" stroke="var(--line-2)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="${padL + chartW - 6}" y="${padT + 14}" font-size="9" fill="var(--red-700)" text-anchor="end" font-weight="600" opacity="0.6">고단가·고물량 (핵심)</text>
    <text x="${padL + 6}" y="${padT + 14}" font-size="9" fill="var(--ink-600)" text-anchor="start" font-weight="600" opacity="0.6">저단가·고물량</text>
    <text x="${padL + chartW - 6}" y="${padT + chartH - 6}" font-size="9" fill="var(--text-3)" text-anchor="end" font-weight="600" opacity="0.6">고단가·저물량</text>
    <text x="${padL + 6}" y="${padT + chartH - 6}" font-size="9" fill="var(--text-3)" text-anchor="start" font-weight="600" opacity="0.6">저단가·저물량</text>
  `;

  // 축
  const xTicks = [0, 0.25, 0.5, 0.75, 1].map(r => {
    const v = maxPrice * r, x = xOf(v);
    return `<text x="${x}" y="${padT + chartH + 18}" font-size="9" fill="var(--text-4)" text-anchor="middle" font-family="var(--font-mono)">${v.toFixed(0)}</text>`;
  }).join('');
  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(r => {
    const v = maxQty * r, y = yOf(v);
    return `<text x="${padL - 8}" y="${y + 3}" font-size="9" fill="var(--text-4)" text-anchor="end" font-family="var(--font-mono)">${(v / 1000).toFixed(0)}K</text>`;
  }).join('');

  // 버블 (큰 것부터 그려서 작은 게 위에)
  const sorted = pts.slice().sort((a, b) => b.amt - a.amt);
  const bubbles = sorted.map((p, i) => {
    const x = xOf(p.price), y = yOf(p.qty), r = rOf(p.amt);
    const isTop = i < 5;  // 상위 5개만 라벨
    return `
      <circle cx="${x}" cy="${y}" r="${r}" fill="var(--ink-500)" fill-opacity="0.25" stroke="var(--ink-600)" stroke-width="1.2" style="animation:floatUp 0.5s ease-out ${i * 0.03}s backwards;"/>
      ${isTop ? `<text x="${x}" y="${y - r - 4}" font-size="9" fill="var(--ink-800)" text-anchor="middle" font-weight="700">${p.line}</text>` : ''}
    `;
  }).join('');

  return `
    <div class="scatter-wrap">
      <svg class="scatter-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${quadrants}
        <line x1="${padL}" y1="${padT + chartH}" x2="${padL + chartW}" y2="${padT + chartH}" stroke="var(--line-2)" stroke-width="1.5"/>
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + chartH}" stroke="var(--line-2)" stroke-width="1.5"/>
        ${xTicks}${yTicks}
        <text x="${padL + chartW / 2}" y="${H - 6}" font-size="10" fill="var(--text-2)" text-anchor="middle" font-weight="600">단가 (원/개) →</text>
        <text x="16" y="${padT + chartH / 2}" font-size="10" fill="var(--text-2)" text-anchor="middle" font-weight="600" transform="rotate(-90 16 ${padT + chartH / 2})">물량 (개) →</text>
        ${bubbles}
      </svg>
      <div class="scatter-legend">버블 크기 = 정산금액 · 점선 = 평균선 (단가 ${avgPrice.toFixed(1)}원 / 물량 ${(avgQty/1000).toFixed(0)}K)</div>
    </div>
  `;
}

function renderLinePriceChart(curr, prev) {
  const lp = curr.linePrices || {};
  const entries = Object.entries(lp).filter(([_, d]) => d.price > 0).sort((a, b) => b[1].amt - a[1].amt).slice(0, 15);
  if (entries.length === 0) return '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:30px 0;">라인별 단가 데이터 없음 (생산도급 시트의 가격 컬럼 확인 필요)</p>';

  const prevLp = (prev && prev.linePrices) || {};
  // 비교 기준: 기존단가(oldPrice)가 있으면 그걸, 없으면 전월 단가
  const getCompare = (line, d) => {
    if (d.oldPrice > 0) return { base: d.oldPrice, label: '기존', mode: 'old' };
    if (prevLp[line] && prevLp[line].price > 0) return { base: prevLp[line].price, label: '전월', mode: 'prev' };
    return { base: 0, label: '', mode: 'none' };
  };
  // 비교 모드 판정 (대표값)
  const hasOld = entries.some(([_, d]) => d.oldPrice > 0);
  const compareLabel = hasOld ? '기존 단가 (25.04 이전)' : '전월 단가';

  const maxPrice = Math.max(...entries.map(([_, d]) => d.price));

  let bars = '<div class="lp-list">';
  for (const [line, d] of entries) {
    const cmp = getCompare(line, d);
    const curW = d.price / maxPrice * 100;
    const oldW = cmp.base > 0 ? cmp.base / maxPrice * 100 : 0;
    const rise = cmp.base > 0 ? (d.price - cmp.base) / cmp.base : null;
    const riseColor = rise === null ? 'var(--text-4)' : rise > 0.03 ? 'var(--red-700)' : rise < -0.03 ? 'var(--green-700)' : 'var(--text-3)';
    const riseText = rise === null ? '신규' : (rise >= 0 ? '+' : '') + (rise * 100).toFixed(1) + '%';
    bars += `
      <div class="lp-row">
        <div class="lp-name">${line}</div>
        <div class="lp-bars">
          <div class="lp-bar-wrap">
            ${cmp.base > 0 ? `<div class="lp-bar-old" style="width:${oldW}%;" title="${cmp.label} ${cmp.base.toFixed(2)}원"></div>` : ''}
            <div class="lp-bar-cur" style="width:${curW}%;animation:fillW 0.8s ease-out;"><span class="lp-bar-val">${d.price.toFixed(1)}원</span></div>
          </div>
          ${cmp.base > 0 ? `<div class="lp-old-label">${cmp.label} ${cmp.base.toFixed(1)}원</div>` : ''}
        </div>
        <div class="lp-rise" style="color:${riseColor};">${riseText}</div>
        <div class="lp-qty">${(d.qty / 1000).toFixed(0)}K개</div>
      </div>
    `;
  }
  bars += '</div>';

  // 요약 통계 (비교 기준 있는 라인만)
  const valid = entries.map(([line, d]) => ({ line, d, cmp: getCompare(line, d) })).filter(x => x.cmp.base > 0);
  let summary;
  if (valid.length > 0) {
    const avgRise = valid.reduce((s, x) => s + (x.d.price - x.cmp.base) / x.cmp.base, 0) / valid.length;
    const maxR = valid.slice().sort((a, b) => ((b.d.price - b.cmp.base) / b.cmp.base) - ((a.d.price - a.cmp.base) / a.cmp.base))[0];
    const maxRise = (maxR.d.price - maxR.cmp.base) / maxR.cmp.base;
    summary = `
      <div class="lp-summary">
        <div class="lp-stat"><div class="lp-stat-label">평균 단가 변동률</div><div class="lp-stat-val" style="color:${avgRise > 0 ? 'var(--red-700)' : 'var(--ink-700)'};">${avgRise >= 0 ? '+' : ''}${(avgRise * 100).toFixed(1)}%</div><div class="lp-stat-sub">${compareLabel} 대비</div></div>
        <div class="lp-stat"><div class="lp-stat-label">최대 변동 라인</div><div class="lp-stat-val" style="font-size:16px;">${maxR.line}</div><div class="lp-stat-sub" style="color:${maxRise > 0 ? 'var(--red-700)' : 'var(--green-700)'};">${maxRise >= 0 ? '+' : ''}${(maxRise * 100).toFixed(1)}%</div></div>
        <div class="lp-stat"><div class="lp-stat-label">분석 라인 수</div><div class="lp-stat-val">${entries.length}개</div><div class="lp-stat-sub">정산금액 TOP 15</div></div>
      </div>`;
  } else {
    // 비교 기준 전혀 없음 — 단가 수준만
    const avgPrice = entries.reduce((s, [_, d]) => s + d.price, 0) / entries.length;
    const maxP = entries.slice().sort((a, b) => b[1].price - a[1].price)[0];
    summary = `
      <div class="lp-summary">
        <div class="lp-stat"><div class="lp-stat-label">평균 단가</div><div class="lp-stat-val">${avgPrice.toFixed(1)}<span style="font-size:13px;color:var(--text-3);">원</span></div><div class="lp-stat-sub">TOP 15 라인</div></div>
        <div class="lp-stat"><div class="lp-stat-label">최고 단가 라인</div><div class="lp-stat-val" style="font-size:16px;">${maxP[0]}</div><div class="lp-stat-sub">${maxP[1].price.toFixed(1)}원</div></div>
        <div class="lp-stat"><div class="lp-stat-label">분석 라인 수</div><div class="lp-stat-val">${entries.length}개</div><div class="lp-stat-sub">비교 기준 없음</div></div>
      </div>`;
  }

  return `<div class="lp-wrap">${summary}<div class="lp-legend"><span class="lp-legend-item"><span class="lp-dot cur"></span>현재 단가</span>${valid.length > 0 ? `<span class="lp-legend-item"><span class="lp-dot old"></span>${compareLabel}</span>` : ''}</div>${bars}</div>`;
}

function renderHeatmap(trend) {
  const lineMap = {};
  for (const t of trend) for (const [line, amt] of Object.entries(t.lines || {})) lineMap[line] = (lineMap[line] || 0) + amt;
  const topLines = Object.entries(lineMap).sort((a, b) => b[1] - a[1]).slice(0, 15);
  if (topLines.length === 0) return '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:30px 0;">라인별 데이터 없음</p>';
  let allMax = 0;
  for (const t of trend) for (const v of Object.values(t.lines || {})) if (v > allMax) allMax = v;
  let html = '<div class="heatmap-wrap"><table class="heatmap"><thead><tr><th class="line-head">라인명</th>';
  for (const t of trend) html += `<th>${t.ym.slice(2).replace('-', '/')}</th>`;
  html += '<th>합계</th></tr></thead><tbody>';
  for (const [line, total] of topLines) {
    html += `<tr><td class="line-name">${line}</td>`;
    for (const t of trend) {
      const v = (t.lines || {})[line] || 0;
      const intensity = v > 0 ? Math.pow(v / allMax, 0.5) : 0;
      const bg = v > 0 ? `rgba(29,79,130,${(intensity * 0.9).toFixed(2)})` : 'var(--paper)';
      const color = intensity > 0.55 ? 'white' : 'var(--text)';
      const click = v > 0 ? `onclick="openCellDrill('${line.replace(/'/g, "\\'")}','${t.ym}')" style="background:${bg};color:${color};cursor:pointer;"` : `style="background:${bg};color:${color};"`;
      html += `<td class="cell ${v > 0 ? 'cell-clickable' : ''}" ${click}>${v ? fmtM(v) : '-'}</td>`;
    }
    html += `<td class="cell total-cell">${fmtM(total)}</td></tr>`;
  }
  html += '</tbody></table></div><div class="heatmap-hint">💡 셀(라인×월) 클릭 → 그 달 그 라인의 브랜드·단가·물량 세부 분석</div>';
  return html;
}

// 히트맵 셀 클릭 → 라인×월 세부 분석
window.openCellDrill = function(line, ym) {
  const s = window._currentState;
  if (!s) return;
  const { arr } = s;
  const idx = arr.findIndex(x => x.ym === ym);
  if (idx < 0) return;
  const month = arr[idx];
  const prevMonth = idx > 0 ? arr[idx - 1] : null;

  const amt = (month.lines || {})[line] || 0;
  const prevAmt = prevMonth ? (prevMonth.lines || {})[line] || 0 : 0;
  const delta = prevAmt > 0 ? (amt - prevAmt) / prevAmt : null;
  const lp = (month.linePrices || {})[line] || {};
  const prevLp = prevMonth ? (prevMonth.linePrices || {})[line] || {} : {};
  const priceDelta = prevLp.price > 0 && lp.price > 0 ? (lp.price - prevLp.price) / prevLp.price : null;
  const qtyDelta = prevLp.qty > 0 && lp.qty > 0 ? (lp.qty - prevLp.qty) / prevLp.qty : null;
  const brands = (month.lineBrands || {})[line] || {};

  // 브랜드 분해 막대
  const brandEntries = Object.entries(brands).sort((a, b) => b[1].amt - a[1].amt);
  const brandTotal = brandEntries.reduce((s, [_, v]) => s + v.amt, 0);
  const brandMax = brandEntries.length ? brandEntries[0][1].amt : 1;
  let brandHtml = brandEntries.length ? brandEntries.map(([b, v]) => {
    const w = v.amt / brandMax * 100;
    const pct = brandTotal > 0 ? (v.amt / brandTotal * 100).toFixed(1) : 0;
    return `<div class="cd-brand-row">
      <span class="cd-brand-name">${b}</span>
      <div class="cd-brand-track"><div class="cd-brand-fill" style="width:${w}%;"></div></div>
      <span class="cd-brand-amt">${fmtM(v.amt)}</span>
      <span class="cd-brand-pct">${pct}%</span>
      <span class="cd-brand-qty">${(v.qty / 1000).toFixed(0)}K개</span>
    </div>`;
  }).join('') : '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:16px;">브랜드 분해 데이터 없음</p>';

  const dColor = d => d === null ? 'var(--text-4)' : d > 0.03 ? 'var(--red-700)' : d < -0.03 ? 'var(--green-700)' : 'var(--text-3)';
  const dText = d => d === null ? '비교 불가' : (d >= 0 ? '+' : '') + (d * 100).toFixed(1) + '%';

  const body = `
    <div class="cd-head">
      <div class="cd-title-row"><h2 class="cd-line">${line}</h2><span class="cd-month">${ym}</span></div>
      <div class="cd-kpis">
        <div class="cd-kpi"><div class="cd-kpi-label">정산금액</div><div class="cd-kpi-val">${fmtM(amt)}</div><div class="cd-kpi-sub" style="color:${dColor(delta)};">${prevMonth ? '전월비 ' + dText(delta) : '첫 달'}</div></div>
        <div class="cd-kpi"><div class="cd-kpi-label">단가</div><div class="cd-kpi-val">${lp.price ? lp.price.toFixed(1) + '원' : '-'}</div><div class="cd-kpi-sub" style="color:${dColor(priceDelta)};">${priceDelta !== null ? '전월비 ' + dText(priceDelta) : ''}</div></div>
        <div class="cd-kpi"><div class="cd-kpi-label">물량</div><div class="cd-kpi-val">${lp.qty ? (lp.qty / 1000).toFixed(0) + 'K개' : '-'}</div><div class="cd-kpi-sub" style="color:${dColor(qtyDelta)};">${qtyDelta !== null ? '전월비 ' + dText(qtyDelta) : ''}</div></div>
      </div>
    </div>
    <div class="cd-section-title">브랜드별 생산 분해 (${ym})</div>
    <div class="cd-brands">${brandHtml}</div>
    ${prevMonth && delta !== null ? `<p class="cd-note">전월(${prevMonth.ym}) <strong>${fmtM(prevAmt)}</strong> → ${ym} <strong>${fmtM(amt)}</strong> (${dText(delta)}). ${qtyDelta !== null && priceDelta !== null ? `물량 ${dText(qtyDelta)}, 단가 ${dText(priceDelta)} — ${Math.abs(qtyDelta) > Math.abs(priceDelta) ? '<strong>물량 변화가 주요인</strong>' : '<strong>단가 변화가 주요인</strong>'}.` : ''}</p>` : ''}
  `;
  document.getElementById('modalTitle').textContent = '셀 분석: ' + line + ' · ' + ym;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalBg').classList.add('active');
  document.querySelector('.modal').style.maxWidth = '640px';
};

function renderUnitTrends(trend, curr, prev) {
  const items = Object.keys(curr.bus_items || {});
  if (items.length === 0) return '<p style="font-size:11px;color:var(--text-3);text-align:center;padding:30px 0;">업무도급 데이터 없음</p>';
  let html = '<div class="unit-grid">';
  for (const item of items) {
    const series = trend.map(t => (t.bus_items || {})[item]?.unit || 0).filter(v => v > 0);
    if (series.length === 0) continue;
    const currVal = curr.bus_items[item].unit;
    const prevVal = prev ? (prev.bus_items || {})[item]?.unit || 0 : 0;
    const delta = prevVal > 0 ? (currVal - prevVal) / prevVal : 0;
    const max = Math.max(...series), min = Math.min(...series);
    const avg = series.reduce((s, v) => s + v, 0) / series.length;
    const W = 250, H = 44;
    const stepX = series.length > 1 ? W / (series.length - 1) : 0;
    const range = max - min || 1;
    const points = series.map((v, i) => ({ x: i * stepX, y: H - 4 - (v - min) / range * (H - 8), v }));
    const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
    const safeId = item.replace(/[\s\/]/g, '_');
    let deltaCls = 'flat';
    if (Math.abs(delta) >= 0.03) deltaCls = delta > 0 ? 'up' : 'down';
    html += `<div class="unit-card"><div class="unit-head"><span class="unit-name">${item}</span><span class="unit-cat">UNIT</span></div><div class="unit-main"><span class="unit-curr">${Math.round(currVal).toLocaleString()}</span><span class="unit-curr-unit">원</span><span class="unit-delta ${deltaCls}">${prevVal > 0 ? fmtDelta(delta) : 'NEW'}</span></div><svg class="unit-mini-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="grad-${safeId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2962a8" stop-opacity="0.3"/><stop offset="100%" stop-color="#2962a8" stop-opacity="0"/></linearGradient></defs><path d="${path} L${W},${H} L0,${H} Z" fill="url(#grad-${safeId})"/><path d="${path}" fill="none" stroke="#2962a8" stroke-width="1.5" vector-effect="non-scaling-stroke"/>${points.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="${i === points.length - 1 ? 3 : 1.5}" fill="${i === points.length - 1 ? '#0c2340' : 'white'}" stroke="#2962a8" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}</svg><div class="unit-stats"><div class="unit-stat"><span class="v">${Math.round(min).toLocaleString()}</span>최저</div><div class="unit-stat"><span class="v">${Math.round(avg).toLocaleString()}</span>평균</div><div class="unit-stat"><span class="v">${Math.round(max).toLocaleString()}</span>최고</div></div></div>`;
  }
  html += '</div>';
  return html;
}

function detectAlerts(curr, prev) {
  if (!prev) return [];
  const alerts = [];
  const MIN_BASE = 1000000; // 비교 기준이 100만원 미만이면 % 왜곡 방지 위해 제외
  const cats = [['생산도급 노무비', curr.prod_labor, prev.prod_labor], ['생산도급 추가비', curr.prod_extra, prev.prod_extra], ['생산도급 인센티브', curr.prod_inc, prev.prod_inc], ['업무도급 노무비', curr.bus_labor, prev.bus_labor], ['업무도급 추가비', curr.bus_extra, prev.bus_extra]];
  for (const [name, c, p] of cats) { if (p >= MIN_BASE && c > 0) { const pct = (c - p) / p; if (Math.abs(pct) >= THRESHOLD) alerts.push({ cat: '마감', name, prev: p, curr: c, pct, dir: pct > 0 ? 'up' : 'down', mag: Math.abs(pct) }); } }
  const allLines = new Set([...Object.keys(curr.lines || {}), ...Object.keys(prev.lines || {})]);
  for (const line of allLines) { const c = (curr.lines || {})[line] || 0; const p = (prev.lines || {})[line] || 0; if (p > MIN_BASE && c > 0) { const pct = (c - p) / p; if (Math.abs(pct) >= THRESHOLD) alerts.push({ cat: '라인', name: line, prev: p, curr: c, pct, dir: pct > 0 ? 'up' : 'down', mag: Math.abs(pct) }); } }
  for (const item of Object.keys(curr.bus_items || {})) { const c = (curr.bus_items || {})[item]?.unit || 0; const p = (prev.bus_items || {})[item]?.unit || 0; if (p > 0 && c > 0) { const pct = (c - p) / p; if (Math.abs(pct) >= THRESHOLD) alerts.push({ cat: '단가', name: item, prev: p, curr: c, pct, dir: pct > 0 ? 'up' : 'down', mag: Math.abs(pct) }); } }
  return alerts.sort((a, b) => b.mag - a.mag);
}

// 이상치 KPI 클릭 → 전체 이상치 리스트
// KPI 카드 클릭 → 구성 분해
window.openKpiDrill = function(type) {
  const s = window._currentState;
  if (!s) return;
  const { curr, prev, trend, ytdTotal, ytd } = s;

  const dColor = d => d === null ? 'var(--text-4)' : d > 0.03 ? 'var(--red-700)' : d < -0.03 ? 'var(--green-700)' : 'var(--text-3)';
  const dText = d => d === null ? '-' : (d >= 0 ? '+' : '') + (d * 100).toFixed(1) + '%';
  const calcD = (c, p) => p > 0 ? (c - p) / p : null;

  let title, headVal, headDelta, components, extra = '';

  if (type === 'total') {
    const prodSum = curr.prod_labor + curr.prod_extra + curr.prod_inc;
    const busSum = curr.bus_labor + curr.bus_extra + curr.bus_inc;
    const pProd = prev ? prev.prod_labor + prev.prod_extra + prev.prod_inc : 0;
    const pBus = prev ? prev.bus_labor + prev.bus_extra + prev.bus_inc : 0;
    title = '총 마감액 구성';
    headVal = fmtM(curr.total);
    headDelta = prev ? calcD(curr.total, prev.total) : null;
    components = [
      { name: '생산도급', c: prodSum, p: pProd, color: 'var(--ink-600)' },
      { name: '업무도급', c: busSum, p: pBus, color: 'var(--green-600)' },
    ];
    // 누계 정보 - 선택 가능한 기간
    extra = `
      <div class="kd-section-title">누계 기간</div>
      <div class="cum-controls">
        <div class="cum-mode-btns">
          <button class="cum-mode-btn active" data-cmode="year" onclick="setCumMode('year')">연도별</button>
          <button class="cum-mode-btn" data-cmode="recent" onclick="setCumMode('recent')">최근 N개월</button>
          <button class="cum-mode-btn" data-cmode="custom" onclick="setCumMode('custom')">직접 지정</button>
        </div>
        <div class="cum-opts" id="cumOpts"></div>
      </div>
      <div class="cum-result" id="cumResult"></div>`;
  } else if (type === 'prod') {
    const sum = curr.prod_labor + curr.prod_extra + curr.prod_inc;
    const pSum = prev ? prev.prod_labor + prev.prod_extra + prev.prod_inc : 0;
    title = '생산도급 구성';
    headVal = fmtM(sum);
    headDelta = prev ? calcD(sum, pSum) : null;
    components = [
      { name: '노무비', c: curr.prod_labor, p: prev ? prev.prod_labor : 0, color: 'var(--ink-600)' },
      { name: '추가비', c: curr.prod_extra, p: prev ? prev.prod_extra : 0, color: 'var(--ink-400)' },
      { name: '인센티브', c: curr.prod_inc, p: prev ? prev.prod_inc : 0, color: 'var(--ink-300)' },
    ].filter(x => x.c > 0 || x.p > 0);
    // 라인 TOP5
    const topLines = Object.entries(curr.lines || {}).sort((a, b) => b[1] - a[1]).slice(0, 5);
    if (topLines.length) {
      extra = `<div class="kd-section-title">정산 상위 라인</div><div class="kd-line-list">` +
        topLines.map(([l, v]) => {
          const pv = prev ? (prev.lines || {})[l] || 0 : 0;
          const d = calcD(v, pv);
          return `<div class="kd-line-row"><span class="kd-line-name">${l}</span><span class="kd-line-amt">${fmtM(v)}</span><span class="kd-line-d" style="color:${dColor(d)};">${dText(d)}</span></div>`;
        }).join('') + '</div>';
    }
  } else {
    const sum = curr.bus_labor + curr.bus_extra + curr.bus_inc;
    const pSum = prev ? prev.bus_labor + prev.bus_extra + prev.bus_inc : 0;
    title = '업무도급 구성';
    headVal = fmtM(sum);
    headDelta = prev ? calcD(sum, pSum) : null;
    components = [
      { name: '노무비', c: curr.bus_labor, p: prev ? prev.bus_labor : 0, color: 'var(--green-600)' },
      { name: '추가비', c: curr.bus_extra, p: prev ? prev.bus_extra : 0, color: 'var(--green-500)' },
      { name: '인센티브', c: curr.bus_inc, p: prev ? prev.bus_inc : 0, color: 'var(--green-700)' },
    ].filter(x => x.c > 0 || x.p > 0);

    const items = Object.entries(curr.bus_items || {}).sort((a, b) => b[1].cost - a[1].cost).slice(0, 6);
    if (items.length) {
      extra = `<div class="kd-section-title">항목별 비용</div><div class="kd-line-list">` +
        items.map(([it, v]) => {

        }).join('') + '</div>';
    }
  }

  const total = components.reduce((s, c) => s + c.c, 0);
  // 구성 막대 (가로 누적)
  let stackBar = '<div class="kd-stack">';
  for (const c of components) {
    const pct = total > 0 ? c.c / total * 100 : 0;
    stackBar += `<div class="kd-stack-seg" style="width:${pct}%;background:${c.color};" title="${c.name} ${pct.toFixed(1)}%"></div>`;
  }
  stackBar += '</div>';

  // 구성 항목 리스트
  let compList = '<div class="kd-comp-list">';
  for (const c of components) {
    const pct = total > 0 ? (c.c / total * 100).toFixed(1) : 0;
    const d = prev ? calcD(c.c, c.p) : null;
    compList += `<div class="kd-comp-row">
      <span class="kd-comp-dot" style="background:${c.color};"></span>

      <span class="kd-comp-d" style="color:${dColor(d)};">${prev ? dText(d) : ''}</span>
    </div>`;
  }
  compList += '</div>';

  const body = `
    <div class="kd-head">
      <div class="kd-head-val">${headVal}</div>
      ${headDelta !== null ? `<div class="kd-head-delta" style="color:${dColor(headDelta)};">${headDelta >= 0 ? '▲' : '▼'} ${dText(headDelta)} <span style="color:var(--text-4);font-weight:400;">전월 대비</span></div>` : ''}
    </div>
    ${stackBar}
    ${compList}
    ${extra}

  document.getElementById('modalTitle').textContent = title + ' · ' + curr.ym;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalBg').classList.add('active');
  document.querySelector('.modal').style.maxWidth = '560px';

  if (type === 'total') { window._cumMode = window._cumMode || 'year'; setCumMode(window._cumMode); }
};

function setCumMode(mode) {
  window._cumMode = mode;
  document.querySelectorAll('.cum-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.cmode === mode));
  const opts = document.getElementById('cumOpts');
  if (!opts) return;
  const s = window._currentState;
  const arr = s.arr;
  const yms = arr.map(x => x.ym);
  const curYm = s.curr.ym;

  if (mode === 'year') {
    const years = [...new Set(arr.map(x => x.ym.slice(0, 4)))].sort();
    opts.innerHTML = years.map(y => `<button class="cum-opt-btn ${(window._cumYear || curYm.slice(0,4)) === y ? 'active' : ''}" onclick="setCumYear('${y}')">${y}년</button>`).join('');
    window._cumYear = window._cumYear || curYm.slice(0, 4);
    renderCumResult();
  } else if (mode === 'recent') {
    const opts3 = [3, 6, 12];
    opts.innerHTML = opts3.map(n => `<button class="cum-opt-btn ${(window._cumN || 6) === n ? 'active' : ''}" onclick="setCumN(${n})">최근 ${n}개월</button>`).join('');
    window._cumN = window._cumN || 6;
    renderCumResult();
  } else if (mode === 'custom') {
    const startSel = `<select id="cumStart" onchange="renderCumResult()">${yms.map(y => `<option value="${y}" ${y === (window._cumStart || yms[0]) ? 'selected' : ''}>${y}</option>`).join('')}</select>`;
    const endSel = `<select id="cumEnd" onchange="renderCumResult()">${yms.map(y => `<option value="${y}" ${y === (window._cumEnd || curYm) ? 'selected' : ''}>${y}</option>`).join('')}</select>`;
    opts.innerHTML = `<div class="cum-custom-row">${startSel} <span class="cum-tilde">~</span> ${endSel}</div>`;
    window._cumStart = window._cumStart || yms[0];
    window._cumEnd = window._cumEnd || curYm;
    renderCumResult();
  }
}
window.setCumMode = setCumMode;
window.setCumYear = function(y) { window._cumYear = y; document.querySelectorAll('#cumOpts .cum-opt-btn').forEach(b => b.classList.toggle('active', b.textContent === y + '년')); renderCumResult(); };
window.setCumN = function(n) { window._cumN = n; document.querySelectorAll('#cumOpts .cum-opt-btn').forEach(b => b.classList.toggle('active', b.textContent === '최근 ' + n + '개월')); renderCumResult(); };

function renderCumResult() {
  const el = document.getElementById('cumResult');
  if (!el) return;
  const s = window._currentState;
  const arr = s.arr;
  const mode = window._cumMode;
  let subset = [], label = '';

  if (mode === 'year') {
    const y = window._cumYear;
    subset = arr.filter(x => x.ym.startsWith(y));
    label = `${y}년 전체`;
  } else if (mode === 'recent') {
    const n = window._cumN;
    const idx = arr.findIndex(x => x.ym === s.curr.ym);
    const end = idx >= 0 ? idx : arr.length - 1;
    subset = arr.slice(Math.max(0, end - n + 1), end + 1);
    label = `최근 ${n}개월 (${subset.length ? subset[0].ym + '~' + subset[subset.length-1].ym : ''})`;
  } else if (mode === 'custom') {
    const st = document.getElementById('cumStart')?.value || window._cumStart;
    const en = document.getElementById('cumEnd')?.value || window._cumEnd;
    window._cumStart = st; window._cumEnd = en;
    const lo = st <= en ? st : en, hi = st <= en ? en : st;
    subset = arr.filter(x => x.ym >= lo && x.ym <= hi);
    label = `${lo} ~ ${hi}`;
  }

  if (subset.length === 0) { el.innerHTML = '<p style="font-size:11px;color:var(--text-3);padding:12px;text-align:center;">해당 기간 데이터 없음</p>'; return; }

  const sum = subset.reduce((a, b) => a + b.total, 0);
  const prodSum = subset.reduce((a, b) => a + b.prod_labor + b.prod_extra + b.prod_inc, 0);
  const busSum = subset.reduce((a, b) => a + b.bus_labor + b.bus_extra + b.bus_inc, 0);
  const avg = sum / subset.length;
  const maxM = subset.reduce((m, b) => b.total > m.total ? b : m, subset[0]);
  const minM = subset.reduce((m, b) => b.total < m.total ? b : m, subset[0]);

  el.innerHTML = `
    <div class="cum-label">${label} · <strong>${subset.length}개월</strong></div>
    <div class="cum-main">
      <div class="cum-big"><span class="cum-big-label">누계 마감액</span><span class="cum-big-val">${fmtM(sum)}</span></div>
      <div class="cum-big"><span class="cum-big-label">월 평균</span><span class="cum-big-val">${fmtM(avg)}</span></div>
    </div>
    <div class="cum-grid">
      <div class="cum-cell"><span class="cum-c-label">생산도급</span><span class="cum-c-val">${fmtM(prodSum)}</span><span class="cum-c-pct">${(prodSum/sum*100).toFixed(0)}%</span></div>
      <div class="cum-cell"><span class="cum-c-label">업무도급</span><span class="cum-c-val">${fmtM(busSum)}</span><span class="cum-c-pct">${(busSum/sum*100).toFixed(0)}%</span></div>
      <div class="cum-cell"><span class="cum-c-label">최대 월</span><span class="cum-c-val">${fmtM(maxM.total)}</span><span class="cum-c-pct">${maxM.ym.slice(2)}</span></div>
      <div class="cum-cell"><span class="cum-c-label">최소 월</span><span class="cum-c-val">${fmtM(minM.total)}</span><span class="cum-c-pct">${minM.ym.slice(2)}</span></div>
    </div>`;
}
window.renderCumResult = renderCumResult;

function calcKPIs(curr, prev) {
  if (!prev) return { totalDelta: null, prodDelta: null, busDelta: null };
  const cP = curr.prod_labor + curr.prod_extra + curr.prod_inc, pP = prev.prod_labor + prev.prod_extra + prev.prod_inc;
  const cB = curr.bus_labor + curr.bus_extra + curr.bus_inc, pB = prev.bus_labor + prev.bus_extra + prev.bus_inc;
  return { totalDelta: prev.total > 0 ? (curr.total - prev.total) / prev.total : null, prodDelta: pP > 0 ? (cP - pP) / pP : null, busDelta: pB > 0 ? (cB - pB) / pB : null };
}

function generateSummary(curr, prev, alerts, kpis, trend) {
  const parts = [];
  if (prev) { const d = kpis.totalDelta; if (Math.abs(d) >= 0.03) parts.push(`전월 대비 총 마감액 <strong>${fmtDelta(d)}</strong> ${d > 0 ? '증가' : '감소'} (${fmtM(prev.total)} → ${fmtM(curr.total)}).`); else parts.push(`전월 대비 총 마감액 변동 ${fmtDelta(d)}, <strong>안정 구간</strong> 유지.`); }
  else parts.push(`첫 데이터로 추세 비교 불가.`);
  if (alerts.length > 0) {
    const ups = alerts.filter(a => a.dir === 'up').length;
    parts.push(`이상치 <strong>${alerts.length}건</strong> 탐지 (증가 ${ups} / 감소 ${alerts.length - ups}). 최대 변동: <strong>${alerts[0].name}</strong> ${fmtDelta(alerts[0].pct)}.`);
    const ua = alerts.filter(a => a.cat === '단가');
    if (ua.length > 0) parts.push(`<strong>[주의]</strong> 업무도급 단가 변동 ${ua.length}건 — BY27 협상 근거 누적 필요.`);
  } else if (prev) parts.push(`전월 대비 ±3% 이내 모든 항목 <strong>정상 운영</strong>.`);
  return parts.join(' ');
}

}

  const s = window._currentState; if (!s) return;
  const lineAlerts = s.alerts.filter(a => a.cat === '라인' && a.dir === 'up').slice(0, 5);
  const txt = `[${s.curr.ym} 마감 결과 공유 및 조치 사항]

각 파트장님 안녕하세요.
${s.curr.ym} 마감 분석 결과를 공유드립니다.

■ 마감 결과 (요약)
- 총 마감액: ${fmtM(s.curr.total)}
- 전월 대비: ${s.kpis.totalDelta !== null ? fmtDelta(s.kpis.totalDelta) : 'N/A'}
- 생산도급 / 업무도급: ${fmtM(s.curr.prod_labor + s.curr.prod_extra + s.curr.prod_inc)} / ${fmtM(s.curr.bus_labor + s.curr.bus_extra + s.curr.bus_inc)}

■ 변동 큰 라인 (전월 대비 증가)
${lineAlerts.length > 0 ? lineAlerts.map((a, i) => `${i + 1}. ${a.name}: ${fmtM(a.prev)} → ${fmtM(a.curr)} (${fmtDelta(a.pct)})`).join('\n') : '- 해당 없음 (안정)'}

■ 파트장 확인 요청 사항

문의: 호두호두`;
  showModal(s.curr.ym + ' 현장 공지문', txt);

function genCSV() {
  const s = window._currentState; if (!s) return;
  let csv = '구분,항목,당월,전월,변동률(%)\n';
  csv += `마감,총 마감액,${s.curr.total},${s.prev ? s.prev.total : ''},${s.kpis.totalDelta !== null ? (s.kpis.totalDelta * 100).toFixed(2) : ''}\n`;
  csv += `마감,생산도급 노무비,${s.curr.prod_labor},${s.prev ? s.prev.prod_labor : ''},\n`;
  csv += `마감,생산도급 추가비,${s.curr.prod_extra},${s.prev ? s.prev.prod_extra : ''},\n`;
  csv += `마감,생산도급 인센티브,${s.curr.prod_inc},${s.prev ? s.prev.prod_inc : ''},\n`;
  csv += `마감,업무도급 노무비,${s.curr.bus_labor},${s.prev ? s.prev.bus_labor : ''},\n`;
  for (const [line, amt] of Object.entries(s.curr.lines || {})) { const pa = s.prev ? (s.prev.lines || {})[line] || 0 : 0; const pct = pa > 0 ? ((amt - pa) / pa * 100).toFixed(2) : ''; csv += `라인,${line},${amt},${pa},${pct}\n`; }
  for (const [item, v] of Object.entries(s.curr.bus_items || {})) { const pu = s.prev ? (s.prev.bus_items || {})[item]?.unit || 0 : 0; const pct = pu > 0 ? ((v.unit - pu) / pu * 100).toFixed(2) : ''; csv += `단가,${item}(단가),${v.unit},${pu},${pct}\n단가,${item}(건수),${v.qty},,\n`; }
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `${s.curr.ym}_마감분석.csv`; a.click();
}

function stripHtml(s) { return s.replace(/<[^>]+>/g, ''); }

function showModal(title, body) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = `<textarea readonly>${body}</textarea>`;
  document.getElementById('modalBg').classList.add('active');
}
function closeModal() { document.getElementById('modalBg').classList.remove('active'); const md = document.querySelector('.modal'); if (md) md.style.maxWidth = '640px'; }
function copyModal() { const ta = document.querySelector('#modalBody textarea'); ta.select(); document.execCommand('copy'); alert('복사됨'); }
document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });

// ═══ 백업 리마인더 ═══
function showBackupToast(ym) {
  const arr = loadArchive();
  const lastBackup = localStorage.getItem('lastBackupCount');
  const cnt = arr.length;
  const t = document.getElementById('backupToast');
  document.getElementById('backupToastTitle').textContent = `${ym} 추가 완료 · 백업 권장`;
  const since = lastBackup ? cnt - parseInt(lastBackup) : cnt;
  document.getElementById('backupToastText').innerHTML = `누적 <strong>${cnt}개월</strong> 데이터. ${since > 0 ? `백업 후 <strong>${since}개월</strong> 추가됨. ` : ''}브라우저 데이터는 초기화되면 사라져 — JSON 백업으로 안전하게.`;
  t.classList.add('show');
  // 12초 후 자동 숨김
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(hideBackupToast, 12000);
}
function hideBackupToast() { document.getElementById('backupToast').classList.remove('show'); }
window.hideBackupToast = hideBackupToast;

window.exportData = function() { const arr = loadArchive(); const blob = new Blob([JSON.stringify(arr, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '월마감_백업_' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); localStorage.setItem('lastBackupCount', arr.length); localStorage.setItem('lastBackupDate', new Date().toISOString().slice(0, 10)); };
window.clearAll = function() { if (!confirm('누적 데이터 전체 삭제. 진행?')) return; localStorage.removeItem('closingArchive'); document.getElementById('report').classList.remove('active'); document.getElementById('toolbar').style.display = 'none'; document.getElementById('fileResult').innerHTML = ''; };
document.getElementById('importInput').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => { try { const d = JSON.parse(ev.target.result); if (!Array.isArray(d)) throw new Error('형식 오류'); localStorage.setItem('closingArchive', JSON.stringify(d)); renderUI(d[d.length - 1].ym); alert(d.length + '건 복원'); } catch (err) { alert('실패: ' + err.message); } }; r.readAsText(f); });

window.renderUI = renderUI;
window._cmpMode = 'prev';
window.addEventListener('load', () => {
  const arr = loadArchive();
  if (arr.length > 0) {
    renderUI(arr[arr.length - 1].ym);
    // 백업한 지 데이터가 늘었으면 안내
    const lastBackup = localStorage.getItem('lastBackupCount');
    if (lastBackup && arr.length - parseInt(lastBackup) >= 2) {
      setTimeout(() => {
        const t = document.getElementById('backupToast');
        document.getElementById('backupToastTitle').textContent = '백업이 오래됐어';
        document.getElementById('backupToastText').innerHTML = `마지막 백업 이후 <strong>${arr.length - parseInt(lastBackup)}개월</strong> 추가됨. 지금 백업을 권장해.`;
        t.classList.add('show');
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(hideBackupToast, 12000);
      }, 1500);
    }
  }
});
</script>
