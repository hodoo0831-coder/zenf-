<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2438">
<meta name="description" content="APP_DESC">
<title>APP_TITLE</title>
<style>
/* ①  여기에 scripts/embed_fonts.py 결과(@font-face 2블록)를 붙여넣는다.
   ②  그 아래에 assets/base.css 를 통째로 붙여넣고 안 쓰는 블록을 지운다. */
</style>
</head>
<body>

<!-- ===== 로그인 (SSO 전) ===== -->
<div id="login">
  <div class="lg">
    <div class="lg-brand">
      <div class="lg-kicker">제니엘 AX T/F</div>
      <h1 class="lg-tit">APP_NAME<br><b>APP_SUB</b></h1>
      <p class="lg-sub">이 시스템이 무엇을 대신해 주는지 한두 문장으로.</p>
      <div class="lg-div"><span>이 시스템이 하지 않는 것</span></div>
      <div class="lg-not">경계를 먼저 못박으면 초기 문의가 줄어든다.</div>
    </div>
    <div class="lg-card">
      <h2>로그인</h2>
      <p class="d">SSO 연동 전 데모 화면입니다. 계정을 누르면 자동 입력됩니다.</p>
      <div class="fld"><label>아이디</label><input id="lg-id" placeholder="예: m01"></div>
      <div class="fld"><label>비밀번호</label><input id="lg-pw" type="password" placeholder="1234"></div>
      <div class="lg-err" id="lg-err"></div>
      <button class="btn-lg" onclick="doLogin()">로그인</button>
      <div class="lg-div"><span>역할별 데모 계정</span></div>
      <div id="lg-accts"></div>
    </div>
  </div>
</div>

<!-- ===== 앱 셸 ===== -->
<div id="app" class="hide">
  <header class="topbar">
    <button class="tb-menu" onclick="openDrawer()" aria-label="메뉴">☰</button>
    <div class="tb-logo"><b>APP_NAME</b><small>APP_ROMAN</small></div>
    <span class="tb-sp"></span>
    <div class="tb-av" id="tb-av"></div>
    <div class="tb-who"><b id="tb-nm"></b><small id="tb-rl"></small></div>
    <button class="tb-out" onclick="doLogout()">로그아웃</button>
  </header>

  <!-- 지금 무엇을 보고 있는지 — 앱에 맞게 항목을 바꾼다 -->
  <div class="ctxbar" id="ctxbar"></div>

  <div class="shell">
    <nav class="side" id="side"></nav>
    <main class="main" id="main"></main>
  </div>

  <nav id="tabbar"></nav>
  <div id="drawer"><div class="dim" onclick="closeDrawer()"></div><div class="pane" id="dw-pane"></div></div>
</div>
<div id="toast"></div>
<div id="modal"><div class="dim" onclick="closeModal()"></div><div class="mw" id="mw"></div></div>

<script>
/* ===================================================================
   1. 데이터 — 앱마다 바꾸는 부분
   =================================================================== */
var USERS = [
  {id:'w01', pw:'1234', role:'worker',  name:'박지수', color:'#6b7f95', pos:'현장 근로자'},
  {id:'m01', pw:'1234', role:'manager', name:'김태윤', color:'#47607a', pos:'현장관리자'},
  {id:'a01', pw:'1234', role:'admin',   name:'오현석', color:'#0f2438', pos:'시스템 관리자'}
];
var ROLE_N = {worker:'근로자', manager:'현장관리자', admin:'시스템관리자'};

/* 메뉴는 한 벌만 정의하고 사이드바·탭바·드로어가 같이 읽는다 */
var MENUS = {
  worker:  [{g:'내 정보'}, {id:'w-home', n:'내 요약'}, {id:'w-list', n:'내 내역'}],
  manager: [{g:'현장 운영'}, {id:'m-home', n:'현장 대시보드'}, {id:'m-list', n:'목록'},
            {g:'기준정보'}, {id:'m-base', n:'기준정보'}],
  admin:   [{g:'운영'}, {id:'a-home', n:'시스템 현황'}, {id:'a-base', n:'기준정보'}]
};
var TABBAR = {worker:['w-home','w-list'], manager:['m-home','m-list','m-base'], admin:['a-home','a-base']};

/* 화면 — 각 함수가 .main 안에 들어갈 HTML 문자열을 돌려준다 */
var VIEWS = {
  'w-home': function(){ return ph('근로자','내 요약','이 화면이 무엇을 대신해 주는지.') + demoCard(); },
  'w-list': function(){ return ph('근로자','내 내역','') + demoCard(); },
  'm-home': function(){ return ph('현장관리자','현장 대시보드','전 인원을 훑지 않습니다. 어긋난 건만 봅니다.') + demoTiles() + demoCard(); },
  'm-list': function(){ return ph('현장관리자','목록','') + judgeCard(); },
  'm-base': function(){ return ph('현장관리자','기준정보','') + demoCard(); },
  'a-home': function(){ return ph('시스템관리자','시스템 현황','') + demoTiles(); },
  'a-base': function(){ return ph('시스템관리자','기준정보','') + demoCard(); }
};

/* ===================================================================
   2. 셸 — 대부분의 앱에서 그대로 쓴다
   =================================================================== */
var CUR = null, VIEW = '';

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function $(id){ return document.getElementById(id); }

function ph(kicker, title, desc){
  return '<div class="ph"><div class="k">'+esc(kicker)+'</div><h1>'+esc(title)+'</h1>'+
         (desc ? '<p>'+desc+'</p>' : '')+'</div>';
}
function card(title, sub, body, noPad){
  return '<section class="card"><div class="card-h"><span class="card-t">'+esc(title)+'</span>'+
    (sub?'<span class="card-s">'+esc(sub)+'</span>':'')+'</div>'+
    '<div class="card-b'+(noPad?' np':'')+'">'+body+'</div></section>';
}
function tile(label, value, unit, desc, acc){
  return '<div class="tile'+(acc?' acc-'+acc:'')+'"><div class="tl">'+esc(label)+'</div>'+
    '<div class="tv">'+esc(value)+(unit?'<u>'+esc(unit)+'</u>':'')+'</div>'+
    (desc?'<div class="td">'+esc(desc)+'</div>':'')+'</div>';
}
function demoTiles(){ return '<div class="tiles">'+tile('대상 인원',9,'명','전원 정상')+
  tile('확인 필요',3,'건','아래에서 처리','e')+tile('처리 완료',12,'건','금일')+'</div>'; }
/* 판정 행 데모 — 점검·검수형 화면의 뼈대. ITEMS/JUDGE 를 앱에 맞게 바꾼다 */
var ITEMS = [
  {id:'i1', n:'비상정지 스위치 동작', d:'라인 정지까지 2초 이내'},
  {id:'i2', n:'방호덮개 체결',       d:'볼트 4본 전부'},
  {id:'i3', n:'바닥 유분 제거',      d:'통로·작업발판'}
];
var JUDGE = {};
function judgeCard(){
  var done = ITEMS.filter(function(i){ return JUDGE[i.id]; }).length;
  var ng   = ITEMS.filter(function(i){ return JUDGE[i.id]==='ng'; }).length;
  var rows = '<div class="jsum">판정 <b>'+done+'</b> / '+ITEMS.length+
             '<span>부적합 <b>'+ng+'</b></span><span>미판정 <b>'+(ITEMS.length-done)+'</b></span></div>';
  ITEMS.forEach(function(it){
    var v = JUDGE[it.id];
    rows += '<div class="jr'+(v==='ng'?' ng':'')+'">'+
      '<div class="jt">'+esc(it.n)+'<small>'+esc(it.d)+'</small></div>'+
      '<div class="jb">'+
        ['ok','ng','na'].map(function(k){
          var lbl={ok:'적합',ng:'부적합',na:'해당없음'}[k];
          return '<button class="'+(v===k?'on '+k:'')+'" onclick="setJudge(\''+it.id+'\',\''+k+'\')">'+lbl+'</button>';
        }).join('')+
      '</div></div>';
  });
  return card('점검 항목', done+' / '+ITEMS.length+' 판정', rows, true);
}
function setJudge(id, v){ JUDGE[id] = (JUDGE[id]===v ? null : v); go(VIEW); }

function demoCard(){ return card('카드 제목','보조 설명',
  '<p>여기에 내용이 들어갑니다.</p>'+
  '<div class="btns"><button class="btn pr" onclick="demoModal()">모달 열기</button></div>'); }
function demoModal(){ openModal('모달 제목',
  '<p>본문만 스크롤됩니다. 모바일에서는 아래에서 올라오는 시트로 붙습니다.</p>',
  '<button class="btn" onclick="closeModal()">닫기</button>'); }

function fillAcct(id){
  var u = USERS.filter(function(x){ return x.id===id; })[0];
  if(!u) return;
  $('lg-id').value=u.id; $('lg-pw').value=u.pw; doLogin();
}
function doLogin(){
  var id=$('lg-id').value.trim(), pw=$('lg-pw').value;
  var u = USERS.filter(function(x){ return x.id===id && x.pw===pw; })[0];
  if(!u){ $('lg-err').textContent='아이디 또는 비밀번호가 맞지 않습니다.'; return; }
  $('lg-err').textContent=''; CUR=u;
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('tb-av').textContent=u.name.charAt(0); $('tb-av').style.background=u.color;
  $('tb-nm').textContent=u.name; $('tb-rl').textContent=ROLE_N[u.role];
  renderNav(); renderCtx();
  var first = MENUS[u.role].filter(function(m){ return m.id; })[0];
  go(first.id);
}
function doLogout(){ CUR=null; $('app').classList.add('hide'); $('login').classList.remove('hide'); }

function renderNav(){
  var h='';
  MENUS[CUR.role].forEach(function(m){
    h += m.g ? '<div class="navg">'+esc(m.g)+'</div>'
             : '<button class="navi" data-v="'+m.id+'" onclick="go(\''+m.id+'\')">'+esc(m.n)+'</button>';
  });
  $('side').innerHTML=h;
  $('dw-pane').innerHTML='<div class="dw-h"><div class="av" style="background:'+CUR.color+'">'+
    esc(CUR.name.charAt(0))+'</div><div><b>'+esc(CUR.name)+'</b><small>'+esc(CUR.pos)+'</small></div></div>'+
    h.replace(/onclick="go\(/g,'onclick="closeDrawer();go(')+
    '<button class="dw-out" onclick="doLogout()">로그아웃</button>';
  var lbl={}; MENUS[CUR.role].forEach(function(m){ if(m.id) lbl[m.id]=m.n; });
  $('tabbar').innerHTML = TABBAR[CUR.role].map(function(id){
    return '<button data-v="'+id+'" onclick="go(\''+id+'\')">'+esc(lbl[id]||id)+'</button>'; }).join('')
    + '<button onclick="openDrawer()">전체메뉴</button>';
}
function renderCtx(){
  /* 앱에 맞게 바꾼다 — 대상 기간 · 범위 · 상태 등 "지금 보고 있는 것" */
  $('ctxbar').innerHTML='<span class="cx">대상</span><b>2026년 8월</b>'+
    '<span class="cx">범위</span><b>전체</b><span class="tag t-info">데모 모드</span>';
}
function go(id){
  if(!VIEWS[id]) { toast('준비 중인 화면입니다.'); return; }
  VIEW=id;
  $('main').innerHTML = VIEWS[id]();
  $('main').scrollTop=0; window.scrollTo(0,0);
  ['side','tabbar','dw-pane'].forEach(function(c){
    var box=$(c); if(!box) return;
    box.querySelectorAll('[data-v]').forEach(function(b){ b.classList.toggle('on', b.dataset.v===id); });
  });
}
function openDrawer(){ $('drawer').classList.add('open'); }
function closeDrawer(){ $('drawer').classList.remove('open'); }

var toastT;
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); }, 3000);
}
function openModal(title, body, foot){
  $('mw').innerHTML='<div class="mh"><h3>'+esc(title)+'</h3>'+
    '<button class="mx" onclick="closeModal()" aria-label="닫기">✕</button></div>'+
    '<div class="mb">'+body+'</div>'+(foot?'<div class="mf">'+foot+'</div>':'');
  $('modal').classList.add('open');
}
function closeModal(){ $('modal').classList.remove('open'); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeModal(); closeDrawer(); } });

/* 로그인 화면의 데모 계정 목록 */
(function(){
  $('lg-accts').innerHTML = USERS.map(function(u){
    return '<button class="acct" onclick="fillAcct(\''+u.id+'\')">'+
      '<span class="av" style="background:'+u.color+'">'+esc(ROLE_N[u.role].charAt(0))+'</span>'+
      '<span><span class="nm">'+esc(u.name)+'<span>'+esc(ROLE_N[u.role])+'</span></span>'+
      '<span class="ps">'+esc(u.pos)+'</span></span></button>';
  }).join('');
})();
</script>
</body>
</html>
