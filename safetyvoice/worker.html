<style>
:root{--green:#005C3B;--green-d:#00422A;--navy:#00422A;--lime:#009C64;--bg:#eef1f1;--card:#fff;--line:#e4e9ec;--ink:#1b2d3e;--muted:#6b7a86;--zenqual:#48688d;--hi:#C00000;--mid:#C77800;--lo:#2E7D4F;--shadow-l:0 2px 7px rgba(34,46,55,.045)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{overflow-x:hidden}
body{overflow-x:hidden;max-width:100vw;font-family:'Nanum Gothic','Malgun Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.app{max-width:480px;margin:auto;min-height:100vh;position:relative}
@media (min-width:640px){
  body{background:var(--bg);padding:28px 0}
  .app{max-width:600px;min-height:auto;background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,66,42,.12);overflow:hidden}
  header{border-radius:0}
}
@media (min-width:1024px){
  .app{max-width:680px}
}
header{background:#fff;color:var(--ink);padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:3px solid var(--green);display:flex;align-items:center;justify-content:space-between}
.bname{font-size:20px;font-weight:800;letter-spacing:1.5px;color:var(--dg,var(--navy))}.bname b{color:var(--green)}
.bsub{font-size:12px;opacity:.75;margin-top:2px;font-weight:600;color:var(--muted)}
.cloud{font-size:10.5px;font-weight:800;background:#EEF5F0;color:var(--green);border:1px solid var(--line);padding:5px 10px 5px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.cloud::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.rd{padding:14px 14px 130px}
.rd-lab{font-size:12px;font-weight:800;color:#3f4d54;margin:18px 0 10px;display:flex;align-items:center;gap:7px}
.rd-lab::before{content:"";width:14px;height:4px;border-radius:2px;background:var(--green)}
.rd-lab small{font-weight:600;color:var(--muted)}
.rd-hero{position:relative;overflow:hidden;border-radius:10px;padding:22px 18px;color:var(--ink);min-height:220px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-l)}
.rd-hstripe{position:absolute;top:0;left:0;right:0;height:4px;background:var(--green)}
.rd-eyebrow{font-size:12px;font-weight:800;color:var(--green);letter-spacing:.04em}
.rp-h3{font-size:22px;font-weight:800;line-height:1.25;margin:8px 0 0;letter-spacing:-.02em;color:var(--navy)}
.rp-sub{font-size:12.5px;color:var(--muted);margin-top:8px;max-width:210px;line-height:1.55}.rp-sub b{color:var(--ink)}
.rd-glow{position:absolute;right:-12px;bottom:-46px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(0,156,100,.48),transparent 65%)}
.rp-fig{position:absolute;right:16px;bottom:16px;width:60px;opacity:.95;z-index:1}
.sv-site{display:inline-flex;align-items:center;gap:6px;background:#e9f7ef;color:var(--green-d);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800;margin-top:14px}
.sv-kind{display:flex;gap:8px}
.sv-kind .k{flex:1;text-align:center;border:1px solid var(--line);border-top:3px solid var(--line);background:#fff;border-radius:6px;padding:13px 4px 11px;cursor:pointer;color:#66757c}
.sv-kind .k b{display:block;font-size:13px;font-weight:800;color:var(--ink)}
.sv-kind .k span{display:block;font-size:10.5px;margin-top:2px}
.sv-kind .k.on{border-color:var(--green);border-top-color:var(--green);background:#e9f7ef;box-shadow:none}
.sv-kind .k.danger{border-top-color:var(--hi)}
.sv-kind .k.on.danger{border-color:var(--hi);background:#fdecec;box-shadow:none}
.sv-kind .k.suggest{border-top-color:var(--zenqual)}
.sv-kind .k.on.suggest{border-color:var(--zenqual);background:#e9f0fd;box-shadow:none}
.sv-kind .k.report{border-top-color:var(--green)}
.rp-lv{display:flex;gap:8px}
.rp-lv .lv{flex:1;position:relative}
.rp-lv input{position:absolute;opacity:0;pointer-events:none}
.rp-lv span{display:block;text-align:center;font-size:12.5px;font-weight:800;padding:11px 4px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:#66757c;cursor:pointer}
.rp-lv input:checked+span{border-color:currentColor}
.rp-lv .hi input:checked+span{color:var(--hi);background:#fdecec}.rp-lv .mid input:checked+span{color:#a86d12;background:#fef3e2}.rp-lv .lo input:checked+span{color:var(--lo);background:#e9f7ef}
.rp-fld{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:13px 14px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);margin:0;outline:none}
.rp-fld:focus{border-color:var(--green)}
textarea.rp-fld{min-height:120px;resize:vertical}
.tbm-grid{display:flex;gap:8px;flex-wrap:wrap}
.tbm-th{position:relative;width:74px;height:74px;border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.tbm-th img{width:100%;height:100%;object-fit:cover;display:block}
.tbm-th button{position:absolute;top:3px;right:3px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:13px;line-height:18px;cursor:pointer;padding:0}
.rp-photos{display:flex;gap:9px;margin-top:8px}
.rp-pbtn{flex:1;border:1.5px dashed #cdd6d2;border-radius:8px;padding:15px 0;text-align:center;font-size:12.5px;font-weight:700;color:#66757c;background:#fafcfb;cursor:pointer;font-family:inherit}
.rp-pbtn .i{display:block;font-size:20px;margin-bottom:3px}
.sv-who{display:flex;gap:8px}
.sv-who .w{flex:1;text-align:center;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:12px;font-weight:800;font-size:13px;color:#66757c;cursor:pointer}
.sv-who .w.on{border-color:var(--green);background:#e9f7ef;color:var(--green-d)}
.sv-promise{margin-top:16px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--green);border-radius:6px;padding:12px 14px;font-size:12.5px;color:#55636a;line-height:1.7}
.rp-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:25}
@media (min-width:640px){ .rp-bar{width:min(600px,100%)} }
@media (min-width:1024px){ .rp-bar{width:min(680px,100%)} }
.rp-bar .sum{flex:1;font-size:12px;color:var(--muted);font-weight:700}
.rp-submit{background:linear-gradient(110deg,var(--green-d),var(--green));color:#fff;font-weight:800;font-size:14px;padding:12px 22px;border-radius:12px;border:0;cursor:pointer;box-shadow:0 8px 18px -6px rgba(0,156,100,.5);font-family:inherit;white-space:nowrap}
.rp-submit[disabled]{opacity:.6}
.sv-done{text-align:center;padding:26px 6px}
.sv-done img{width:76px}
.sv-done h2{font-size:22px;font-weight:800;margin:10px 0 4px}
.sv-done .no{display:inline-block;background:var(--navy);color:#fff;font-weight:800;font-size:16px;border-radius:6px;padding:10px 18px;margin:10px 0;letter-spacing:.6px}
.sv-done p{color:var(--muted);font-size:13.5px;line-height:1.7}
.rd-cta{margin-top:14px;background:var(--green);color:#fff;text-align:center;font-weight:800;font-size:15px;padding:16px;border-radius:8px;box-shadow:none;cursor:pointer}
.rd-edit{width:100%;margin-top:10px;background:#eef2f0;border:1px solid var(--line);border-radius:12px;padding:11px;font-weight:700;font-size:13px;color:#55636a;cursor:pointer;text-align:center}
.tabs{display:flex;background:#e3e9e7;border-radius:8px;padding:4px;gap:2px;margin-top:14px}
.tabs b{flex:1;text-align:center;font-size:13px;font-weight:800;padding:9px;border-radius:11px;color:#66757c;cursor:pointer}
.tabs b.on{background:#fff;color:var(--green-d);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.look{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:14px}
.look .res{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:none}
.sv-mine{margin-top:14px}
.sv-mine .mi{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.sv-mine .mi:last-child{border-bottom:none}
.sv-mine .mi b{font-size:12px;color:var(--ink);font-weight:800}
.sv-mine .mi span{color:var(--muted)}
.tag{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:#eef2f0;color:#66757c}
.tag.st-접수{background:#eef2f0;color:#45524b}.tag.st-대기{background:#fdecec;color:var(--hi)}.tag.st-조치중{background:#fef3e2;color:#a86d12}.tag.st-완료{background:#e9f7ef;color:var(--lo)}
.steps{display:flex;gap:4px;margin:12px 0 5px}.steps i{flex:1;height:7px;border-radius:99px;background:#e4ece7;display:block}.steps i.on{background:var(--green)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
.qrwrap{padding:14px}
.qrwrap textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:13px;min-height:100px}
.qracts{display:flex;gap:8px;margin-top:8px}
.qracts button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 0;font:inherit;font-weight:800;font-size:13px;color:#3f4d54;cursor:pointer}
.qracts button.p{background:var(--green);border-color:var(--green);color:#fff}
.qrgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.qr{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;background:#fff}
.qr h5{margin:0 0 8px;font-size:12.5px;font-weight:800}.qr .c{display:flex;justify-content:center}.qr .c img,.qr .c canvas{width:140px!important;height:140px!important}
.qr small{display:block;font-size:9.5px;color:var(--muted);word-break:break-all;margin-top:4px}
.qr button{margin-top:6px;background:#eef2f0;border:0;border-radius:9px;padding:7px 10px;font:inherit;font-size:11.5px;font-weight:800;color:#3f4d54;cursor:pointer}

@media print{header,.qracts,.qr button,.qrnote{display:none!important}.qrgrid{grid-template-columns:repeat(3,1fr)}.qr{break-inside:avoid}}

#splash{position:fixed;inset:0;z-index:999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s ease, visibility .45s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash img{width:104px;animation:splashPop .6s cubic-bezier(.34,1.56,.64,1)}
#splash .nm{color:var(--navy);font-size:20px;font-weight:900;letter-spacing:.02em}
#splash .en{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.32em;margin-top:2px}
#splash .nm b{color:var(--green)}
#splash .sub{color:var(--muted);font-size:12.5px;margin-top:-8px}
#splash .bar{width:160px;height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
#splash .bar i{display:block;height:100%;width:30%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--lime));animation:splashBar 1.1s ease-in-out infinite}
@keyframes splashPop{0%{transform:scale(.6) translateY(10px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes splashBar{0%{transform:translateX(-120%)}100%{transform:translateX(420%)}}
@media (prefers-reduced-motion:reduce){#splash img{animation:none}#splash .bar i{animation:none;width:100%}}

.credit{margin-top:14px;text-align:center;font-size:11px;color:#9AA8A0;line-height:1.7}
.credit a{color:#6B8FB0;text-decoration:none}
.poster-wrap{display:flex;justify-content:center;margin-top:16px}
.poster{width:210mm;max-width:100%;aspect-ratio:210/297;background:#00422A;padding:14mm 12mm;box-sizing:border-box;color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden;box-shadow:none}
.poster .pstripe{position:absolute;top:0;left:0;right:0;height:6mm;background:repeating-linear-gradient(-45deg,var(--lime) 0 10mm,transparent 10mm 18mm)}
.poster .pzenf{width:34mm;margin-top:12mm}
.poster .ptitle{font-size:9mm;font-weight:900;margin-top:6mm;letter-spacing:-.02em}
.poster .ptitle b{color:var(--lime)}
.poster .psub{font-size:4.2mm;color:#c3d3dc;margin-top:2mm;max-width:150mm}
.poster .pqr{background:#fff;border-radius:6mm;padding:6mm;margin-top:10mm}
.poster .pqr .c canvas,.poster .pqr .c img{width:62mm!important;height:62mm!important}
.poster .psite{margin-top:6mm;font-size:6mm;font-weight:800;background:rgba(255,255,255,.12);border-radius:99px;padding:2.5mm 8mm}
.poster .psteps{display:flex;gap:6mm;margin-top:10mm;width:100%;justify-content:center}
.poster .pstep{flex:1;max-width:48mm;font-size:3.6mm;color:#dce8ee;line-height:1.5}
.poster .pstep .n{width:9mm;height:9mm;border-radius:50%;background:var(--green);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 2mm;font-size:4mm}
.poster .ppromise{margin-top:8mm;font-size:3.6mm;color:#a9bcc7;max-width:160mm;line-height:1.7}
.poster .pfoot{margin-top:auto;padding-top:8mm;font-size:3mm;color:#7d94a1}
.posterbar{display:flex;justify-content:center;gap:8px;margin:14px 0}
.posterbar select{width:auto;min-width:220px}
@media print{
  body *{visibility:hidden}
  #posterPrintArea, #posterPrintArea *{visibility:visible}
  #posterPrintArea{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:0}
  .poster{width:210mm;height:297mm;border-radius:0;box-shadow:none;page-break-after:always}
  .posterbar{display:none!important}
}

function fmtKST(iso){ const d=new Date(iso), k=new Date(d.getTime()+9*3600*1000), p=n=>String(n).padStart(2,'0');
  const date=`${k.getUTCFullYear()}-${p(k.getUTCMonth()+1)}-${p(k.getUTCDate())}`, time=`${p(k.getUTCHours())}:${p(k.getUTCMinutes())}`;
  return {date,time,datetime:`${date} ${time}`,no:`ZF-${k.getUTCFullYear()}${p(k.getUTCMonth()+1)}${p(k.getUTCDate())}-${p(k.getUTCHours())}${p(k.getUTCMinutes())}`}; }
function resizeImg(file){ return new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=1024; let w=img.width,h=img.height; if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>max){w=Math.round(w*max/h);h=max;} const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',.72)); }; img.src=fr.result; }; fr.readAsDataURL(file); }); }

async function submit(){
  const content=($('svContent').value||'').trim();
  if(!S.kind) return toast('어떤 내용인지 먼저 골라주세요');
  const site=S.site||(($('svSite')||{}).value||''); if(!site) return toast('사업장을 선택해 주세요');
  if(content.length<2) return toast('내용을 적어주세요');
  if(S.role==='driver'){ const cv=($('svCompany')||{}).value; if(cv!==undefined) S.company=cv.trim(); if(!S.company) return toast('소속 업체명을 적어주세요'); }
  const name=S.anon?'':(($('svName')||{}).value||'').trim(); const zone=(S.zone||'').trim();
  const ts=new Date().toISOString(), t=fmtKST(ts);
  const body={ reportNo:t.no, datetime:t.datetime, title:`[${SV_KIND[S.kind].n}] ${content.replace(/\s+/g,' ').slice(0,40)}${content.length>40?'\u2026':''}`,
    level:S.kind==='danger'?S.level:'하', hero:'zenf', zone: zone?`${site} \u00B7 ${zone}`:site, content, status:'접수', reporter:S.anon?(S.role==='driver'?('협력사·'+(S.company||'기사님')):'익명'):(S.role==='driver'?`${S.company} · ${name||'기사님'}`:(name||'현장')), photos:S.photos,
    source:'voice', kind:S.kind, site, area:zone, anonymous:S.anon, reporterType:S.role, company:S.role==='driver'?S.company:'' };
  const btn=$('svSend'); btn.disabled=true; btn.textContent='보내는 중\u2026';
  localStorage.setItem('sv_site',site);
  let ok=false;
  try{ const r=await fetch(RELAY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); const d=await r.json(); ok=!!(d&&d.ok); }catch(e){}
  if(!ok){ const q=JSON.parse(localStorage.getItem('sv_queue')||'[]'); q.push(body); localStorage.setItem('sv_queue',JSON.stringify(q)); }
  const mine=JSON.parse(localStorage.getItem('sv_mine')||'[]'); mine.unshift({no:t.no,ts,kind:S.kind,site}); localStorage.setItem('sv_mine',JSON.stringify(mine.slice(0,20)));
  $('main').innerHTML=`<div class="rd"><div class="sv-done"><img src="${IMG.thanks}" alt=""><h2>잘 받았어요!</h2><div class="no">접수번호 ${t.no}</div>
    <button class="rp-pbtn" style="max-width:220px;margin:4px auto 0" onclick="navigator.clipboard.writeText('${t.no}').then(()=>toast('접수번호를 복사했어요'))">📋 접수번호 복사</button>
    <p>담당자가 확인하고 조치할게요.<br>말해주셔서 고마워요 \u2014 현장이 조금 더 안전해졌어요.</p>
    ${ok?'':'<p style="color:#c47611;font-weight:700">지금은 연결이 안 돼서 폰에 보관했어요. 연결되면 자동으로 보낼게요.</p>'}
    <p style="font-size:12px">이 기기에서는 <b>내 신고 확인</b>에 자동으로 남지만, 브라우저를 바꾸거나 앱을 지우면 목록이 안 보일 수 있어요.<br>접수번호를 복사해두시면 <b>내 신고 확인</b>에서 언제든 다시 조회할 수 있어요.</p>
    <div class="rd-cta" onclick="reset()">하나 더 말하기</div></div></div>`;
  window.scrollTo(0,0);
}
function reset(){ S.kind=null; S.photos=[]; S.anon=true; S.level='중'; if(!S.fromQR) S.zone=''; S.view='form'; render(); }
async function flushQueue(){ const q=JSON.parse(localStorage.getItem('sv_queue')||'[]'); if(!q.length) return;
  try{ const r=await fetch(RELAY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q[0])}); const d=await r.json(); if(d&&d.ok){ q.shift(); localStorage.setItem('sv_queue',JSON.stringify(q)); toast('보관했던 신고를 보냈어요'); flushQueue(); } }catch(e){} }
window.addEventListener('online',flushQueue); flushQueue();
fetch(RELAY.replace(/\/$/,'')+'/reports',{cache:'no-store'}).then(r=>r.ok?null:Promise.reject()).catch(()=>{ const c=$('cloud'); if(c) c.textContent='연결 확인 중'; });

function quickLook(no){ S.view='look'; render(); const el=$('lookNo'); if(el){ el.value=no; } lookup(); }
async function lookup(){
  const no=($('lookNo').value||'').trim().toUpperCase(); if(!no) return;
  const R=$('lookRes'); R.style.display='block'; R.innerHTML='<p style="color:var(--muted);font-size:13px">확인 중\u2026</p>';
  try{
    const r=await fetch(RELAY.replace(/\/$/,'')+'/reports',{cache:'no-store'}); const d=await r.json();
    const list=(d&&d.reports)||[]; const hit=list.find(x=>(x.reportNo||'').toUpperCase()===no || fmtKST(x.ts||x.datetime||0).no===no);
    if(!hit){ R.innerHTML='<p style="color:var(--muted);font-size:13px">해당 접수번호를 찾지 못했어요. 번호를 다시 확인해 주세요.</p>'; return; }
    const st=hit.status||'접수', order=['접수','대기','조치중','완료'], i=order.indexOf(st);
    R.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(no)}</b><span class="tag st-${st}">${st}</span></div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:4px">${esc(hit.title||'')}</div>
      <div class="steps">${order.map((s,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)"><span>접수</span><span>대기</span><span>조치중</span><span>완료</span></div>
      ${hit.memo||hit.reply?`<div style="margin-top:10px;background:#e9f7ef;border-radius:12px;padding:10px 12px;font-size:13px">\uD83D\uDCAC ${esc(hit.reply||hit.memo)}</div>`:''}`;
  }catch(e){ R.innerHTML='<p style="color:var(--muted);font-size:13px">서버에 연결할 수 없어요.</p>'; }
}
async function lookupByPhone(){
  const raw=($('lookPhone').value||'').replace(/\D/g,'');
  const R=$('lookPhoneRes');
  if(raw.length<8){ R.innerHTML='<p style="color:var(--muted);font-size:12.5px;margin-top:8px">전화번호를 정확히 입력해 주세요.</p>'; return; }
  R.innerHTML='<p style="color:var(--muted);font-size:13px;margin-top:8px">확인 중\u2026</p>';
  try{
    const r=await fetch(RELAY.replace(/\/$/,'')+'/reports',{cache:'no-store'}); const d=await r.json();
    const list=((d&&d.reports)||[]).filter(x=>x.source==='voice');
    const hits=list.filter(x=>(x.reporter||'').replace(/\D/g,'').indexOf(raw)>=0 && raw.length>=8).sort((a,b)=>new Date(b.ts||b.datetime)-new Date(a.ts||a.datetime));
    if(!hits.length){ R.innerHTML='<p style="color:var(--muted);font-size:12.5px;margin-top:8px">이 번호로 남긴 신고를 찾지 못했어요. 익명으로 보내셨다면 조회가 안 돼요.</p>'; return; }
    R.innerHTML='<div class="sv-mine" style="margin-top:8px">'+hits.map(x=>{
      const no=x.reportNo||fmtKST(x.ts||x.datetime||0).no;
      return `<div class="mi" onclick="quickLook('${esc(no)}')"><b>${esc(no)}</b><span>${esc(SV_KIND[x.kind]?SV_KIND[x.kind].n:'')} · ${esc(x.status||'접수')} · ${fmtKST(x.ts||x.datetime).datetime}</span></div>`;
    }).join('')+'</div>';
  }catch(e){ R.innerHTML='<p style="color:var(--muted);font-size:13px;margin-top:8px">서버에 연결할 수 없어요.</p>'; }
}

    <div id="qrSubArea"></div>
    <div class="credit">제작 및 문의 센터장 이민아 (제니엘 제조사업부) · <a href="tel:01052490831">010-5249-0831</a> · <a href="tel:01058850832">010-5885-0832</a> · <a href="mailto:malee@zeniel.co.kr">malee@zeniel.co.kr</a></div>
  </div>`;
  renderQrSub(sub);
}
function setQrSub(btn){
  const s=btn.dataset.s; document.querySelectorAll('.qrsub').forEach(b=>b.classList.toggle('on',b===btn));
  location.hash='#qr|'+s; renderQrSub(s);
}
function renderQrSub(sub){
  const area=$('qrSubArea'); if(!area) return;
  if(sub==='poster') return renderPosterUI(area);
  area.innerHTML=`
    <p class="qrnote" style="font-size:12.5px;color:var(--muted);margin:0 0 8px">한 줄에 하나씩. 사업장 또는 라인\u00B7구역 단위로 만들어 게시판\u00B7휴게실\u00B7라인 옆, 도크\u00B7하차장에 붙이세요.</p>
    <div class="tabs" style="margin-top:0"><b class="qrrole on" data-r="employee" onclick="setQrRole(this)">현장 인원용</b><b class="qrrole" data-r="driver" onclick="setQrRole(this)">협력사 기사님용 (도크)</b></div>
    <textarea id="qrList">${SV_SITES.join('\n')}</textarea>
    <div class="qracts"><button class="p" onclick="makeQR()">QR 만들기</button><button onclick="window.print()">인쇄</button><button onclick="location.hash='';render()">신고 화면</button></div>
    <div class="qrgrid" id="qrGrid"></div>`;
  makeQR();
}
let qrRole='employee';
function setQrRole(btn){ qrRole=btn.dataset.r; document.querySelectorAll('.qrrole').forEach(b=>b.classList.toggle('on',b===btn)); makeQR(); }
function makeQR(){
  const base=location.origin+location.pathname, g=$('qrGrid'); if(!g) return; g.innerHTML='';
  ($('qrList').value||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(n=>{
    const url=`${base}?site=${encodeURIComponent(n)}${qrRole==='driver'?'&role=driver':''}`; const d=document.createElement('div'); d.className='qr';
    d.innerHTML=`<h5>${esc(n)}</h5><div class="c"></div><small>${esc(url)}</small><button>이미지 저장</button>`;
    new QRCode(d.querySelector('.c'),{text:url,width:140,height:140,correctLevel:QRCode.CorrectLevel.M});
    d.querySelector('button').onclick=()=>{ const c=d.querySelector('canvas'),im=d.querySelector('img'); const src=c?c.toDataURL('image/png'):(im&&im.src); if(!src) return; const a=document.createElement('a'); a.href=src; a.download=`QR_${n.replace(/\s+/g,'_')}.png`; a.click(); };
    g.appendChild(d); });
}

/* ---- 부착문 (인쇄용 포스터) ---- */
let posterRole='employee';
function renderPosterUI(area){
  area.innerHTML=`
    <p class="qrnote" style="font-size:12.5px;color:var(--muted);margin:0 0 8px">현장에 그대로 붙이는 안내문입니다. 사업장을 고르고 인쇄하세요 (A4 세로).</p>
    <div class="tabs" style="margin-top:0"><b class="qrrole on" data-r="employee" onclick="setPosterRole(this)">현장 인원용</b><b class="qrrole" data-r="driver" onclick="setPosterRole(this)">협력사 기사님용 (도크)</b></div>
    <div class="posterbar">
      <select id="posterSite">${SV_SITES.map(x=>`<option>${x}</option>`).join('')}<option>기타</option></select>
      <input id="posterCustom" class="rp-fld" style="display:none;max-width:220px" placeholder="사업장/구역 직접 입력">
      <button class="btn-poster" onclick="makePoster()" style="background:var(--green);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer">부착문 만들기</button>
      <button onclick="window.print()" style="background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer">인쇄</button>
    </div>
    <div id="posterPrintArea"><div class="poster-wrap" id="posterHolder"></div></div>`;
  $('posterSite').addEventListener('change', function(){ $('posterCustom').style.display = this.value==='기타' ? 'block' : 'none'; });
  makePoster();
}
function setPosterRole(btn){ posterRole=btn.dataset.r; document.querySelectorAll('#qrSubArea .qrrole').forEach(b=>b.classList.toggle('on',b===btn)); makePoster(); }
function makePoster(){
  const sel=$('posterSite'); if(!sel) return;
  const site = sel.value==='기타' ? (($('posterCustom')||{}).value||'').trim() || '기타' : sel.value;
  const base=location.origin+location.pathname;
  const url=`${base}?site=${encodeURIComponent(site)}${posterRole==='driver'?'&role=driver':''}`;
  const holder=$('posterHolder'); if(!holder) return;
  const steps = posterRole==='driver'
    ? [['1','QR을 스캔하세요','핸드폰 카메라로 QR을 비추면 신고 화면이 열려요'],['2','위험\u00B7건의\u00B7제보를 고르세요','소속 업체명만 적으면 이름은 안 남겨도 돼요'],['3','내용을 적어 보내세요','사진을 함께 보내면 더 빨리 확인해요']]
    : [['1','QR을 스캔하세요','핸드폰 카메라로 QR을 비추면 신고 화면이 열려요'],['2','위험\u00B7건의\u00B7제보를 고르세요','익명으로도 편하게 보낼 수 있어요'],['3','내용을 적어 보내세요','사진을 함께 보내면 더 빨리 확인해요']];
  holder.innerHTML = `<div class="poster">
    <div class="pstripe"></div>
    <img class="pzenf" src="${IMG.zenf}" alt="">
    <div class="ptitle">세이프티 <b>보이스</b></div>
    <div class="psub">${posterRole==='driver' ? '납품하시다가 불편하거나 위험한 게 있으면 알려주세요' : '현장의 목소리가 안전을 만듭니다'}</div>
    <div class="psite">${esc(site)}${posterRole==='driver' ? ' \u00B7 협력사 기사님용' : ''}</div>
    <div class="pqr"><div class="c"></div></div>
    <div class="psteps">${steps.map(s=>`<div class="pstep"><div class="n">${s[0]}</div><b>${s[1]}</b><div>${s[2]}</div></div>`).join('')}</div>
    <div class="ppromise">내용은 센터장과 안전관리자만 봅니다 \u00B7 말했다는 이유로 어떤 불이익도 없습니다</div>
    <div class="pfoot">ZENIEL 제조사업부 \u00B7 센터장 이민아 \u00B7 문의 010-5249-0831 \u00B7 010-5885-0832</div>
  </div>`;
  new QRCode(holder.querySelector('.c'), { text:url, width:240, height:240, correctLevel:QRCode.CorrectLevel.M });
}
window.addEventListener('hashchange',render);
render();
(function(){
  var t0=Date.now(), MIN=1650;
  function hide(){ var sp=document.getElementById('splash'); if(!sp) return; var wait=Math.max(0, MIN-(Date.now()-t0)); setTimeout(function(){ sp.classList.add('hide'); setTimeout(function(){ sp.remove(); }, 500); }, wait); }
  if(document.readyState==='complete') hide(); else window.addEventListener('load', hide);
  setTimeout(hide, 2500); // safety fallback
})();
</script>
</body>
</html>
