<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEN Manufacturing Agent · AP 대전공장 통합 관제</title>
<meta name="theme-color" content="#0a1626">
<style>
  :root{
    --bg:#0a1626; --panel:#111f34; --panel2:#0f1b2e; --line:#1c3350; --line2:#24405f;
    --ink:#e8f0fb; --muted:#8aa0bd; --muted2:#6d84a3;
    --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --purple:#a855f7; --teal:#14b8a6;
    --shadow:0 8px 26px rgba(0,0,0,.45); --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 80% -10%,#14284480 0,transparent 60%),
      radial-gradient(1000px 600px at 5% 110%,#12203a80 0,transparent 55%),var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}

  /* ===== Sidebar ===== */
  .nav{background:linear-gradient(180deg,#0d1b2e,#0a1626);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .nav .logo{padding:6px 8px 14px}
  .nav .logo .t{font-size:18px;font-weight:800}
  .nav .logo .t span{color:var(--blue)}
  .nav .logo .s{font-size:11px;color:var(--muted);margin-top:2px}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:#c6d4e6;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid transparent;transition:.13s}
  .nav a .ic{font-size:17px;width:22px;text-align:center}
  .nav a .badge{margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px}
  .nav a:hover{background:#122443}
  .nav a.on{background:linear-gradient(180deg,#173359,#12294a);border-color:#2b5286;color:#fff}
  .nav .spacer{flex:1}
  .nav .plant{border:1px solid var(--line);border-radius:11px;padding:11px;background:#0e1f36;font-size:12px}
  .nav .plant .r{display:flex;justify-content:space-between;margin:3px 0;color:var(--muted)}
  .nav .plant .r b{color:var(--ink)}

  /* ===== Stage ===== */
  .stage{padding:18px 22px 30px;min-width:0}
  .bar{display:flex;align-items:center;gap:16px;margin-bottom:16px}
  .bar h1{font-size:22px;font-weight:800;margin:0}
  .bar .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .bar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .bar .clock{text-align:right;font-size:12.5px}
  .bar .clock .d{font-weight:700}
  .bar .clock .r{color:var(--green);display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:3px;font-size:11px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .btn{border:1px solid var(--line2);background:linear-gradient(180deg,#16294480,#0f1f36);color:var(--ink);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:.14s}
  .btn:hover{border-color:var(--blue);background:#173056}

  /* cards & primitives */
  .card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:var(--shadow);padding:16px}
  .card h3{margin:0 0 13px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .card h3 .hint{font-size:11.5px;color:var(--muted);font-weight:600}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .kpi{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:var(--shadow);padding:14px 15px;position:relative;overflow:hidden}
  .kpi .ic{position:absolute;right:13px;top:12px;font-size:19px;opacity:.85}
  .kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600}
  .kpi .val{font-size:26px;font-weight:800;margin-top:6px}
  .kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
  .kpi .delta{font-size:11.5px;font-weight:700;margin-top:4px}
  .pos{color:#4ade80}.neg{color:#ff6b6b}.zero{color:var(--muted)}
  .tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;display:inline-block}
  .t-red{background:#3a1717;color:#ff8a8a;border:1px solid #6d2626}
  .t-amber{background:#2c2410;color:#ffcf5a;border:1px solid #6b551b}
  .t-green{background:#132a1c;color:#69e08e;border:1px solid #1f5a37}
  .t-blue{background:#122a4a;color:#7fb8ff;border:1px solid #274a7a}
  .sdot{display:inline-block;width:11px;height:11px;border-radius:50%}
  .s-red{background:var(--red);box-shadow:0 0 8px #ef444488}
  .s-green{background:var(--green);box-shadow:0 0 8px #22c55e88}
  .s-amber{background:var(--amber);box-shadow:0 0 8px #f59e0b88}
  .s-blue{background:var(--blue);box-shadow:0 0 8px #3b82f688}

  table.tb{width:100%;border-collapse:collapse;font-size:13px}
  table.tb th{color:var(--muted2);font-weight:600;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line)}
  table.tb th:first-child{text-align:left}
  table.tb td{padding:9px 8px;text-align:right;border-bottom:1px solid #14263e;font-weight:700}
  table.tb td:first-child{text-align:left}
  table.tb tr:last-child td{border-bottom:none}

  /* progress bar */
  .pbar{height:9px;border-radius:6px;background:#13253d;overflow:hidden}
  .pbar>i{display:block;height:100%;border-radius:6px}
  .barrow{display:grid;grid-template-columns:96px 1fr 74px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #14263e;font-size:13px}
  .barrow:last-child{border-bottom:none}
  .barrow .nm{font-weight:700}
  .barrow .vv{text-align:right;font-weight:800}

  /* donut/legend/factory reused */
  .donut{width:130px;height:130px;position:relative;flex:0 0 auto;border-radius:50%}
  .donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut .mid .t{font-size:11px;color:var(--muted)}.donut .mid .n{font-size:20px;font-weight:800}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;flex:1}
  .legend .li{display:flex;align-items:center;gap:8px}.legend .sw{width:11px;height:11px;border-radius:3px}.legend .li b{margin-left:auto}

  .lines-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .lbox{border-radius:12px;padding:12px 13px;border:1px solid #ffffff14;box-shadow:0 6px 16px #00000055,inset 0 1px 0 #ffffff18}
  .lbox .lh{display:flex;align-items:center;gap:9px}
  .lbox .lname{font-size:14.5px;font-weight:800;color:#fff}
  .lbox .cnt{font-size:19px;font-weight:800;color:#fff;margin-top:3px}
  .lbox .cnt small{font-size:12px;opacity:.85}
  .pill{margin-left:auto;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px;color:#fff;background:#00000038;border:1px solid #ffffff40}
  .ppl{margin-top:9px;display:flex;flex-wrap:wrap;gap:4px}
  .pi{flex:0 0 auto;filter:drop-shadow(0 1px 1px #0005)}
  .pi.on{color:#fff}.pi.leave{color:#ffe08a}.pi.absent{color:#ff9a9a}.pi.edu{color:#7fd0ff}.pi.empty{color:#ffffff3d}
  .l-tube{background:linear-gradient(150deg,#2f6f33,#22521f)}.l-fill{background:linear-gradient(150deg,#2563a8,#173b6e)}
  .l-once{background:linear-gradient(150deg,#8a7220,#5f4d13)}.l-cham{background:linear-gradient(150deg,#158a7d,#0d5f56)}
  .l-hnb{background:linear-gradient(150deg,#7b3fb0,#4d2879)}.l-fnc{background:linear-gradient(150deg,#8a7a20,#5f5313)}

  .list .it{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #14263e}
  .list .it:last-child{border-bottom:none}
  .rank{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:#14294a;border:1px solid var(--line2);flex:0 0 auto}
  .rank.top{background:#3a1717;border-color:#6d2626;color:#ff8a8a}
  .muted{color:var(--muted)}.mut2{color:var(--muted2)}
  .big{font-size:24px;font-weight:800}
  .mini{font-size:11.5px;color:var(--muted)}
  .chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#13253d;border:1px solid var(--line);color:#bcd}

  .reco{display:flex;gap:11px;align-items:flex-start;background:#0e1f36;border:1px solid var(--line2);border-radius:11px;padding:12px;margin-bottom:10px}
  .reco .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#14294a;border:1px solid var(--line2);flex:0 0 auto;font-size:16px}
  .reco.warn{background:#241a0e;border-color:#6b551b}.reco.warn .ic{background:#2a2110;border-color:#6b551b}
  .reco.bad{background:#241010;border-color:#6d2626}.reco.bad .ic{background:#2a1414;border-color:#6d2626}
  .reco .tx .r{font-weight:800;font-size:14px}.reco .tx .s{font-size:12px;color:var(--muted);margin-top:2px}

  .report-doc{background:#0c1728;border:1px solid var(--line);border-radius:12px;padding:18px 20px;font-size:13.5px;line-height:1.9}
  .report-doc h4{margin:0 0 4px;font-size:16px}
  .report-doc .kv{color:var(--muted)}
  .report-doc ul{margin:8px 0;padding-left:18px}
  .report-doc li{margin:3px 0}

  a.cardlink{text-decoration:none;color:inherit;display:block;transition:.14s;cursor:pointer}
  a.cardlink:hover .card{border-color:var(--blue);transform:translateY(-2px)}
  .agentcard .top{display:flex;align-items:center;gap:11px}
  .agentcard .ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#122443;border:1px solid var(--line2)}
  .agentcard .nm{font-weight:800;font-size:15px}
  .agentcard .ds{font-size:11.5px;color:var(--muted);margin-top:1px}
  .agentcard .metric{margin-top:12px;display:flex;align-items:flex-end;justify-content:space-between}
  .agentcard .metric .m{font-size:23px;font-weight:800}

  @media (max-width:1080px){
    .app{grid-template-columns:1fr}
    .nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:auto}
    .nav .logo,.nav .spacer,.nav .plant{display:none}
    .nav a{flex:0 0 auto}
    .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}
    .lines-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="nav" id="nav"></aside>
  <main class="stage">
    <div class="bar">
      <div>
        <h1 id="vTitle">통합 관제</h1>
        <div class="sub" id="vSub">AP 대전공장 · 8 Agent 통합 대시보드</div>
      </div>
      <div class="right">
        <div class="clock">
          <div class="d" id="clock">2025.05.10 (금) 09:30</div>
          <div class="r"><span class="dot"></span> 자동 갱신 중</div>
        </div>
        <button class="btn" onclick="alert('데이터를 새로고침했습니다. (데모)')">⟳ 새로고침</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
/* ==================== SHARED CHART HELPERS ==================== */
function gauge(pct,{color='#22c55e',size=150}={}){
  const r=60,cx=80,cy=80,f=Math.max(0,Math.min(1,pct/100)),a=Math.PI*(1-f);
  const x=(cx+r*Math.cos(a)).toFixed(1), y=(cy-r*Math.sin(a)).toFixed(1);
  return `<svg viewBox="0 0 160 92" width="${size}" style="display:block">
    <path d="M20 80 A60 60 0 0 1 140 80" fill="none" stroke="#1c3350" stroke-width="12" stroke-linecap="round"/>
    <path d="M20 80 A60 60 0 0 1 ${x} ${y}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"/>
  </svg>`;
}
function donut(segs,{size=130,center='',centerSub=''}={}){
  let acc=0,st=[];segs.forEach(s=>{const f=acc;acc+=s.pct;st.push(`${s.color} ${f}% ${acc}%`);});
  if(acc<100)st.push(`#1c3350 ${acc}% 100%`);
  return `<div class="donut" style="width:${size}px;height:${size}px;background:conic-gradient(${st.join(',')})">
    <div style="position:absolute;inset:15px;border-radius:50%;background:#0f1b2e"></div>
    <div class="mid"><span class="t">${centerSub}</span><span class="n">${center}</span></div></div>`;
}
function lineChart(data,{w=560,h=200,max,min=0,pad={l:34,r:16,t:18,b:26},stroke='#3b82f6',fill='#3b82f633',showVals=true,colorAt,grid=4}={}){
  const mx=max ?? Math.ceil(Math.max(...data.map(d=>d.v))*1.15);
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const X=i=>pad.l+(data.length<2?iw/2:(i/(data.length-1))*iw);
  const Y=v=>pad.t+(1-(v-min)/(mx-min))*ih;
  let g='';
  for(let k=0;k<=grid;k++){const gv=min+(mx-min)*k/grid,y=Y(gv);
    g+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#17293f"/>`;
    g+=`<text x="${pad.l-6}" y="${y+3}" font-size="9" text-anchor="end" fill="#6d84a3">${Math.round(gv)}</text>`;}
  const pts=data.map((d,i)=>[X(i),Y(d.v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${pts[0][0]} ${Y(min)} `+pts.map(p=>`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')+` L${pts[pts.length-1][0]} ${Y(min)} Z`;
  g+=`<path d="${area}" fill="${fill}"/><path d="${line}" fill="none" stroke="${stroke}" stroke-width="2.4" stroke-linejoin="round"/>`;
  data.forEach((d,i)=>{const c=colorAt?colorAt(d.v,d):stroke;
    g+=`<circle cx="${X(i)}" cy="${Y(d.v)}" r="3.2" fill="${c}" stroke="#0a1626" stroke-width="1.4"/>`;
    if(showVals)g+=`<text x="${X(i)}" y="${Y(d.v)-8}" font-size="9.5" font-weight="700" text-anchor="middle" fill="${c}">${d.v}${d.suffix||''}</text>`;
    g+=`<text x="${X(i)}" y="${h-8}" font-size="8.4" text-anchor="middle" fill="#6d84a3">${d.label}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${g}</svg>`;
}
function barsChart(data,{w=560,h=200,max,pad={l:34,r:14,t:16,b:26},grid=4}={}){
  const mx=max ?? Math.ceil(Math.max(...data.map(d=>d.v))*1.12);
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b, bw=iw/data.length*0.56;
  const X=i=>pad.l+(i+0.5)/data.length*iw, Y=v=>pad.t+(1-v/mx)*ih;
  let g='';
  for(let k=0;k<=grid;k++){const gv=mx*k/grid,y=Y(gv);
    g+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#17293f"/>`;
    g+=`<text x="${pad.l-6}" y="${y+3}" font-size="9" text-anchor="end" fill="#6d84a3">${Math.round(gv)}</text>`;}
  data.forEach((d,i)=>{const x=X(i)-bw/2,y=Y(d.v),bh=pad.t+ih-y;
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${d.color||'#3b82f6'}"/>`;
    g+=`<text x="${X(i)}" y="${y-6}" font-size="9.5" font-weight="700" text-anchor="middle" fill="${d.color||'#7fb8ff'}">${d.v}${d.suffix||''}</text>`;
    g+=`<text x="${X(i)}" y="${h-8}" font-size="8.4" text-anchor="middle" fill="#6d84a3">${d.label}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${g}</svg>`;
}
function pbar(pct,color){return `<div class="pbar"><i style="width:${Math.min(100,pct)}%;background:${color}"></i></div>`;}
function pi(cls){return `<svg class="pi ${cls}" width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 1.8c-3.4 0-8 1.7-8 5.1V21h16v-2.1c0-3.4-4.6-5.1-8-5.1Z"/></svg>`;}
function statusColor(v,warn,bad,invert){ // returns hex
  if(invert){return v>=bad?'#ef4444':v>=warn?'#f59e0b':'#22c55e';}
  return v<=bad?'#ef4444':v<=warn?'#f59e0b':'#22c55e';
}

/* ==================== DATA ==================== */
const LINES=[
  {key:'튜브',need:18,cur:17,cls:'l-tube',on:16,leave:1,edu:0,label:'튜브 라인'},
  {key:'치약충전',need:16,cur:16,cls:'l-fill',on:15,leave:1,edu:0,label:'치약충전 라인'},
  {key:'일회용',need:12,cur:10,cls:'l-once',on:9,leave:1,edu:0,label:'일회용 라인'},
  {key:'초격차',need:15,cur:16,cls:'l-cham',on:16,leave:0,edu:0,label:'초격차 라인'},
  {key:'HnB',need:20,cur:18,cls:'l-hnb',on:14,leave:1,edu:3,label:'HnB 라인'},
  {key:'FnC',need:14,cur:15,cls:'l-fnc',on:14,leave:1,edu:0,label:'FnC 라인'},
];
const PROD=[
  {key:'튜브',target:42000,actual:31500,capa:45000,end:'17:40'},
  {key:'치약충전',target:38000,actual:30400,capa:40000,end:'17:10'},
  {key:'일회용',target:60000,actual:39000,capa:68000,end:'18:20'},
  {key:'초격차',target:25000,actual:21250,capa:26000,end:'16:50'},
  {key:'HnB',target:30000,actual:19500,capa:34000,end:'18:40'},
  {key:'FnC',target:28000,actual:23800,capa:30000,end:'16:40'},
];
const PROD_TREND=[ // 시간대별 시간당 실적(전 라인 합, 천개)
  {label:'07',v:14},{label:'08',v:22},{label:'09',v:26},{label:'10',v:25},
  {label:'11',v:24},{label:'12',v:12},{label:'13',v:23},{label:'14',v:0,plan:true}];
const CLEAN=[
  {key:'일회용',score:92,elapsed:9.5,reason:'색상 전환 (백→적) · 세척주기 초과',next:'즉시',cip:'대기'},
  {key:'HnB',score:85,elapsed:7.0,reason:'제품 전환 · 알러지 유발성분 잔류 위험',next:'11:00',cip:'대기'},
  {key:'튜브',score:78,elapsed:11.0,reason:'세척주기 초과 (기준 8h)',next:'11:30',cip:'대기'},
  {key:'초격차',score:42,elapsed:3.2,reason:'동일 제품 연속 생산',next:'14:00',cip:'-'},
  {key:'치약충전',score:40,elapsed:4.0,reason:'동일 제품 연속 생산',next:'14:30',cip:'-'},
  {key:'FnC',score:15,elapsed:0.4,reason:'세척 완료 (09:05)',next:'-',cip:'완료'},
];
const STOCK=[
  {name:'튜브 원단',days:1.2,out:'5/11',unit:'ROLL',qty:38},
  {name:'인쇄 잉크',days:0.8,out:'5/10',unit:'KG',qty:12},
  {name:'라벨',days:2.0,out:'5/12',unit:'천매',qty:9},
  {name:'치약 원료(불소)',days:3.5,out:'5/14',unit:'KG',qty:420},
  {name:'박스',days:6.0,out:'5/16',unit:'EA',qty:3100},
  {name:'캡/뚜껑',days:8.0,out:'5/18',unit:'천개',qty:64},
];
const WAREHOUSE=[

        <div class="tx"><div class="r">${r.n} <span class="tag ${r.c}" style="margin-left:6px">${r.lv}</span></div><div class="s">${r.s}</div></div></div>`).join('')}

// ---- 품질 ----
V.qual=()=>{
  const maxC=Math.max(...QUAL_PARETO.map(p=>p.c)),totC=QUAL_PARETO.reduce((s,p)=>s+p.c,0);
  let cum=0;const par=QUAL_PARETO.map(p=>{cum+=p.c;const w=p.c/maxC*100;
    return `<div class="barrow" style="grid-template-columns:96px 1fr 96px"><div class="nm">${p.name}</div>
      <div>${pbar(w,p.color)}</div><div class="vv mut2" style="font-weight:700">${p.c}건 · 누적 ${Math.round(cum/totC*100)}%</div></div>`;}).join('');
  const lrows=QUAL_LINE.map(q=>{const col=statusColor(q.rate,2.0,2.5,true);
    return `<tr><td>${q.key}</td><td style="color:${col}">${q.rate}%</td><td><span class="sdot ${q.rate>=2.5?'s-red':q.rate>=2.0?'s-amber':'s-green'}"></span></td></tr>`;}).join('');
  return `
  <div class="grid g4" style="margin-bottom:14px">
    <div class="kpi"><div class="ic">🔬</div><div class="lab">금일 불량률</div><div class="val" style="color:#ffcf5a">1.8<small>%</small></div><div class="delta neg">목표 1.5% 초과</div></div>
    <div class="kpi"><div class="ic">📉</div><div class="lab">주간 평균</div><div class="val">1.8<small>%</small></div><div class="delta neg">전주 대비 +0.2%p</div></div>
    <div class="kpi"><div class="ic">🥇</div><div class="lab">최다 불량 유형</div><div class="val">인쇄</div><div class="delta neg">전체의 32%</div></div>
    <div class="kpi"><div class="ic">🚨</div><div class="lab">불량 최다 라인</div><div class="val">일회용</div><div class="delta neg">2.9%</div></div>
  </div>
  <div class="grid g2" style="grid-template-columns:1fr 1fr;margin-bottom:14px">
    <div class="card"><h3>불량률 추이 <span class="hint">최근 7일</span></h3>
      ${lineChart(QUAL_TREND,{max:2.5,stroke:'#f59e0b',fill:'#f59e0b22',colorAt:v=>v>=2.0?'#ef4444':'#f59e0b',showVals:true})}
      <div class="mini" style="text-align:center">점선 목표 1.5% · 3일 연속 초과</div></div>
    <div class="card"><h3>불량 원인 분석 (파레토) <span class="hint">유형별 발생 건수</span></h3>${par}
      <div class="mini" style="margin-top:8px">상위 2개 유형(인쇄+캡)이 전체 불량의 56% 차지 → 우선 개선</div></div>
  </div>
  <div class="grid g2" style="grid-template-columns:1fr 1.4fr">
    <div class="card"><h3>라인별 불량률</h3><table class="tb"><thead><tr><th>라인</th><th>불량률</th><th>상태</th></tr></thead><tbody>${lrows}</tbody></table></div>
    <div class="card"><h3>AI 원인 분석 · 개선 제안</h3>
      <div class="reco bad"><div class="ic">🖨</div><div class="tx"><div class="r">인쇄 불량 급증 (일회용 라인)</div><div class="s">색상 전환 후 판압 편차 추정 · 세척+판압 재교정 권장</div></div></div>
      <div class="reco warn"><div class="ic">🔩</div><div class="tx"><div class="r">캡 체결 불량 (튜브 라인)</div><div class="s">캡 토크값 하한 근접 · 체결 토크 설정 점검</div></div></div>
      <div class="reco"><div class="ic">⚖️</div><div class="tx"><div class="r">충전량 편차</div><div class="s">충전 노즐 3번 편차 큼 · 정기 캘리브레이션 반영</div></div></div>
    </div>
  </div>`;
};

V.kpi=()=>{

      <td style="color:${col}">${k.oee}%</td><td><span class="sdot ${k.oee>=80?'s-green':k.oee>=70?'s-amber':'s-red'}"></span></td></tr>`;}).join('');
  const oeeBars=KPI_LINE.map(k=>({label:k.key,v:k.oee,suffix:'',color:k.oee>=80?'#22c55e':k.oee>=70?'#f59e0b':'#ef4444'}));
  return `
  <div class="grid g4" style="margin-bottom:14px">

    <div class="kpi"><div class="ic">🔬</div><div class="lab">불량률</div><div class="val">1.8<small>%</small></div><div class="delta neg">목표 1.5%</div></div>
  </div>
  <div class="grid g2" style="grid-template-columns:1.2fr 1fr;margin-bottom:14px">
    <div class="card"><h3>라인별 OEE <span class="hint">가동률×성능×품질</span></h3>${barsChart(oeeBars,{max:100,suffix:'%'})}

};

/* ==================== ROUTER ==================== */
function go(id){
  cur=id;
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  const meta=AGENTS.find(a=>a.id===id);
  document.getElementById('vTitle').textContent=meta.name;
  document.getElementById('vSub').textContent=meta.sub;
  document.getElementById('view').innerHTML=(V[id]||(()=>'<div class="card">준비 중</div>'))();
  window.scrollTo({top:0,behavior:'smooth'});
}
function genReport(type){alert(type+' 보고서를 생성했습니다. (데모)\n8개 Agent의 최신 데이터를 취합해 초안을 작성합니다.');}
