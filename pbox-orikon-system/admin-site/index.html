<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1F4E78">
<title>관리자 대시보드 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    :root {
        --navy: #1F4E78;
        --navy-dark: #163a5a;
        --navy-light: #2e75b6;
        --sky: #5B9BD5;
        --sky-light: #A8C8E0;
        --bg-soft: #f5f9fc;
        --text-white: rgba(255,255,255,0.95);
        --text-muted: rgba(255,255,255,0.65);
        --accent: #F59E0B;  /* 관리자 강조 색 */
    }
    
    html, body {
        font-family: 'Nanum Gothic', sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
        color: var(--text-white);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }
    
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 24px 20px 40px;
        position: relative;
    }
    
    /* 배경 장식 */
    body::before {
        content: '';
        position: fixed;
        top: -100px;
        right: -100px;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(91,155,213,0.2) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
    }
    body::after {
        content: '';
        position: fixed;
        bottom: -150px;
        left: -100px;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(46,117,182,0.15) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
    }
    
    /* 관리자 뱃지 */
    .admin-badge {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(245,158,11,0.15);
        border: 1px solid rgba(245,158,11,0.4);
        color: var(--accent);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        z-index: 2;
    }
    
    /* 상단 헤더 */
    .header {
        text-align: center;
        padding: 40px 0 30px;
        position: relative;
        z-index: 1;
    }
    
    .brand-tag {
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--text-muted);
        font-weight: 700;
        margin-bottom: 20px;
    }
    
    .title {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: white;
        margin-bottom: 8px;
        animation: fade-up 0.6s ease-out;
    }
    
    .subtitle {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 400;
        animation: fade-up 0.6s ease-out 0.1s backwards;
    }
    
    @keyframes fade-up {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    /* 카드 컨테이너 */
    .cards {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 18px;
        max-width: 500px;
        width: 100%;
        margin: 20px auto 0;
        padding: 0 4px;
        position: relative;
        z-index: 1;
    }
    
    /* 시스템 카드 */
    .system-card {
        background: rgba(255,255,255,0.06);
        backdrop-filter: blur(10px);
        border: 1.5px solid rgba(255,255,255,0.15);
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
        color: white;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        animation: card-up 0.6s ease-out backwards;
        min-height: 200px;
        justify-content: center;
    }
    
    .system-card:nth-child(1) { animation-delay: 0.2s; }
    .system-card:nth-child(2) { animation-delay: 0.35s; }
    
    @keyframes card-up {
        from { opacity: 0; transform: translateY(30px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .system-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        transition: left 0.5s ease;
    }
    
    .system-card:hover::before {
        left: 100%;
    }
    
    .system-card:hover, .system-card:active {
        background: rgba(255,255,255,0.12);
        border-color: var(--sky);
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
    
    .system-card:active {
        transform: translateY(-1px) scale(0.98);
    }
    
    .card-icon-wrap {
        position: relative;
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    /* 대시보드 아이콘 오버레이 (막대차트 미니) */
    .dashboard-badge {
        position: absolute;
        bottom: -4px;
        right: -8px;
        width: 30px;
        height: 30px;
        background: var(--accent);
        border: 2.5px solid var(--navy-dark);
        border-radius: 8px;
        display: flex;
        align-items: end;
        justify-content: center;
        gap: 2px;
        padding: 4px 3px;
    }
    
    .dashboard-badge span {
        display: block;
        width: 4px;
        background: white;
        border-radius: 1px;
    }
    .dashboard-badge span:nth-child(1) { height: 8px; }
    .dashboard-badge span:nth-child(2) { height: 14px; }
    .dashboard-badge span:nth-child(3) { height: 11px; }
    
    .card-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.3px;
        color: white;
    }
    
    .card-desc {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 400;
        letter-spacing: 0.3px;
    }
    
    .card-kpi {
        display: flex;
        gap: 20px;
        margin-top: 8px;
        padding-top: 14px;
        border-top: 1px dashed rgba(255,255,255,0.15);
        width: 100%;
        justify-content: center;
    }
    
    .kpi-item {
        text-align: center;
    }
    
    .kpi-label {
        font-size: 9px;
        color: var(--text-muted);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 2px;
    }
    
    .kpi-value {
        font-size: 14px;
        font-weight: 700;
        color: var(--sky-light);
        font-variant-numeric: tabular-nums;
    }
    
    .card-arrow {
        position: absolute;
        top: 24px;
        right: 24px;
        color: rgba(255,255,255,0.4);
        font-size: 18px;
        transition: all 0.3s ease;
    }
    
    .system-card:hover .card-arrow {
        color: var(--sky);
        transform: translateX(4px);
    }
    
    /* 하단 크레딧 */
    .footer {
        text-align: center;
        padding: 30px 0 10px;
        position: relative;
        z-index: 1;
    }
    
    .divider {
        width: 50px;
        height: 1.5px;
        background: rgba(255,255,255,0.2);
        margin: 0 auto 12px;
    }
    
    .credit {
        font-size: 10px;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        font-weight: 400;
    }
    
    /* 태블릿/데스크톱 */
    @media (min-width: 700px) {
        body { padding: 60px 40px; }
        .header { padding-top: 60px; }
        .title { font-size: 32px; }
        .subtitle { font-size: 15px; }
        .cards {
            flex-direction: row;
            gap: 24px;
            margin-top: 40px;
            max-width: 900px;
        }
        .system-card {
            flex: 1;
            min-height: 280px;
            padding: 40px 28px;
        }
        .card-icon-wrap { width: 90px; height: 90px; }
        .card-title { font-size: 22px; }
        .dashboard-badge { width: 36px; height: 36px; }
    }
</style>
</head>
<body>
    <div class="admin-badge">◆ ADMIN</div>
    
    <div class="header">
        <div class="brand-tag">ZENIEL × AMOREPACIFIC DAEJEON</div>
        <div class="title">관리자 대시보드</div>
        <div class="subtitle">분석할 시스템을 선택하세요</div>
    </div>
    
    <div class="cards">
        <!-- 오리콘 대시보드 카드 -->
        <a href="./orikon/" class="system-card" id="cardOrikon">

                    <span></span><span></span><span></span>

        <!-- P-BOX 대시보드 카드 -->
        <a href="./pbox/" class="system-card" id="cardPbox">

                    <rect x="8" y="28" width="48" height="26" rx="2" fill="white" stroke="#1F4E78" stroke-width="2"/>
                    <line x1="20" y1="28" x2="20" y2="54" stroke="#A8C8E0" stroke-width="0.6" opacity="0.45"/>
                    <line x1="32" y1="28" x2="32" y2="54" stroke="#A8C8E0" stroke-width="0.6" opacity="0.45"/>

                    <line x1="8" y1="40" x2="56" y2="40" stroke="#A8C8E0" stroke-width="0.6" opacity="0.45"/>

                <div class="kpi-item">

    <div class="footer">

    </div>
</body>
</html>
