name = "zen-integration-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# ── P-BOX·오리콘 프로덕션 D1 (pbox-orikon-db 와 동일 DB, 읽기만) ──────────
# work_records 테이블을 직접 읽어 통합 집계. 공개 URL 불필요.
[[d1_databases]]
binding = "PBOX_DB"
database_name = "data"
database_id = "5229923d-a08b-4a98-a2bd-8a46abb0dd8c"

# ── 나머지 시스템 (준비되면 URL 채우면 자동 확장) ───────────────────────
[vars]
SITE = "AP 대전공장"
UPSTREAM_HEAT = ""        # 예: https://heat-push.<sub>.workers.dev/now
UPSTREAM_SAFECHECK = ""   # 예: https://safecheck.<sub>.workers.dev/summary
UPSTREAM_WASH = ""        # 예: https://wash-db.<sub>.workers.dev/status
MODEL = "claude-haiku-4-5-20251001"   # /brief 요약 모델 (claude-sonnet-5 등으로 교체 가능)

# ANTHROPIC_API_KEY 는 secret 으로:  wrangler secret put ANTHROPIC_API_KEY
# (미설정이어도 /brief 는 규칙기반 요약으로 동작)
